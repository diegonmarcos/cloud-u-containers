services:
  mattermost:
    image: ghcr.io/diegonmarcos/mattermost:latest
    build:
      context: .
      dockerfile_inline: |
        FROM ngrie/mattermost-team-edition-arm:10.11
        COPY docker-compose.yml /opt/cloud-docs/docker-compose.yml
        LABEL org.opencontainers.image.source="https://github.com/diegonmarcos/cloud"
        LABEL org.opencontainers.image.description="mattermost"
        LABEL org.opencontainers.image.title="mattermost"
        LABEL cloud.diegonmarcos.from-image="ngrie/mattermost-team-edition-arm:10.11"
        LABEL cloud.diegonmarcos.registry="ghcr.io/diegonmarcos"
    container_name: mattermost
    network_mode: host
    command: mattermost server
    restart: no
    stop_grace_period: 30s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    dns:
      - 10.0.0.1
      - 1.1.1.1
    env_file:
      - .secrets
    environment:
      - TZ=America/Chicago
      - MM_SQLSETTINGS_DRIVERNAME=postgres
      - MM_SERVICESETTINGS_SITEURL=https://chat.diegonmarcos.com
      - MM_SERVICESETTINGS_LISTENADDRESS=:8065
      - MM_PLUGINSETTINGS_ENABLEUPLOADS=true
      - MM_SERVICESETTINGS_ENABLEINCOMINGWEBHOOKS=true
      - MM_SERVICESETTINGS_ENABLECOMMANDS=true
      - MM_SERVICESETTINGS_ENABLEBOTACCOUNTCREATION=true
      - MM_SERVICESETTINGS_ENABLEUSERACCESSTOKENS=true
      - MM_DISPLAYSETTINGS_EXPERIMENTALTIMEZONE=true
      - MM_LOCALIZATIONSETTINGS_DEFAULTCLIENTLOCALE=en
      - MM_DISPLAYSETTINGS_CLOCKFORMAT=24h
      - MM_SERVICESETTINGS_ALLOWEDUNTRUSTEDINTERNALCONNECTIONS=localhost
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - mattermost_config:/mattermost/config
      - mattermost_data:/mattermost/data
      - mattermost_logs:/mattermost/logs
      - mattermost_plugins:/mattermost/plugins
      - mattermost_client_plugins:/mattermost/client/plugins
    pids_limit: 256
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true

  mattermost-bots:
    image: ghcr.io/diegonmarcos/mattermost-bots:latest
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.12-slim
        COPY ntfy-bridge.py /app/ntfy-bridge.py
        COPY requirements-bridge.txt /app/requirements.txt
        COPY docker-compose.yml /opt/cloud-docs/docker-compose.yml
        LABEL org.opencontainers.image.source="https://github.com/diegonmarcos/cloud"
        LABEL org.opencontainers.image.description="mattermost-bots"
        LABEL org.opencontainers.image.title="mattermost-bots"
        LABEL cloud.diegonmarcos.from-image="python:3.12-slim"
        LABEL cloud.diegonmarcos.registry="ghcr.io/diegonmarcos"
    container_name: mattermost-bots
    network_mode: host
    entrypoint: ["/bin/sh", "-c", "pip install --quiet -r /app/requirements.txt && python /app/ntfy-bridge.py"]
    restart: no
    stop_grace_period: 30s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    dns:
      - 10.0.0.1
      - 1.1.1.1
    env_file:
      - .secrets
    environment:
      - NTFY_URL=http://10.0.0.1:8090
      - TOPICS=vcs_commits,vcs_pull-requests,vcs_issues-releases,cicd_deploy-digest,infra_mesh-health,infra_endpoints,infra_dns,infra_resources,infra_containers,ops_summary,ops_backups,ops_cron,security_audit,security_tls,security_connections,security_yara
      - MM_URL=http://localhost:8065
      - C3_API_URL=http://c3-infra-mcp-api:8080
      - OLLAMA_URL=http://10.0.0.8:11434
      - OLLAMA_MODEL=deepseek-r1:14b-qwen-distill-q8_0
      - OLLAMA_VM=gcp-t4
      - AUTHELIA_OIDC_CLIENT_ID=mattermost-cc
      - AUTHELIA_OIDC_CLIENT_SECRET=${AUTHELIA_OIDC_MATTERMOST_SECRET}
      - AUTHELIA_TOKEN_URL=https://auth.diegonmarcos.com/api/oidc/token
    depends_on:
      mattermost:
        condition: service_started
    pids_limit: 256
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true

  postgres:
    image: ghcr.io/diegonmarcos/mattermost-db:latest
    build:
      context: .
      dockerfile_inline: |
        FROM postgres:16-alpine
        COPY docker-compose.yml /opt/cloud-docs/docker-compose.yml
        LABEL org.opencontainers.image.source="https://github.com/diegonmarcos/cloud"
        LABEL org.opencontainers.image.description="mattermost-db"
        LABEL org.opencontainers.image.title="mattermost-db"
        LABEL cloud.diegonmarcos.from-image="postgres:16-alpine"
        LABEL cloud.diegonmarcos.registry="ghcr.io/diegonmarcos"
    container_name: mattermost-postgres
    network_mode: host
    restart: no
    stop_grace_period: 30s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    dns:
      - 10.0.0.1
      - 1.1.1.1
    env_file:
      - .secrets
    environment:
      - POSTGRES_DB=mattermost
      - POSTGRES_USER=mattermost
      - PGPORT=5435
    volumes:
      - mattermost_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mattermost -d mattermost"]
      interval: 10s
      timeout: 5s
      retries: 5
    pids_limit: 256
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
volumes:
  mattermost_client_plugins:
  mattermost_config:
  mattermost_data:
  mattermost_logs:
  mattermost_plugins:
  mattermost_postgres:
