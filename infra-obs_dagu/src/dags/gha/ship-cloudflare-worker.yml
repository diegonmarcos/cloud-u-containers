name: "Ship → cloudflare-worker"

on:
  push:
    paths:
      - "a_solutions/ba-clo_cloudflare-worker/src/**"
      - ".github/workflows/ship-cloudflare-worker.yml"
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ship-cloudflare-worker
  cancel-in-progress: false

jobs:
  ship:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Update submodules to latest
        run: git submodule update --remote

      - uses: ./.github/actions/setup-deps

      - name: Ship cloudflare-worker
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
        run: bash a_solutions/ba-clo_cloudflare-worker/build.sh ship
