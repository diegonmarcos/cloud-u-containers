schedule: "0 6 * * *"
env:
  - NTFY_URL: http://10.0.0.6:8090
  - AUTHELIA_BEARER_TOKEN: ${AUTHELIA_BEARER_TOKEN}
  - AUTHELIA_TOKEN_URL: ${AUTHELIA_TOKEN_URL}
  - AUTHELIA_OIDC_CLIENT_ID: ${AUTHELIA_OIDC_CLIENT_ID}
  - AUTHELIA_OIDC_CLIENT_SECRET: ${AUTHELIA_OIDC_CLIENT_SECRET}
  - REPORT_IMAGE: ghcr.io/diegonmarcos/cloud-data-reports:latest
mail_on:
  failure: true
  success: false
steps:
  - name: run-cloud-health
    command: |
      # Run the Rust cloud-health-full-daily master report (replaces the old
      # TypeScript health_cloud.ts, retired 2026-04-23). The container writes
      # cloud_health_daily.{md,html,_web.html,json} into the dagu_dagu_data
      # volume (Docker Compose-prefixed name — bare `dagu_data` is a
      # different, empty volume).
      # The container-startup OIDC token (AUTHELIA_BEARER_TOKEN, minted once by
      # fetch-token.sh at boot) expires ~1h later, so scheduled reports run with
      # a stale token → every private/OIDC check false-fails → criticals → red.
      # Mint a fresh client_credentials token per run; fall back to the boot one.
      FRESH_TOKEN=$(curl -s --max-time 10 -X POST "$AUTHELIA_TOKEN_URL" \
        -u "$AUTHELIA_OIDC_CLIENT_ID:$AUTHELIA_OIDC_CLIENT_SECRET" \
        -d "grant_type=client_credentials&scope=authelia.bearer.authz" \
        | grep -o '"access_token":"[^"]*"' | cut -d'"' -f4)
      BEARER="${FRESH_TOKEN:-$AUTHELIA_BEARER_TOKEN}"
      # CLOUD_DATA_DIR points reports-common's find_cloud_data_file at the
      # cloud-source 1_cicd/dist tree (the report cwd is under cloud-data/,
      # which is NOT an ancestor of cloud-source/ — the walk-up can't reach it).
      docker run --pull always --rm --network host \
        -v dagu_dagu_data:/var/lib/dagu/data \
        -v /opt/ssh-keys/dagu:/root/.ssh \
        -e BEARER_TOKEN="$BEARER" \
        -e CLOUD_DATA_DIR=/var/lib/dagu/data/cloud-source/1_cloud-configs/dist \
        -w /var/lib/dagu/data/cloud-data/y_old/reports \
        "$REPORT_IMAGE" daily

      RESULT_JSON=/var/lib/dagu/data/cloud-data/y_old/reports/dist/cloud_health_daily.json
      if [ ! -f "$RESULT_JSON" ]; then
        curl -s -X POST "$NTFY_URL/infra_cloud-health" \
          -H "Authorization: Bearer $AUTHELIA_BEARER_TOKEN" \
          -H "Title: Cloud Health FAILED — no report artefact" \
          -H "Priority: 5" \
          -H "Tags: rotating_light,cloud" \
          -d "cloud-health-full-daily did not write cloud_health_daily.json"
        exit 1
      fi

      CRITICAL=$(jq -r '.exec_summary.critical // 0' "$RESULT_JSON")
      WARNINGS=$(jq -r '.exec_summary.warnings // 0' "$RESULT_JSON")
      OK=$(jq -r '.exec_summary.ok // 0' "$RESULT_JSON")
      FLEET=$(jq -r '"\(.fleet_running)/\(.fleet_total) containers running (\(.fleet_unhealthy) unhealthy)"' "$RESULT_JSON")
      ISSUES=$(jq -r '.exec_summary.top_issues[]? | "  \(.severity): \(.message)"' "$RESULT_JSON" | head -15)

      if [ "$CRITICAL" = "0" ]; then
        curl -s -X POST "$NTFY_URL/infra_cloud-health" \
          -H "Authorization: Bearer $AUTHELIA_BEARER_TOKEN" \
          -H "Title: Cloud Health OK ($WARNINGS warnings)" \
          -H "Priority: 2" \
          -H "Tags: white_check_mark,cloud" \
          -d "$(printf 'Fleet: %s\nOK=%s · WARN=%s · CRIT=%s\n\nDagu: https://workflows.diegonmarcos.com' "$FLEET" "$OK" "$WARNINGS" "$CRITICAL")"
      else
        curl -s -X POST "$NTFY_URL/infra_cloud-health" \
          -H "Authorization: Bearer $AUTHELIA_BEARER_TOKEN" \
          -H "Title: Cloud Health CRITICAL ($CRITICAL critical, $WARNINGS warnings)" \
          -H "Priority: 5" \
          -H "Tags: rotating_light,cloud" \
          -d "$(printf 'Fleet: %s\n\nTop issues:\n%s\n\nDagu: https://workflows.diegonmarcos.com' "$FLEET" "$ISSUES")"
        exit 1
      fi
