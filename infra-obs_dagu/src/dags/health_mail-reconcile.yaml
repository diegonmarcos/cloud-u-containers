# Gmail <-> maddy AND Gmail <-> Stalwart (JMAP) reconciliation. The second step
# (reconcile-stalwart, 2026-10-16) is described at the bottom of this file.
#
#
# health_mail-ingest answers "is mail still arriving?". It cannot answer "did we
# lose a specific message?" — during the 2026-08-13..08-21 blackout the INBOX was
# simply empty, and nothing in the stack ever compared what Gmail holds against
# what maddy holds. The Aug 1..12 gap was only found by hand, weeks later.
#
# This DAG closes that hole: it fingerprints every message Gmail has in a lagged
# window (md5 of the RFC-5322 Message-ID) and checks each one is present in
# maddy. Gmail is the guaranteed primary, so Gmail-minus-maddy is exactly the
# set of mail that was lost in transit.
#
# Two details that are load-bearing:
#
#  * The maddy side fingerprints the WHOLE store, not the same date window.
#    msgs.date is the delivery/injection time, not the origin date — a message
#    backfilled today still carries today's date. Windowing the maddy side would
#    report every recovered message as missing.
#
#  * The Message-ID header is frequently FOLDED onto a continuation line
#    (Outlook/Exchange senders do it constantly). A naive `grep ^Message-ID:`
#    returns an empty value for those, so they silently drop out of the compare
#    and show up as phantom "missing" mail. That mistake sent a real backfill
#    into re-injecting messages that were already present, creating duplicates.
#    The awk below unfolds the header block before extracting.
#
# ntfy takes NO Authorization header — it is WireGuard-bound and accepts
# anonymous publish, and rejects any bearer it does not recognise with 401.
# Sending one made every alert in this repo fail silently for nine days.
#
# --- Auto-repair -----------------------------------------------------------
# Gmail is the durable primary; maddy is only a best-effort mirror fed by a
# Cloudflare Worker whose mesh leg to oci-mail has a measured ~14% transient
# failure rate. The worker retries, but once retries exhaust, the message is
# gone from maddy with nothing but a log line — detection alone (the alert
# above) never closes that gap, it just tells a human about it. So once the
# diff finds mail Gmail has that maddy doesn't, this DAG re-fetches those
# messages from Gmail (by Gmail message id, raw MIME) and re-injects them into
# maddy via SMTP, the same path backfills already use. That makes the system
# eventually-consistent instead of merely alarmed.
#
# MAX_REPAIR caps how many messages get auto-injected in one run. A diff that
# large means something structural broke (worker down, mesh partition, maddy
# outage) rather than the expected trickle of transient drops — blindly
# replaying hundreds of messages is the wrong reflex for that case. Past the
# cap this DAG only alerts, at high priority, and leaves repair to a human.
#
# --- Window and cadence (2026-10-13) ---------------------------------------
# This used to run once a day over `after:<date> before:<date>` with a
# whole-day lag. Gmail interprets yyyy/mm/dd search dates as midnight US
# Pacific, so the newest ~1.5-2 days of mail were never examined: every drop
# on the worker leg sat unrepaired for up to two days, and the 24h
# cross-store check in Health Mail Full (cloud-infra
# 1_cicd/src/ops/cloud-health-mail-full.sh) kept failing on mail this DAG
# would only get to later ("maddy missing 6 of 57", tolerance 3). Now:
#   * Gmail is queried with epoch seconds (exact, timezone-free), ending
#     LAG_MINUTES ago so mail genuinely in flight is not "missing";
#   * the DAG runs every 3h, so the unexamined tail is at most ~3h45m;
#   * the maddy side keeps a per-body-key fingerprint cache inside the maddy
#     container, so a run only parses messages it has not seen before (a cold
#     full scan of ~9.5k bodies took ~50 min on the 1 GB oci-mail VM, which is
#     not affordable 8x a day). The cache lives in the container's /tmp, so a
#     container recreate just costs one cold scan.
#   * a re-send that fails BEFORE the message is handed over (connect, EHLO,
#     MAIL, RCPT, 4xx) is retried in-run; a failure during/after DATA is
#     ambiguous (maddy may have stored it) and is never retried in-run - the
#     next run's diff re-checks presence first, so it cannot duplicate.
# Tester: test_health_mail-reconcile.py (registered in build.json tests).
name: health_mail-reconcile
description: Verify every Gmail message in a lagged window is present in maddy and Stalwart
group: health
tags:
  - mail
  - health
  - reconciliation

schedule: "23 */3 * * *"

env:
  - SSH: "ssh -i /home/dagu/.ssh/vault_id_rsa -o StrictHostKeyChecking=no -o ConnectTimeout=10"
  - NTFY_URL: "http://10.0.0.6:8090"
  # Stalwart JMAP read (me@) for the reconcile-stalwart step.
  - STALWART_LOGIN_PASSWORD: ${STALWART_LOGIN_PASSWORD}
  # Days of history to verify each run. The window ends LAG_MINUTES before
  # now so mail still in flight is never counted as lost.
  - WINDOW_DAYS: "8"
  - LAG_MINUTES: "45"
  # Alert if more than this many messages are missing. 0 = any loss alerts.
  - MISS_THRESHOLD: "0"
  # Safety cap: auto-repair at most this many messages per run. Above this,
  # something structural is broken — alert only, do not auto-inject.
  - MAX_REPAIR: "200"

steps:
  - name: reconcile
    # The Stalwart step must still run when this one alerts (exit 1).
    continueOn:
      failure: true
    command: |
      set -u
      TMP=$(mktemp -d); trap 'rm -rf "$TMP"' EXIT
      # Hand-off to the reconcile-stalwart step: fingerprints this step found
      # missing from maddy (and re-injected). Those reach Stalwart through
      # maddy's durable stalwart_queue, so the Stalwart step must not also
      # inject them. Removed first: absent file = this step did not get to
      # its maddy diff, and the Stalwart step then refuses to run.
      EXCL=/tmp/recon_maddy_missing.fps
      rm -f "$EXCL"

      # Epoch seconds, never yyyy/mm/dd: Gmail reads search DATES as midnight
      # US Pacific, which silently cut the newest 1.5-2 days out of the window.
      # NOW may be preset (tester); busybox date only understands -d @<epoch>.
      # >>> window
      NOW=${NOW:-$(date -u +%s)}
      TO_EPOCH=$((NOW - LAG_MINUTES * 60))
      FROM_EPOCH=$((TO_EPOCH - WINDOW_DAYS * 86400))
      GMAIL_QUERY="after:$FROM_EPOCH before:$TO_EPOCH"
      # <<< window
      FROM=$(date -u -d @$FROM_EPOCH +%Y-%m-%dT%H:%MZ)
      TO=$(date -u -d @$TO_EPOCH +%Y-%m-%dT%H:%MZ)
      echo "window: $GMAIL_QUERY ($FROM .. $TO)"

      # ---- Gmail side -------------------------------------------------------
      # Service-account domain-wide delegation is the only working read path;
      # the gws-primary OAuth client was deleted.
      # Column 5 is the Gmail message id, carried along so a repair step can
      # fetch the raw message directly by id without a second Gmail list call.
      $SSH ubuntu@10.0.0.6 "docker exec -i google-workspace-mcp sh -c 'cat > /tmp/recon_gmail.py'" <<'PYEOF'
      import os, sys, hashlib
      from google.oauth2 import service_account
      from google.auth.transport.requests import Request
      from googleapiclient.discovery import build
      q = sys.argv[1]
      creds = service_account.Credentials.from_service_account_file(
          os.environ.get("GOOGLE_SERVICE_ACCOUNT_KEY_PATH", "/run/secrets/GOOGLE_SERVICE_ACCOUNT_KEY"),
          scopes=["https://www.googleapis.com/auth/gmail.readonly"],
          subject="me@diegonmarcos.com")
      creds.refresh(Request())
      svc = build("gmail", "v1", credentials=creds, cache_discovery=False)
      ids, tok = [], None
      while True:
          r = svc.users().messages().list(userId="me", q=q, maxResults=500, pageToken=tok).execute()
          ids += [m["id"] for m in r.get("messages", [])]
          tok = r.get("nextPageToken")
          if not tok:
              break
      for i in ids:
          try:
              m = svc.users().messages().get(userId="me", id=i, format="metadata",
                      metadataHeaders=["Message-ID", "Subject", "From", "Date"]).execute()
              h = {x["name"].lower(): x["value"] for x in m.get("payload", {}).get("headers", [])}
              mid = h.get("message-id", "").strip().lstrip("<").split(">")[0]
              if not mid:
                  continue
              fp = hashlib.md5(mid.encode()).hexdigest()[:10]
              print("%s\t%s\t%s\t%s\t%s" % (fp, h.get("date", "")[:31],
                                            h.get("from", "")[:50], h.get("subject", "")[:70], i))
          except Exception as e:
              print("ERR\t%s\t%s\t" % (i, e), file=sys.stderr)
      PYEOF

      $SSH ubuntu@10.0.0.6 \
        "docker exec google-workspace-mcp /app/.venv/bin/python /tmp/recon_gmail.py '$GMAIL_QUERY'" \
        > "$TMP/gmail.tsv" 2>"$TMP/gmail.err" || true

      if [ ! -s "$TMP/gmail.tsv" ]; then
        echo "Gmail read produced nothing:"; head -5 "$TMP/gmail.err" || true
        curl -s -X POST "$NTFY_URL/infra_mail-health" \
          -H "Title: Mail reconciliation could not read Gmail" \
          -H "Priority: 4" \
          -H "Tags: warning,email" \
          -d "The reconciliation DAG could not list Gmail for $FROM .. $TO. The service-account read path may be broken. While this is down, silent mail loss is undetectable."
        exit 1
      fi
      cut -f1 "$TMP/gmail.tsv" | sort -u > "$TMP/gmail.fps"
      echo "gmail_messages=$(wc -l < "$TMP/gmail.tsv") distinct_fps=$(wc -l < "$TMP/gmail.fps")"

      # ---- maddy side (whole store, folding-aware) --------------------------
      $SSH ubuntu@10.0.0.3 "docker exec -i maddy sh -c 'cat > /tmp/recon_mid.awk'" <<'AWKEOF'
      BEGIN { cap=0; done=0; mid="" }
      done { next }
      /^\r?$/ { done=1; next }
      cap==1 {
        if ($0 ~ /^[ \t]/) { mid = mid $0; next }
        else { done=1; next }
      }
      { if (tolower($0) ~ /^message-id:/) { cap=1; mid=$0 } }
      END {
        sub(/^[Mm][Ee][Ss][Ss][Aa][Gg][Ee]-[Ii][Dd]:/, "", mid)
        gsub(/[ \t\r\n]/, "", mid)
        sub(/^</, "", mid); sub(/>.*$/, "", mid)
        if (mid != "") print mid
      }
      AWKEOF

      # Incremental: fingerprint only body keys not already in the cache, then
      # print the fingerprints of every key still present in imapsql (keys
      # whose messages were deleted drop out, and are pruned from the cache).
      # Keys without a Message-ID are cached as "-" so they are not re-parsed
      # each run. A key whose body file is not there yet is NOT cached, so it
      # is retried next run. FILENAME==ARGV[1], not NR==FNR: the cache is
      # empty on a cold start, and NR==FNR would then treat every key as a
      # cache line.
      $SSH ubuntu@10.0.0.3 "docker exec -i maddy sh -c 'cat > /tmp/recon_scan.sh'" <<'SCANEOF'
      set -u
      DB=${DB:-/data/imapsql.db}
      MSG_DIR=${MSG_DIR:-/data/messages}
      CACHE=${CACHE:-/tmp/recon_fp_cache.tsv}
      AWK_PROG=${AWK_PROG:-/tmp/recon_mid.awk}
      KEYS="$CACHE.keys"
      touch "$CACHE" || exit 1
      if [ -n "${KEYS_CMD:-}" ]; then
        sh -c "$KEYS_CMD"
      else
        sqlite3 "$DB" "SELECT DISTINCT extBodyKey FROM msgs;"
      fi > "$KEYS.raw" || exit 1
      awk 'NF' "$KEYS.raw" | sort -u > "$KEYS"; rm -f "$KEYS.raw"
      [ -s "$KEYS" ] || exit 1
      awk -F'\t' 'FILENAME==ARGV[1] { seen[$1]; next } !($1 in seen)' "$CACHE" "$KEYS" |
      while IFS= read -r k; do
        [ -f "$MSG_DIR/$k" ] || continue
        m=$(awk -f "$AWK_PROG" "$MSG_DIR/$k" 2>/dev/null)
        if [ -n "$m" ]; then fp=$(printf '%s' "$m" | md5sum | cut -c1-10); else fp=-; fi
        printf '%s\t%s\n' "$k" "$fp" >> "$CACHE"
      done
      awk -F'\t' 'FILENAME==ARGV[1] { live[$1]; next } ($1 in live) && !dup[$1]++' "$KEYS" "$CACHE" > "$CACHE.new" \
        && mv "$CACHE.new" "$CACHE"
      awk -F'\t' '$2 != "-" { print $2 }' "$CACHE" | sort -u
      SCANEOF

      $SSH ubuntu@10.0.0.3 "docker exec maddy sh /tmp/recon_scan.sh" > "$TMP/maddy.fps" 2>/dev/null || true

      if [ ! -s "$TMP/maddy.fps" ]; then
        echo "maddy fingerprint scan produced nothing"
        curl -s -X POST "$NTFY_URL/infra_mail-health" \
          -H "Title: Mail reconciliation could not read maddy" \
          -H "Priority: 4" \
          -H "Tags: warning,email" \
          -d "The reconciliation DAG could not fingerprint the maddy store on oci-mail. maddy or the WG path may be down. Silent mail loss is undetectable while this is failing."
        exit 1
      fi
      echo "maddy_distinct_fps=$(wc -l < "$TMP/maddy.fps")"

      # ---- diff -------------------------------------------------------------
      comm -23 "$TMP/gmail.fps" "$TMP/maddy.fps" > "$TMP/missing.fps"
      MISS=$(wc -l < "$TMP/missing.fps" | tr -d ' ')
      echo "missing_from_maddy=$MISS"
      cp "$TMP/missing.fps" "$EXCL"

      if [ "$MISS" -le "$MISS_THRESHOLD" ]; then
        echo "reconciliation clean"
        exit 0
      fi

      # Re-attach headers so the alert/repair steps name actual messages, not
      # hashes. Column 5 (added above) is the Gmail message id.
      # Exact first-column match, one row per fingerprint. A plain `grep -F -f`
      # matches the 10-hex-char fingerprint ANYWHERE in the line, so it can pull
      # in Gmail ids whose subject/id happens to contain those characters and
      # re-inject mail that was never missing. Duplicating mail is precisely the
      # failure this DAG exists to avoid, so match on $1 only and dedupe.
      awk -F'\t' 'NR==FNR { want[$1]; next } ($1 in want) && !seen[$1]++' \
        "$TMP/missing.fps" "$TMP/gmail.tsv" > "$TMP/missing.tsv"
      cut -f2-4 "$TMP/missing.tsv" | head -15 > "$TMP/sample.txt"
      echo "--- missing sample ---"; cat "$TMP/sample.txt"

      # ---- cap check ----------------------------------------------------
      # A diff bigger than MAX_REPAIR means something structural broke, not
      # the expected trickle of transient worker->mesh drops. Don't blindly
      # replay hundreds of messages — alert loudly and stop.
      if [ "$MISS" -gt "$MAX_REPAIR" ]; then
        curl -s -X POST "$NTFY_URL/infra_mail-health" \
          -H "Title: Mail LOST - $MISS message(s) exceed auto-repair cap ($MAX_REPAIR)" \
          -H "Priority: 5" \
          -H "Tags: rotating_light,email" \
          -d "$(printf '%s message(s) present in Gmail for %s .. %s never reached maddy — above MAX_REPAIR=%s, so auto-repair was skipped. This needs manual review; a diff this large usually means the worker or the mesh leg is structurally broken, not just transient drops.\n\nSample:\n%s\n' \
                "$MISS" "$FROM" "$TO" "$MAX_REPAIR" "$(cat "$TMP/sample.txt")")"
        exit 1
      fi

      # ---- repair ---------------------------------------------------------
      # Re-fetch each missing message from Gmail by id and re-inject it into
      # maddy over SMTP, exactly like an existing manual backfill does — just
      # with a distinct HELO name so these injections are attributable.
      #
      # Each message ends in exactly one of three states:
      #   REPAIRED_OK    maddy accepted it (250 to DATA).
      #   REPAIRED_DEFER a transient failure. If it happened before DATA was
      #                  sent (connect/EHLO/MAIL/RCPT, 4xx) it was already
      #                  retried in-run. A failure during/after DATA (e.g. the
      #                  2026-10-13 "SMTPServerDisconnected: timed out") is
      #                  ambiguous - maddy may have stored it - so it is NOT
      #                  retried here; the next run (3h) re-diffs first and
      #                  only re-sends if it is still absent. No duplicates.
      #   REPAIRED_FAIL  a permanent 5xx rejection; retrying cannot help.
      cut -f5 "$TMP/missing.tsv" > "$TMP/missing.ids"

      $SSH ubuntu@10.0.0.6 "docker exec -i google-workspace-mcp sh -c 'cat > /tmp/recon_missing_ids.txt'" < "$TMP/missing.ids"

      $SSH ubuntu@10.0.0.6 "docker exec -i google-workspace-mcp sh -c 'cat > /tmp/recon_repair.py'" <<'PYEOF'
      import os, base64, email
      # >>> deliver
      import smtplib, time

      SMTP_HOST, SMTP_PORT, RCPT = "10.0.0.3", 25, "me@diegonmarcos.com"
      PRE_HANDOVER_ATTEMPTS = 3


      class Deferred(Exception):
          """Transient failure; the next run re-diffs before re-sending."""


      def is_permanent(exc):
          if isinstance(exc, smtplib.SMTPRecipientsRefused):
              codes = [c for c, _ in exc.recipients.values()]
              return bool(codes) and all(c >= 500 for c in codes)
          if isinstance(exc, smtplib.SMTPResponseException):
              return exc.smtp_code >= 500
          return False


      def _connect():
          s = smtplib.SMTP(SMTP_HOST, SMTP_PORT, timeout=90)
          s.ehlo("reconcile.diegonmarcos.com")
          return s


      def _close(s):
          if s is None:
              return
          try:
              s.close()
          except Exception:
              pass


      def deliver(return_path, data, connect=_connect, sleep=time.sleep):
          """Send one message. Returns the number of connection attempts.

          Only the steps BEFORE the message is handed over are retried:
          nothing has been transferred yet, so a retry cannot duplicate.
          DATA is sent once; if it fails the outcome is unknown and the
          caller must leave it to the next run's presence check.
          """
          last = None
          for attempt in range(1, PRE_HANDOVER_ATTEMPTS + 1):
              s = None
              try:
                  s = connect()
                  code, resp = s.mail(return_path)
                  if code != 250:
                      raise smtplib.SMTPSenderRefused(code, resp, return_path)
                  code, resp = s.rcpt(RCPT)
                  if code not in (250, 251):
                      raise smtplib.SMTPRecipientsRefused({RCPT: (code, resp)})
              except (OSError, smtplib.SMTPException) as e:
                  _close(s)
                  if is_permanent(e):
                      raise
                  last = e
                  if attempt < PRE_HANDOVER_ATTEMPTS:
                      sleep(15 * attempt)
                  continue
              # ---- handed over from here: never retried in this run ----
              try:
                  s.data(data)
              except (OSError, smtplib.SMTPException) as e:
                  _close(s)
                  if is_permanent(e):
                      raise
                  raise Deferred("during DATA: %r" % (e,))
              try:
                  s.quit()
              except (OSError, smtplib.SMTPException):
                  _close(s)
              return attempt
          raise Deferred("before DATA, %d attempts: %r" % (PRE_HANDOVER_ATTEMPTS, last))
      # <<< deliver

      from google.oauth2 import service_account
      from google.auth.transport.requests import Request
      from googleapiclient.discovery import build

      ids = [l.strip() for l in open("/tmp/recon_missing_ids.txt") if l.strip()]

      creds = service_account.Credentials.from_service_account_file(
          os.environ.get("GOOGLE_SERVICE_ACCOUNT_KEY_PATH", "/run/secrets/GOOGLE_SERVICE_ACCOUNT_KEY"),
          scopes=["https://www.googleapis.com/auth/gmail.readonly"],
          subject="me@diegonmarcos.com")
      creds.refresh(Request())
      svc = build("gmail", "v1", credentials=creds, cache_discovery=False)

      sent = deferred = failed = 0
      for i in ids:
          subj = ""
          try:
              raw = svc.users().messages().get(userId="me", id=i, format="raw").execute()["raw"]
              data = base64.urlsafe_b64decode(raw.encode())
              msg = email.message_from_bytes(data)
              subj = (msg.get("Subject") or "")[:70]
              rp = (msg.get("Return-Path") or "").strip("<> ") or "reconcile@diegonmarcos.com"
              tries = deliver(rp, data)
              sent += 1
              print("REPAIRED_OK\t%s\t%s\t%d" % (i, subj, tries), flush=True)
          except Deferred as e:
              deferred += 1
              print("REPAIRED_DEFER\t%s\t%s" % (i, str(e)[:160]), flush=True)
          except Exception as e:
              # Gmail fetch errors land here too: nothing was sent, so a
              # retry next run is safe, but they are not counted as deferred
              # unless transient - a permanent 5xx is a real failure.
              if is_permanent(e):
                  failed += 1
                  print("REPAIRED_FAIL\t%s\t%s" % (i, repr(e)[:160]), flush=True)
              else:
                  deferred += 1
                  print("REPAIRED_DEFER\t%s\t%s" % (i, repr(e)[:160]), flush=True)
      print("REPAIRED %d DEFERRED %d FAILED %d" % (sent, deferred, failed), flush=True)
      PYEOF

      $SSH ubuntu@10.0.0.6 \
        "docker exec google-workspace-mcp /app/.venv/bin/python /tmp/recon_repair.py" \
        > "$TMP/repair.log" 2>"$TMP/repair.err" || true

      cat "$TMP/repair.log" || true

      # >>> verdict
      SUMMARY=$(grep -E '^REPAIRED [0-9]+ DEFERRED [0-9]+ FAILED [0-9]+$' "$TMP/repair.log" | tail -1)
      if [ -n "$SUMMARY" ]; then
        SENT=$(echo "$SUMMARY" | awk '{print $2}')
        DEFERRED=$(echo "$SUMMARY" | awk '{print $4}')
        RFAILED=$(echo "$SUMMARY" | awk '{print $6}')
      else
        # The repair script itself died: nothing is known, treat all as failed.
        SENT=0; DEFERRED=0; RFAILED=$MISS
      fi
      if [ "$RFAILED" -gt 0 ]; then
        VERDICT=failed        # permanent rejection or a crashed repair run
      elif [ "$SENT" -eq 0 ] && [ "$DEFERRED" -gt 0 ]; then
        VERDICT=failed        # nothing got through at all: path is down
      elif [ "$DEFERRED" -gt 0 ]; then
        VERDICT=partial       # some transient misses; next run re-checks
      else
        VERDICT=ok
      fi
      # <<< verdict
      echo "repaired=$SENT deferred=$DEFERRED failed=$RFAILED verdict=$VERDICT"

      grep '^REPAIRED_OK' "$TMP/repair.log" | cut -f3 | head -15 > "$TMP/repaired_subjects.txt"

      if [ "$VERDICT" = ok ]; then
        curl -s -X POST "$NTFY_URL/infra_mail-health" \
          -H "Title: Mail auto-repaired - $SENT message(s) recovered from Gmail" \
          -H "Priority: 3" \
          -H "Tags: email,white_check_mark" \
          -d "$(printf '%s message(s) present in Gmail for %s .. %s were missing from maddy and have been re-injected via SMTP.\n\nRepaired:\n%s\n' \
                "$SENT" "$FROM" "$TO" "$(cat "$TMP/repaired_subjects.txt")")"
        echo "auto-repair complete: $SENT repaired, 0 deferred, 0 failed"
        exit 0
      fi

      if [ "$VERDICT" = partial ]; then
        curl -s -X POST "$NTFY_URL/infra_mail-health" \
          -H "Title: Mail auto-repaired - $SENT recovered, $DEFERRED deferred to next run" \
          -H "Priority: 3" \
          -H "Tags: email,hourglass" \
          -d "$(printf 'Auto-repair for %s .. %s: %s re-injected into maddy, %s hit a transient SMTP failure. The next run (every 3h) re-checks those against maddy and re-sends only the ones still absent.\n\nRepaired:\n%s\n' \
                "$FROM" "$TO" "$SENT" "$DEFERRED" "$(cat "$TMP/repaired_subjects.txt")")"
        echo "auto-repair partial: $SENT repaired, $DEFERRED deferred to the next run"
        exit 0
      fi

      curl -s -X POST "$NTFY_URL/infra_mail-health" \
        -H "Title: Mail auto-repair FAILED - $SENT of $MISS re-injected" \
        -H "Priority: 5" \
        -H "Tags: rotating_light,email" \
        -d "$(printf 'Auto-repair for %s .. %s: %s repaired, %s deferred, %s FAILED permanently (or the repair run crashed). See this DAG run log for the REPAIRED_FAIL/REPAIRED_DEFER lines. Manual review needed.\n\nRepaired:\n%s\n' \
              "$FROM" "$TO" "$SENT" "$DEFERRED" "$RFAILED" "$(cat "$TMP/repaired_subjects.txt")")"
      exit 1

  # ---- Stalwart leg (2026-10-16) -------------------------------------------
  # Stalwart (JMAP store) is a first-class inbound copy, fed by maddy's durable
  # stalwart_queue (max_tries 20). If that queue exhausts, the message is in
  # Gmail and maddy but not Stalwart - nothing else would notice. This step
  # fingerprints the WHOLE Stalwart store over JMAP (Email/get messageId, same
  # md5(Message-ID)[:10] as the Gmail side), diffs Gmail against it, and:
  #   * fingerprints just repaired into maddy by the step above are skipped
  #     (maddy's queue delivers them to Stalwart);
  #   * everything else is re-injected straight into Stalwart's MX-style SMTP
  #     ingest (10.0.0.3:2025), NOT via maddy: maddy already holds these and
  #     has no Message-ID dedup, so going through it would duplicate in maddy.
  # Neither Stalwart nor maddy dedups on Message-ID, so presence is always
  # checked first (the diff) and a failure during/after DATA is never retried
  # in-run (same rule as the maddy repair).
  - name: reconcile-stalwart
    depends:
      - reconcile
    command: |
      set -u
      TMP=$(mktemp -d); trap 'rm -rf "$TMP"' EXIT
      EXCL=/tmp/recon_maddy_missing.fps
      if [ ! -f "$EXCL" ]; then
        echo "maddy phase did not complete; skipping Stalwart diff"; exit 1
      fi
      NOW=${NOW:-$(date -u +%s)}
      TO_EPOCH=$((NOW - LAG_MINUTES * 60))
      FROM_EPOCH=$((TO_EPOCH - WINDOW_DAYS * 86400))
      GMAIL_QUERY="after:$FROM_EPOCH before:$TO_EPOCH"
      echo "window: $GMAIL_QUERY"

      # Gmail side: same service-account path as the step above; the script
      # /tmp/recon_gmail.py was left in the container by that step.
      $SSH ubuntu@10.0.0.6 \
        "docker exec google-workspace-mcp /app/.venv/bin/python /tmp/recon_gmail.py '$GMAIL_QUERY'" \
        > "$TMP/gmail.tsv" 2>"$TMP/gmail.err" || true
      if [ ! -s "$TMP/gmail.tsv" ]; then
        echo "Gmail read produced nothing"; head -5 "$TMP/gmail.err" || true; exit 1
      fi
      cut -f1 "$TMP/gmail.tsv" | sort -u > "$TMP/gmail.fps"

      # Stalwart side: whole store over JMAP (read-only), password on stdin.
      $SSH ubuntu@10.0.0.6 "docker exec -i google-workspace-mcp sh -c 'cat > /tmp/recon_stalwart.py'" <<'PYEOF'
      # >>> jmap
      import sys, json, base64, hashlib, ssl, urllib.request

      BASE = "https://10.0.0.3:2443"
      USER = "me@diegonmarcos.com"
      PAGE = 500


      def fingerprints(message_ids):
          return sorted({hashlib.md5(m.strip().lstrip("<").split(">")[0].encode()).hexdigest()[:10]
                         for m in message_ids if m and m.strip()})


      def run(call, page=PAGE):
          """call(method_calls) -> JMAP methodResponses. Yields every messageId."""
          pos = 0
          while True:
              r = call([
                  ["Email/query", {"accountId": ACCT, "position": pos, "limit": page}, "q"],
                  ["Email/get", {"accountId": ACCT, "properties": ["messageId"],
                                 "#ids": {"resultOf": "q", "name": "Email/query", "path": "/ids"}}, "g"],
              ])
              ids = r[0][1]["ids"]
              for e in r[1][1]["list"]:
                  for m in e.get("messageId") or []:
                      yield m
              if len(ids) < page:
                  return
              pos += len(ids)
      # <<< jmap

      ACCT = None
      if __name__ == "__main__":
          pw = sys.stdin.read().strip()
          auth = "Basic " + base64.b64encode(("%s:%s" % (USER, pw)).encode()).decode()
          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          ctx.verify_mode = ssl.CERT_NONE

          def http(url, body=None):
              req = urllib.request.Request(url, data=body, headers={"Authorization": auth,
                                           "Content-Type": "application/json"})
              return json.load(urllib.request.urlopen(req, timeout=120, context=ctx))

          sess = http(BASE + "/.well-known/jmap")
          ACCT = sess["primaryAccounts"]["urn:ietf:params:jmap:mail"]
          api = sess["apiUrl"]
          if api.startswith("http") and "://" in api:
              api = BASE + "/" + api.split("/", 3)[3]

          def call(mc):
              return http(api, json.dumps({"using": ["urn:ietf:params:jmap:core",
                          "urn:ietf:params:jmap:mail"], "methodCalls": mc}).encode())["methodResponses"]

          for fp in fingerprints(run(call)):
              print(fp)
      PYEOF

      printf '%s' "$STALWART_LOGIN_PASSWORD" | $SSH ubuntu@10.0.0.6 \
        "docker exec -i google-workspace-mcp /app/.venv/bin/python /tmp/recon_stalwart.py" \
        > "$TMP/stalwart.fps" 2>"$TMP/stalwart.err" || true
      if [ ! -s "$TMP/stalwart.fps" ]; then
        echo "Stalwart JMAP fingerprint scan produced nothing"; head -5 "$TMP/stalwart.err" || true
        curl -s -X POST "$NTFY_URL/infra_mail-health" \
          -H "Title: Mail reconciliation could not read Stalwart" \
          -H "Priority: 4" -H "Tags: warning,email" \
          -d "The reconciliation DAG could not fingerprint the Stalwart JMAP store on oci-mail. Silent loss of the Stalwart copy is undetectable while this is failing."
        exit 1
      fi
      sort -u "$TMP/stalwart.fps" -o "$TMP/stalwart.fps"
      echo "stalwart_distinct_fps=$(wc -l < "$TMP/stalwart.fps")"

      # >>> stalwart-diff
      sort -u "$EXCL" > "$TMP/excl.fps"
      comm -23 "$TMP/gmail.fps" "$TMP/stalwart.fps" | comm -23 - "$TMP/excl.fps" > "$TMP/missing.fps"
      # <<< stalwart-diff
      MISS=$(wc -l < "$TMP/missing.fps" | tr -d ' ')
      echo "missing_from_stalwart=$MISS"
      if [ "$MISS" -le "$MISS_THRESHOLD" ]; then echo "stalwart reconciliation clean"; exit 0; fi

      awk -F'\t' 'NR==FNR { want[$1]; next } ($1 in want) && !seen[$1]++' \
        "$TMP/missing.fps" "$TMP/gmail.tsv" > "$TMP/missing.tsv"
      cut -f2-4 "$TMP/missing.tsv" | head -15 > "$TMP/sample.txt"
      echo "--- missing sample ---"; cat "$TMP/sample.txt"
      if [ "$MISS" -gt "$MAX_REPAIR" ]; then
        curl -s -X POST "$NTFY_URL/infra_mail-health" \
          -H "Title: Stalwart copy LOST - $MISS message(s) exceed auto-repair cap ($MAX_REPAIR)" \
          -H "Priority: 5" -H "Tags: rotating_light,email" \
          -d "$(printf '%s message(s) in Gmail+maddy never reached Stalwart (%s). Auto-repair skipped (above MAX_REPAIR). Sample:\n%s\n' "$MISS" "$GMAIL_QUERY" "$(cat "$TMP/sample.txt")")"
        exit 1
      fi

      cut -f5 "$TMP/missing.tsv" > "$TMP/missing.ids"
      $SSH ubuntu@10.0.0.6 "docker exec -i google-workspace-mcp sh -c 'cat > /tmp/recon_missing_ids_sw.txt'" < "$TMP/missing.ids"
      $SSH ubuntu@10.0.0.6 "docker exec -i google-workspace-mcp sh -c 'cat > /tmp/recon_repair_sw.py'" <<'PYEOF'
      import os, base64, email
      # >>> deliver-stalwart
      import smtplib, time

      SMTP_HOST, SMTP_PORT, RCPT = "10.0.0.3", 2025, "me@diegonmarcos.com"
      PRE_HANDOVER_ATTEMPTS = 3


      class Deferred(Exception):
          """Transient failure; the next run re-diffs before re-sending."""


      def is_permanent(exc):
          if isinstance(exc, smtplib.SMTPRecipientsRefused):
              codes = [c for c, _ in exc.recipients.values()]
              return bool(codes) and all(c >= 500 for c in codes)
          if isinstance(exc, smtplib.SMTPResponseException):
              return exc.smtp_code >= 500
          return False


      def deliver(return_path, data, connect=None, sleep=time.sleep):
          """Send one message to Stalwart's MX ingest; only pre-DATA steps retry."""
          connect = connect or (lambda: smtplib.SMTP(SMTP_HOST, SMTP_PORT, timeout=90))
          last = None
          for attempt in range(1, PRE_HANDOVER_ATTEMPTS + 1):
              s = None
              try:
                  s = connect()
                  s.ehlo("reconcile.diegonmarcos.com")
                  code, resp = s.mail(return_path)
                  if code != 250:
                      raise smtplib.SMTPSenderRefused(code, resp, return_path)
                  code, resp = s.rcpt(RCPT)
                  if code not in (250, 251):
                      raise smtplib.SMTPRecipientsRefused({RCPT: (code, resp)})
              except (OSError, smtplib.SMTPException) as e:
                  try:
                      s and s.close()
                  except Exception:
                      pass
                  if is_permanent(e):
                      raise
                  last = e
                  if attempt < PRE_HANDOVER_ATTEMPTS:
                      sleep(15 * attempt)
                  continue
              try:
                  s.data(data)
              except (OSError, smtplib.SMTPException) as e:
                  try:
                      s.close()
                  except Exception:
                      pass
                  if is_permanent(e):
                      raise
                  raise Deferred("during DATA: %r" % (e,))
              try:
                  s.quit()
              except (OSError, smtplib.SMTPException):
                  pass
              return attempt
          raise Deferred("before DATA, %d attempts: %r" % (PRE_HANDOVER_ATTEMPTS, last))
      # <<< deliver-stalwart

      from google.oauth2 import service_account
      from google.auth.transport.requests import Request
      from googleapiclient.discovery import build

      ids = [l.strip() for l in open("/tmp/recon_missing_ids_sw.txt") if l.strip()]
      creds = service_account.Credentials.from_service_account_file(
          os.environ.get("GOOGLE_SERVICE_ACCOUNT_KEY_PATH", "/run/secrets/GOOGLE_SERVICE_ACCOUNT_KEY"),
          scopes=["https://www.googleapis.com/auth/gmail.readonly"],
          subject="me@diegonmarcos.com")
      creds.refresh(Request())
      svc = build("gmail", "v1", credentials=creds, cache_discovery=False)

      sent = deferred = failed = 0
      for i in ids:
          try:
              raw = svc.users().messages().get(userId="me", id=i, format="raw").execute()["raw"]
              data = base64.urlsafe_b64decode(raw.encode())
              msg = email.message_from_bytes(data)
              subj = (msg.get("Subject") or "")[:70]
              rp = (msg.get("Return-Path") or "").strip("<> ") or "reconcile@diegonmarcos.com"
              tries = deliver(rp, data)
              sent += 1
              print("REPAIRED_OK\t%s\t%s\t%d" % (i, subj, tries), flush=True)
          except Deferred as e:
              deferred += 1
              print("REPAIRED_DEFER\t%s\t%s" % (i, str(e)[:160]), flush=True)
          except Exception as e:
              if is_permanent(e):
                  failed += 1
                  print("REPAIRED_FAIL\t%s\t%s" % (i, repr(e)[:160]), flush=True)
              else:
                  deferred += 1
                  print("REPAIRED_DEFER\t%s\t%s" % (i, repr(e)[:160]), flush=True)
      print("REPAIRED %d DEFERRED %d FAILED %d" % (sent, deferred, failed), flush=True)
      PYEOF

      $SSH ubuntu@10.0.0.6 \
        "docker exec google-workspace-mcp /app/.venv/bin/python /tmp/recon_repair_sw.py" \
        > "$TMP/repair.log" 2>"$TMP/repair.err" || true
      cat "$TMP/repair.log" || true

      SUMMARY=$(grep -E '^REPAIRED [0-9]+ DEFERRED [0-9]+ FAILED [0-9]+$' "$TMP/repair.log" | tail -1)
      if [ -n "$SUMMARY" ]; then
        SENT=$(echo "$SUMMARY" | awk '{print $2}'); DEFERRED=$(echo "$SUMMARY" | awk '{print $4}'); RFAILED=$(echo "$SUMMARY" | awk '{print $6}')
      else
        SENT=0; DEFERRED=0; RFAILED=$MISS
      fi
      echo "stalwart repaired=$SENT deferred=$DEFERRED failed=$RFAILED"
      grep '^REPAIRED_OK' "$TMP/repair.log" | cut -f3 | head -15 > "$TMP/repaired_subjects.txt"
      if [ "$RFAILED" -eq 0 ] && { [ "$SENT" -gt 0 ] || [ "$DEFERRED" -eq 0 ]; }; then
        curl -s -X POST "$NTFY_URL/infra_mail-health" \
          -H "Title: Stalwart auto-repaired - $SENT recovered, $DEFERRED deferred" \
          -H "Priority: 3" -H "Tags: email,white_check_mark" \
          -d "$(printf '%s message(s) were in Gmail+maddy but missing from Stalwart and were re-injected into Stalwart:2025 (%s deferred to the next run).\n\n%s\n' "$SENT" "$DEFERRED" "$(cat "$TMP/repaired_subjects.txt")")"
        exit 0
      fi
      curl -s -X POST "$NTFY_URL/infra_mail-health" \
        -H "Title: Stalwart auto-repair FAILED - $SENT of $MISS re-injected" \
        -H "Priority: 5" -H "Tags: rotating_light,email" \
        -d "Stalwart repair: $SENT repaired, $DEFERRED deferred, $RFAILED failed. See the DAG run log."
      exit 1
