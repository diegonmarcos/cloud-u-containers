schedule: "*/5 * * * *"
env:
  - NTFY_URL: http://10.0.0.6:8090
  - AUTHELIA_BEARER_TOKEN: ${AUTHELIA_BEARER_TOKEN}
  - MON_TARGETS: /var/lib/dagu/data/cloud-data/_cloud-data-consolidated.json
mail_on:
  failure: false
  success: false
steps:
  - name: check-mesh-and-notify
    command: |
      # 2026-04-27 migrated: cloud-data-monitoring-targets.json -> _cloud-data-consolidated.json[.vms]
      CONS=""
      for p in /var/lib/dagu/data/cloud-data/_cloud-data-consolidated.json \
               /var/lib/dagu/data/cloud-data/2_configs/dist/_cloud-data-consolidated.json \
               /app/_cloud-data-consolidated.json; do
        [ -f "$p" ] && CONS="$p" && break
      done
      if [ -n "$CONS" ]; then
        MON_TARGETS="${RUNNER_TEMP:-/tmp}/derived-mon-targets.$$.json"
        jq '{
          vms: [.vms | to_entries[]
            | select(.value.wg_ip != null and .value.ssh_alias)
            | {ip: .value.wg_ip, name: .value.ssh_alias, user: .value.user}]
        }' "$CONS" > "$MON_TARGETS"
      else
        for p in /var/lib/dagu/data/cloud-data/cloud-data-monitoring-targets.json \
                 /var/lib/dagu/data/cloud-data/2_configs/dist/cloud-data-monitoring-targets.json \
                 /app/cloud-data-monitoring-targets.json; do
          [ -f "$p" ] && MON_TARGETS="$p" && break
        done
      fi
      FAILED=""
      PEERS=$(if [ -f "$MON_TARGETS" ]; then jq -r '.vms[] | "\(.ip):\(.name):22"' "$MON_TARGETS"; else echo -e "10.0.0.1:gcp-proxy:22\n10.0.0.3:oci-mail:25\n10.0.0.4:oci-analytics:22"; fi)
      echo "$PEERS" | while IFS=: read -r ip name port; do
        [ -z "$ip" ] && continue
        if ! echo QUIT | timeout 3 bash -c "cat > /dev/tcp/$ip/$port" 2>/dev/null; then
          echo "  - $name ($ip) port $port UNREACHABLE" >> /tmp/mesh-failed.$$
        fi
      done
      if [ -f /tmp/mesh-failed.$$ ]; then
        FAILED=$(cat /tmp/mesh-failed.$$)
        rm -f /tmp/mesh-failed.$$
        MSG=$(printf "Unreachable peers:\n%s\n\nAction:\n  ssh <vm> 'wg show'\n  ssh <vm> 'systemctl status wg-quick@wg0'\n\nDagu: https://workflows.diegonmarcos.com" "$FAILED")
        curl -s -X POST "$NTFY_URL/health_mesh" \
          -H "Authorization: Bearer $AUTHELIA_BEARER_TOKEN" \
          -H "Title: Mesh Health FAILED" \
          -H "Priority: 5" \
          -H "Tags: rotating_light" \
          -d "$MSG"
        exit 1
      fi
