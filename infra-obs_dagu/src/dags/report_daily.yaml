schedule: "0 7 * * *"
type: graph
env:
  - NTFY_URL: http://10.0.0.6:8090
  - AUTHELIA_BEARER_TOKEN: ${AUTHELIA_BEARER_TOKEN}
  - NOREPLY_PASSWORD: ${NOREPLY_PASSWORD}
  # Stalwart leg authenticates as me@ (its no-reply@ password is unmanaged at
  # runtime and drifts); me@'s password IS managed. See send.sh.
  - STALWART_LOGIN_PASSWORD: ${STALWART_LOGIN_PASSWORD}
  - HTTP_TO_SMTP_PROXY_API_URL: http://10.0.0.1:8090/
  - HTTP_TO_SMTP_PROXY_API_KEY: ${HTTP_TO_SMTP_PROXY_API_KEY}
  - GITHUB_TOKEN: ${GITHUB_TOKEN}
  - UMAMI_USERNAME: ${UMAMI_USERNAME}
  - UMAMI_PASSWORD: ${UMAMI_PASSWORD}
  # umami is deployed to oci-analytics (wg 10.0.0.4). 10.0.0.6 is oci-apps,
  # where nothing answers on 3006 — the umami section of this report has
  # been silently empty for as long as this line has been wrong.
  - UMAMI_URL: http://10.0.0.4:3006
mail_on:
  failure: true
  success: false
steps:
  # Single step: build + send via the master crate's `ship` target.
  # Entrypoint case `bash|sh)` runs SSH/SOPS setup then exec's the script,
  # so SSH config from /opt/ssh-keys/dagu reaches the cloud-data binaries.
  # The crate's build.sh ship = engine_build + engine_run + send_html (SMTP
  # 10.0.0.3:587). HTML stays inside the image fs; send happens before exit.
  #
  # When the cloud-data-reports image is rebuilt with the `daily-mail`
  # entrypoint target (already in src/), this command can shorten to just
  # `cloud-data-reports:latest daily-mail`.
  - name: daily-mail
    # CLOUD_DATA_DIR points at cloud-infra's 1_cloud-configs/dist/ inside the
    # octocode_repos volume, refreshed every 15 min by ops_git-sync.yaml.
    # Both the entrypoint's SSH-config derivation and the Rust report
    # engine's reports-common::find_cloud_data_file honour this env var,
    # so a single declaration unblocks both consumers.
    #
    # CLOUD_REPO_DIR must be declared, NOT left to the entrypoint's derive.
    # entrypoint.sh infers it by stripping /1_cloud-configs/dist/... off
    # CLOUD_DATA_DIR, which lands on /repos/cloud-infra — and that tree's
    # a_solutions/ is a five-directory husk frozen at the 2026-09-06 split:
    # a_solutions is untracked in cloud-infra now, and ops_git-sync's
    # `git reset --hard` never removes untracked leftovers, so the husk can
    # neither refresh nor be pruned. Everything reached through
    # $CLOUD_REPO_DIR/a_solutions/ would read dead pre-split config forever.
    # cloud-source is the only tree here that carries a live a_solutions
    # (sync_secrets.yaml clones cloud-u-containers into it) and it still
    # carries 2_secrets/ for the entrypoint's sops NOREPLY_PASSWORD probe.
    #
    # NOTE: command: | (literal block) is mandatory — Dagu runs it through
    # bash so $VAR references expand. The previous `>-` (folded) form was
    # exec'd directly, leaving `${HTTP_TO_SMTP_PROXY_API_KEY}` as a literal string
    # in the inner container's env → http-to-smtp-proxy-api returned 401 every day.
    command: |
      docker run --rm --network host \
        --pull always \
        -v /opt/ssh-keys/dagu:/root/.ssh \
        -v dagu_dagu_data:/var/lib/dagu/data \
        -v octocode_repos:/repos:ro \
        -w /var/lib/dagu/data/cloud-source/a_solutions/infra-obs_reports/src \
        -e CLOUD_DATA_DIR=/repos/cloud-infra/1_cloud-configs/dist \
        -e CLOUD_REPO_DIR=/var/lib/dagu/data/cloud-source \
        -e BEARER_TOKEN="$AUTHELIA_BEARER_TOKEN" \
        -e NOREPLY_PASSWORD="$NOREPLY_PASSWORD" \
        -e STALWART_LOGIN_PASSWORD="$STALWART_LOGIN_PASSWORD" \
        `# Do NOT set LOCAL_ENVELOPE_FROM to an address in a LOCAL domain.
         # send.sh defaults it to no-reply@bounce.diegonmarcos.com — an
         # EXTERNAL domain — on purpose: maddy/stalwart then match
         # default_source and route to local_routing (the mailbox). A
         # local-domain envelope matches the outbound remote_queue instead,
         # relays out, and the OCI-relay -> Cloudflare hop drops it on
         # SPF/DKIM/DMARC. maddy still logs "submission: accepted" then
         # "delivered", so it reads as success while the mail lands nowhere
         # at all. Proven on report_analytics 2026-08-29: both reports
         # logged delivered and were absent from the IMAP store AND Gmail;
         # removing this line made them arrive on the next run.` \
        -e HTTP_TO_SMTP_PROXY_API_URL="$HTTP_TO_SMTP_PROXY_API_URL" \
        -e HTTP_TO_SMTP_PROXY_API_KEY="$HTTP_TO_SMTP_PROXY_API_KEY" \
        -e GITHUB_TOKEN="$GITHUB_TOKEN" \
        -e UMAMI_USERNAME="$UMAMI_USERNAME" \
        -e UMAMI_PASSWORD="$UMAMI_PASSWORD" \
        -e UMAMI_URL="$UMAMI_URL" \
        ghcr.io/diegonmarcos/cloud-data-reports:latest \
        bash src/cloud-health-full-daily/build.sh ship
      # App SOURCE left cloud-data on 2026-08-19 and left cloud-infra again on
      # 2026-09-06, when a_solutions was split into its own repo
      # (cloud-u-containers). cloud-source/a_solutions is that repo, cloned
      # separately by sync_secrets.yaml — NOT part of the cloud-infra mirror.
      # It is hard-reset hourly all the same, so dist/ output written
      # there is NOT persisted/pushed by anything. DATA still flows to
      # cloud-data as before: copy the fresh dist/ into the (git-pull-rebase,
      # not hard-reset) cloud-data checkout in the same volume, exactly what
      # the GHA workflows' separate "Publish to cloud-data" step does.
      docker run --rm --entrypoint sh \
        -v dagu_dagu_data:/var/lib/dagu/data \
        ghcr.io/diegonmarcos/cloud-data-reports:latest -c '
          set -e
          mkdir -p /var/lib/dagu/data/cloud-data/y_old/reports/dist
          cp -a /var/lib/dagu/data/cloud-source/a_solutions/infra-obs_reports/src/dist/. \
                /var/lib/dagu/data/cloud-data/y_old/reports/dist/
        '
