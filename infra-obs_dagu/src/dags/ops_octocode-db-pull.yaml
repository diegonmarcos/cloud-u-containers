# ops_octocode-db-pull — oci-apps (arm) CONSUMES the cloud-cgc octocode DB from GHCR.
#
# ZERO logic here: this DAG only carries runtime config (mirroring build.json
# .db_publish / .per_repo_publish / .runtime.octocode / .containers) and
# TRIGGERS a universal script on oci-apps (deployed via vm-pilot home-manager,
# same pattern as ops_deploy-pull-up.yaml's /opt/scripts/*.sh). All routines
# (pull → restore volume → restart → notify) live in that script and run
# identically anywhere. Runs after the producer's 04:00 update.
#
# RESTORE_MODE switches which script that is, so the matrix producer (Task 4:
# cloud-cgc-db-restore-all.sh, multi-image base+per-repo restore) can be
# proven out on oci-apps without disturbing the monolith path it replaces
# (cloud-cgc-db-restore.sh, single db_publish.image) — flip to "multi" only
# once the matrix producer (cgc-db-index.yml) is publishing every per-repo
# image AND cgc-db-base green; flip back by reverting this one value.
schedule: "0 5 * * *"
env:
  - SSH: ssh -i /home/dagu/.ssh/vault_id_rsa -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR
  - OCI_APPS: ubuntu@10.0.0.6
  - RESTORE_MODE: monolith # monolith | multi
  - DB_IMAGE: ghcr.io/diegonmarcos/cloud-cgc-pub-mcp-octocode-db:latest
  - DB_VOLUME: octocode_db
  - CGC_DB_IMAGE_PREFIX: ghcr.io/diegonmarcos/cgc-db-
  - CGC_DB_BASE_IMAGE: ghcr.io/diegonmarcos/cgc-db-base:latest
  - CGC_DB_TAG: latest
  - CGC_INDEX_REPOS: "cloud-infra cloud-unix front cloud-mykonsole-dtk cloud-data front-data cloud-android"
  - MCP_CONTAINER: cloud-cgc-pub-mcp
  - NTFY_URL: http://10.0.0.6:8090
mail_on:
  failure: true
  success: false
steps:
  - name: restore
    command: |
      $SSH "$OCI_APPS" bash << REMOTE
      if [ "$RESTORE_MODE" = "multi" ]; then
        SCRIPT=/opt/scripts/cloud-cgc-db-restore-all.sh
      else
        SCRIPT=/opt/scripts/cloud-cgc-db-restore.sh
      fi
      if [ ! -x "\$SCRIPT" ]; then
        echo "SKIP: \$SCRIPT not yet deployed via vm-pilot"
        exit 0
      fi
      if [ "$RESTORE_MODE" = "multi" ]; then
        # No repo checkout on the VM (see cloud-cgc-db-restore.sh's own header)
        # — every value the script would otherwise read from build.json must
        # come in via env. CGC_DB_TARGET_VOLUME routes the final swap through
        # a throwaway container (docker run -v octocode_db:/dst ...) instead
        # of a raw host path, because this SSH user has no host root — see
        # the CGC_DB_TARGET_VOLUME comment in cloud-cgc-db-restore-all.sh.
        CGC_DB_IMAGE_PREFIX="$CGC_DB_IMAGE_PREFIX" CGC_DB_BASE_IMAGE="$CGC_DB_BASE_IMAGE" CGC_DB_TAG="$CGC_DB_TAG" \
        CGC_INDEX_REPOS="$CGC_INDEX_REPOS" CGC_DB_TARGET_VOLUME="$DB_VOLUME" \
        MCP_CONTAINER="$MCP_CONTAINER" NTFY_URL="$NTFY_URL" "\$SCRIPT"
      else
        DB_IMAGE="$DB_IMAGE" DB_VOLUME="$DB_VOLUME" MCP_CONTAINER="$MCP_CONTAINER" NTFY_URL="$NTFY_URL" "\$SCRIPT"
      fi
      REMOTE
