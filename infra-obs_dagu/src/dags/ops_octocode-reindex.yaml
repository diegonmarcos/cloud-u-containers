# ops_octocode-reindex — RETIRED (tombstone, 2026-10-13).
#
# The original DAG was deleted from this source tree long ago (ops_git-sync
# replaced its clone step; the cgc-db GHA producer + ops_octocode-db-pull
# replaced its indexing), but its YAML predates the deploy manifest, so the
# manifest reconciler never knew the VM copy existed and it kept firing at
# 03:00: failing ("unrecognized subcommand 'sh'") and re-cloning the PRIVATE
# cloud-data repo into the octocode_repos volume. Its bug is deliberately NOT
# fixed — "fixed", it would index cloud-data into the PUBLIC octocode_db.
#
# This tombstone exists only so the next ship OVERWRITES the stale VM file
# with one that has no schedule and does nothing, and records it in the
# deploy manifest. The following ship deletes this file from src/, and the
# manifest reconciler then removes it from the VM. Do not re-add a schedule.
description: "RETIRED — no-op tombstone for the legacy octocode reindex; never scheduled"
steps:
  - name: retired
    command: echo "ops_octocode-reindex is retired (see ops_git-sync and ops_octocode-db-pull). Nothing to do."
