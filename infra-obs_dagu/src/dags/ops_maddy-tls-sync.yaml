schedule: "0 3 * * *"
env:
  - NTFY_URL: http://10.0.0.6:8090
  - AUTHELIA_BEARER_TOKEN: ${AUTHELIA_BEARER_TOKEN}
  - RSYNC_SSH: ssh -i /home/dagu/.ssh/vault_id_rsa -o StrictHostKeyChecking=no -o ConnectTimeout=10
mail_on:
  failure: false
  success: false
steps:
  - name: sync-wildcard-cert-to-maddy
    command: |
      # The *.diegonmarcos.com wildcard (covers imap./smtps./mail.) is issued by the LOCAL
      # caddy on oci-mail (caddy_caddy_data volume) and shared by Maddy + Stalwart via
      # /opt/containers/maddy/tls. This DAG used to pull from gcp-proxy, but gcp-proxy went
      # fully-private (2026-05) and no longer holds the LE wildcard, so it shipped the apex-only
      # cert (diegonmarcos.com) → SNI imap.diegonmarcos.com failed "not in certificate". Fix:
      # source the wildcard LOCALLY on oci-mail, ASSERT SAN=*.diegonmarcos.com (never ship apex),
      # install to the shared tls dir, and reload both daemons. Heredoc runs entirely on oci-mail.
      $RSYNC_SSH ubuntu@10.0.0.3 'sudo sh -s' <<'REMOTE'
      set -e
      CERTDIR=/var/lib/docker/volumes/caddy_caddy_data/_data/caddy/certificates
      DST=/opt/containers/maddy/tls
      CRT=$(find "$CERTDIR" -path "*wildcard_.diegonmarcos.com*" -name "*.crt" 2>/dev/null | head -1)
      KEY=$(find "$CERTDIR" -path "*wildcard_.diegonmarcos.com*" -name "*.key" 2>/dev/null | head -1)
      [ -n "$CRT" ] && [ -n "$KEY" ] || { echo "FAIL: no local wildcard cert on oci-mail"; exit 1; }
      openssl x509 -noout -ext subjectAltName -in "$CRT" 2>/dev/null | grep -q '[*].diegonmarcos.com' \
        || { echo "FAIL: cert SAN is not the wildcard — refusing to ship apex"; exit 1; }
      EXPIRY=$(openssl x509 -noout -enddate -in "$CRT" | cut -d= -f2)
      cp "$CRT" "$DST/fullchain.pem"
      cp "$KEY" "$DST/privkey.pem"
      docker restart maddy stalwart >/dev/null 2>&1 || true
      echo "OK: maddy+stalwart wildcard cert installed (expires $EXPIRY)"
      REMOTE
