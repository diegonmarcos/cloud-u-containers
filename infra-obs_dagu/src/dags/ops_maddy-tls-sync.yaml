schedule: "0 3 * * *"
env:
  - NTFY_URL: http://10.0.0.6:8090
  - AUTHELIA_BEARER_TOKEN: ${AUTHELIA_BEARER_TOKEN}
  - RSYNC_SSH: ssh -i /home/dagu/.ssh/vault_id_rsa -o StrictHostKeyChecking=no -o ConnectTimeout=10
mail_on:
  failure: false
  success: false
steps:
  - name: sync-caddy-cert-to-maddy
    command: |
      # Caddy stores wildcard cert for *.diegonmarcos.com on gcp-proxy
      # Maddy on oci-mail needs it for IMAPS/SMTPS TLS
      # Extract cert from Caddy data volume, push to oci-mail

      PROXY="diego@10.0.0.1"
      MAIL="ubuntu@10.0.0.3"
      CERT_SRC="/tmp/maddy-tls-sync"
      CERT_DST="/opt/containers/maddy/tls"

      mkdir -p "$CERT_SRC"

      # Extract wildcard cert from Caddy's data dir on gcp-proxy
      $RSYNC_SSH $PROXY 'mkdir -p /tmp/caddy-cert-export && sudo docker cp caddy:/data/caddy/certificates/acme-v02.api.letsencrypt.org-directory/wildcard_.diegonmarcos.com/. /tmp/caddy-cert-export/ 2>/dev/null && cat /tmp/caddy-cert-export/wildcard_.diegonmarcos.com.crt' > "$CERT_SRC/fullchain.pem" 2>/dev/null || true
      $RSYNC_SSH $PROXY 'cat /tmp/caddy-cert-export/wildcard_.diegonmarcos.com.key' > "$CERT_SRC/privkey.pem" 2>/dev/null || true

      # Verify cert is valid
      if ! openssl x509 -noout -in "$CERT_SRC/fullchain.pem" 2>/dev/null; then
        # Fallback: Caddy's internal cert storage path. MUST target the
        # WILDCARD cert (*.diegonmarcos.com covers mail./imap./smtps.) — Caddy
        # also stores an apex-only cert (diegonmarcos.com), and a bare
        # "*diegonmarcos*" + head -1 grabs the apex, leaving maddy with a cert
        # that fails SAN validation for mail.diegonmarcos.com.
        $RSYNC_SSH $PROXY 'sudo find /var/lib/docker/volumes/caddy_caddy_data/_data/caddy/certificates -name "*.crt" -path "*wildcard_.diegonmarcos.com*" 2>/dev/null | head -1 | xargs sudo cat' > "$CERT_SRC/fullchain.pem" 2>/dev/null || true
        $RSYNC_SSH $PROXY 'sudo find /var/lib/docker/volumes/caddy_caddy_data/_data/caddy/certificates -name "*.key" -path "*wildcard_.diegonmarcos.com*" 2>/dev/null | head -1 | xargs sudo cat' > "$CERT_SRC/privkey.pem" 2>/dev/null || true
      fi

      if ! openssl x509 -noout -in "$CERT_SRC/fullchain.pem" 2>/dev/null; then
        echo "FAILED: Could not extract Caddy wildcard cert"
        curl -s -X POST "$NTFY_URL/ops_maddy" \
          -H "Authorization: Bearer $AUTHELIA_BEARER_TOKEN" \
          -H "Title: Maddy TLS sync FAILED" \
          -H "Priority: 4" \
          -H "Tags: warning,lock" \
          -d "Could not extract Caddy wildcard cert from gcp-proxy"
        rm -rf "$CERT_SRC"
        exit 1
      fi

      EXPIRY=$(openssl x509 -noout -enddate -in "$CERT_SRC/fullchain.pem" | cut -d= -f2)
      echo "Cert valid until: $EXPIRY"

      # Push to oci-mail
      scp -i /home/dagu/.ssh/vault_id_rsa -o StrictHostKeyChecking=no "$CERT_SRC/fullchain.pem" "$CERT_SRC/privkey.pem" "$MAIL:$CERT_DST/"

      # Verify Maddy can read the new cert
      $RSYNC_SSH $MAIL "openssl x509 -noout -enddate -in $CERT_DST/fullchain.pem"

      rm -rf "$CERT_SRC"
      echo "OK: Maddy TLS cert synced (expires $EXPIRY)"
