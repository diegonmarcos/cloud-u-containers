schedule: ""
description: "Manual: Pull + Up all Docker containers on VMs using manifest"
env:
  - SSH_KEY: /home/dagu/.ssh/vault_id_rsa
  - SSH_OPTS: -i /home/dagu/.ssh/vault_id_rsa -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -o ConnectTimeout=10
  - NTFY_URL: http://10.0.0.6:8090
mail_on:
  failure: true
  success: false
steps:
  - name: gcp-proxy
    command: |
      VM=gcp-proxy; IP=10.0.0.1; USER=diego
      # build-vm.json is THIS VM's container manifest, deployed by home-manager.
      # It was "containers-${VM}.json" until 2026-08-23 — a filename that has
      # never existed on any VM, so every run silently took the else branch and
      # rescanned all of /opt/containers/* on all four VMs. Matches the name
      # c3-infra-api uses in shared/libs/docker.ts PULL_UP_CMD.
      MANIFEST="/opt/scripts/build-vm.json"
      echo "── Pull + Up: $VM ──"
      ssh $SSH_OPTS ${USER}@${IP} "
        if [ -f $MANIFEST ] && [ -f /opt/scripts/vm-images-pull-up.sh ]; then
          sudo /opt/scripts/vm-images-pull-up.sh --manifest $MANIFEST
        else
          sudo /opt/scripts/vm-images-pull-up.sh
        fi
      " 2>&1
      RC=$?
      [ $RC -ne 0 ] && curl -sf -X POST "$NTFY_URL/deploy_containers" -H "Title: [$VM] pull-up FAILED" -H "Priority: 4" -d "exit=$RC" 2>/dev/null
      exit $RC
