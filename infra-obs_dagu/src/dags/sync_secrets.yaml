schedule: "0 * * * *"
env:
  - CLOUD_DATA_DIR: /var/lib/dagu/data/cloud-data
  - CLOUD_SOURCE_DIR: /var/lib/dagu/data/cloud-source
  - CLOUD_DATA_REPO: git@github.com:diegonmarcos/cloud-data.git
  - CLOUD_SOURCE_REPO: git@github.com:diegonmarcos/cloud-infra.git
  - CONTAINERS_REPO: git@github.com:diegonmarcos/cloud-u-containers.git
  - NTFY_URL: http://10.0.0.6:8090
  - AUTHELIA_BEARER_TOKEN: ${AUTHELIA_BEARER_TOKEN}
  - GIT_SSH_COMMAND: "ssh -i /home/dagu/.ssh/vault_id_rsa -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR"
mail_on:
  failure: true
  success: false
type: graph
steps:
  - name: ensure-cloud-data
    command: |
      if [ ! -d "$CLOUD_DATA_DIR/.git" ]; then
        git clone "$CLOUD_DATA_REPO" "$CLOUD_DATA_DIR"
        cd "$CLOUD_DATA_DIR"
        git config user.name "dagu-bot"
        git config user.email "no-reply@diegonmarcos.com"
      fi
  - name: ensure-cloud-source
    command: |
      # cloud-infra's own submodules (I_cloud) still need --recurse-submodules.
      # a_solutions is NOT one of them any more — split out to its own repo
      # (cloud-u-containers) on 2026-09-06 (cloud-infra commit 45d7fb87e), so
      # `git submodule update` has nothing to act on for it: no gitlink, no
      # .gitmodules entry. Without an explicit second clone the mirror carries
      # a missing a_solutions/ while the parent commit looks perfectly up to
      # date, so any DAG that runs code from a_solutions — report_daily,
      # report_analytics, and the mail-health liveness derive all do — fails
      # on a path that "obviously" exists in git.
      if [ ! -d "$CLOUD_SOURCE_DIR/.git" ]; then
        git clone --depth 1 --recurse-submodules --shallow-submodules \
          "$CLOUD_SOURCE_REPO" "$CLOUD_SOURCE_DIR"
      else
        cd "$CLOUD_SOURCE_DIR"
        git fetch --depth 1 origin main
        git reset --hard origin/main
        git submodule sync --recursive
        git submodule update --init --recursive --depth 1 --force
      fi
      if [ ! -d "$CLOUD_SOURCE_DIR/a_solutions/.git" ]; then
        rm -rf "$CLOUD_SOURCE_DIR/a_solutions"
        git clone --depth 1 "$CONTAINERS_REPO" "$CLOUD_SOURCE_DIR/a_solutions"
      else
        cd "$CLOUD_SOURCE_DIR/a_solutions"
        git fetch --depth 1 origin main
        git reset --hard origin/main
      fi
  - name: pull-cloud-data
    depends:
      - ensure-cloud-data
    command: |
      cd "$CLOUD_DATA_DIR"
      if ! git diff --quiet HEAD 2>/dev/null || ! git diff --cached --quiet 2>/dev/null; then
        git add -A
        git commit -m "auto: evidence files [skip ci]" || true
      fi
      git pull --rebase origin main || {
        echo "Rebase conflict — resetting to remote"
        git rebase --abort 2>/dev/null
        git fetch origin main
        git reset --hard origin/main
      }
  - name: sync-secrets
    depends:
      - ensure-cloud-source
      - pull-cloud-data
    command: bash "$CLOUD_DATA_DIR/secrets/secrets.sh" sync "$CLOUD_SOURCE_DIR"
  - name: commit-and-push
    depends:
      - sync-secrets
    command: |
      cd "$CLOUD_DATA_DIR"
      git add secrets/src/
      if git diff --cached --quiet; then
        echo "No secret changes — skipping commit"
        exit 0
      fi
      STAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
      git commit -m "sync: secrets ${STAMP}"
      git push origin main
      echo "Pushed secrets at ${STAMP}"
