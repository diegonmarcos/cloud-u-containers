# Trigger Gitea mirror sync for all GitHub repos + verify freshness
# Mirrors declared in ca-dat_gitea/build.json — Gitea syncs automatically every 1h,
# this DAG forces a daily sync and alerts if any mirror is stale (>24h behind).
schedule: "0 6 * * *"
env:
  - NTFY_URL: http://10.0.0.6:8090
  - AUTHELIA_BEARER_TOKEN: ${AUTHELIA_BEARER_TOKEN}
  - SSH_OPTS: "-i /home/dagu/.ssh/vault_id_rsa -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR"
  - GITEA_HOST: 10.0.0.6
  - GITEA_PORT: 3017
  - GITEA_ORG: diego
  - GITEA_TOKEN: ${GITEA_TOKEN}
mail_on:
  failure: true
  success: false
type: graph
steps:
  - name: trigger-mirrors
    command: |
      SSH="ssh $SSH_OPTS ubuntu@$GITEA_HOST"

      if [ -z "$GITEA_TOKEN" ]; then
        echo "SKIP: GITEA_TOKEN not configured in dagu secrets — add it to secrets.yaml to enable mirror sync"
        exit 0
      fi
      AUTH="-H \"Authorization: token $GITEA_TOKEN\""

      echo "=== Triggering mirror sync for all repos ==="
      SYNCED=0
      FAILED=0

      # List all repos in org and trigger mirror sync
      REPOS=$($SSH "curl -sf -H 'Authorization: token $GITEA_TOKEN' http://localhost:$GITEA_PORT/api/v1/orgs/$GITEA_ORG/repos 2>/dev/null | jq -r '.[].name'" 2>/dev/null)

      if [ -z "$REPOS" ]; then
        # Fallback: try listing user repos
        REPOS=$($SSH "curl -sf -H 'Authorization: token $GITEA_TOKEN' http://localhost:$GITEA_PORT/api/v1/user/repos 2>/dev/null | jq -r '.[].name'" 2>/dev/null)
      fi

      if [ -z "$REPOS" ]; then
        echo "ERROR: Cannot list repos from Gitea API"
        exit 1
      fi

      for repo in $REPOS; do
        echo -n "  $repo: "
        RESULT=$($SSH "curl -sf -X POST -H 'Authorization: token $GITEA_TOKEN' http://localhost:$GITEA_PORT/api/v1/repos/$GITEA_ORG/$repo/mirror-sync 2>&1" || echo "FAIL")
        if echo "$RESULT" | grep -q "FAIL\|error\|404"; then
          echo "FAIL ($RESULT)"
          FAILED=$((FAILED + 1))
        else
          echo "OK"
          SYNCED=$((SYNCED + 1))
        fi
      done

      echo ""
      echo "Synced: $SYNCED, Failed: $FAILED"
      [ "$FAILED" -gt 0 ] && exit 1 || true

  - name: verify-freshness
    depends:
      - trigger-mirrors
    command: |
      SSH="ssh $SSH_OPTS ubuntu@$GITEA_HOST"
      STALE=0
      NOW=$(date +%s)
      THRESHOLD=$((24 * 3600))

      echo "=== Checking mirror freshness (max 24h) ==="

      REPOS=$($SSH "curl -sf -H 'Authorization: token $GITEA_TOKEN' http://localhost:$GITEA_PORT/api/v1/orgs/$GITEA_ORG/repos 2>/dev/null | jq -r '.[] | \"\(.name)|\(.updated_at)\"'" 2>/dev/null)

      for entry in $REPOS; do
        REPO=$(echo "$entry" | cut -d'|' -f1)
        UPDATED=$(echo "$entry" | cut -d'|' -f2)
        if [ -n "$UPDATED" ] && [ "$UPDATED" != "null" ]; then
          UPDATED_TS=$(date -d "$UPDATED" +%s 2>/dev/null || echo 0)
          AGE=$(( (NOW - UPDATED_TS) / 3600 ))
          if [ "$AGE" -gt 24 ]; then
            echo "  STALE: $REPO (${AGE}h old)"
            STALE=$((STALE + 1))
          else
            echo "  OK: $REPO (${AGE}h ago)"
          fi
        else
          echo "  UNKNOWN: $REPO (no updated_at)"
        fi
      done

      echo ""
      if [ "$STALE" -gt 0 ]; then
        echo "WARNING: $STALE stale mirrors"
      else
        echo "All mirrors fresh"
      fi

  - name: notify
    depends:
      - verify-freshness
    command: |
      curl -s -X POST "$NTFY_URL/ops_backups" \
        -H "Authorization: Bearer $AUTHELIA_BEARER_TOKEN" \
        -H "Title: Gitea Mirror Sync OK" \
        -H "Priority: 1" \
        -H "Tags: mirror,white_check_mark" \
        -d "Daily mirror sync completed. Repos: $GITEA_ORG on Gitea"
