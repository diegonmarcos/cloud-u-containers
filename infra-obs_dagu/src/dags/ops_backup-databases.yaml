# Data-driven database backup — reads all targets from _cloud-data-consolidated.json
# Adding a new database: update the service's build.json containers section with db_user/db_name/db_path/dump_cmd
# then regenerate cloud-data. This DAG picks it up automatically via sync_cloud-data.yaml (every 5 min).
schedule: "0 3 * * *"
env:
  - NTFY_URL: http://10.0.0.6:8090
  - AUTHELIA_BEARER_TOKEN: ${AUTHELIA_BEARER_TOKEN}
  - AWS_ACCESS_KEY_ID: "21dd4572b47aaf91fc5d3f9cabcc88f9e6e7984e"
  - AWS_SECRET_ACCESS_KEY: ${OCI_S3_SECRET_KEY}
  - RUSTIC_REPO: "s3:https://axpmn3qtq4ig.compat.objectstorage.eu-marseille-1.oraclecloud.com/cloud-backups-db"
  - RUSTIC_PASSWORD: ${RUSTIC_PASSWORD}
  - BACKUP_JSON: /var/lib/dagu/data/cloud-data/_cloud-data-consolidated.json
  - SSH_OPTS: "-i /home/dagu/.ssh/vault_id_rsa -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o ServerAliveInterval=10 -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR"
mail_on:
  failure: true
  success: false
type: graph
steps:
  # ── Phase 1: Dump databases on each VM (parallel) ──────────────────
  - name: dump-oci-apps
    command: |
      # 2026-04-27 migrated: cloud-data-backup-targets.json -> _cloud-data-consolidated.json[.vms,.services]
      # NOTE: consolidated derivation may miss `type: custom` entries with dump_cmd
      # (photos-webhook, crawlee redis/minio, matomo). Legacy fallback preserved for those.
      CONS=""
      for p in /var/lib/dagu/data/cloud-source/2_configs/dist/_cloud-data-consolidated.json \
               /var/lib/dagu/data/cloud-data/_cloud-data-consolidated.json \
               /var/lib/dagu/data/cloud-data/2_configs/dist/_cloud-data-consolidated.json \
               /app/_cloud-data-consolidated.json; do
        [ -f "$p" ] && CONS="$p" && break
      done
      if [ -n "$CONS" ]; then
        BACKUP_JSON="${RUNNER_TEMP:-/tmp}/derived-backup-targets.$$.json"
        jq '
          . as $root
          | ($root.vms | with_entries({key: .value.ssh_alias, value: {wg_ip: .value.wg_ip, user: .value.user}})) as $alias_vms
          | ($root.vms | with_entries({key: .key, value: .value.ssh_alias})) as $canon_to_alias
          | {
              by_vm: (
                $alias_vms
                | with_entries(
                    .key as $alias
                    | .value as $vm_info
                    | {
                        key: $alias,
                        value: ($vm_info + {
                          databases: [
                            $root.services | to_entries[]
                            | select(.value.backup.enabled == true)
                            | select($canon_to_alias[.value.vm] == $alias)
                            | (.key) as $svc
                            | .value.containers | to_entries[]
                            | select(.value.db_engine or .value.db_path)
                            | (.key) as $ckey
                            | .value as $c
                            | if $c.db_engine == "postgres" then
                                {service: $svc, container: $c.container_name, container_key: $ckey, type: "postgres", user: $c.db_user, db: $c.db_name}
                              elif $c.db_engine == "mariadb" then
                                {service: $svc, container: $c.container_name, container_key: $ckey, type: "mariadb", user: $c.db_user, db: $c.db_name}
                              elif $c.db_path then
                                {service: $svc, container: $c.container_name, container_key: $ckey, type: "sqlite", path: $c.db_path}
                              else empty end
                          ]
                        })
                      }
                  )
              )
            }
        ' "$CONS" > "$BACKUP_JSON"
      else
        for p in /var/lib/dagu/data/cloud-data/cloud-data-backup-targets.json \
                 /var/lib/dagu/data/cloud-data/2_configs/dist/cloud-data-backup-targets.json \
                 /app/cloud-data-backup-targets.json; do
          [ -f "$p" ] && BACKUP_JSON="$p" && break
        done
      fi
      VM="oci-apps"
      IP=$(jq -r ".by_vm.\"$VM\".wg_ip" "$BACKUP_JSON")
      USER=$(jq -r ".by_vm.\"$VM\".user" "$BACKUP_JSON")
      DB_COUNT=$(jq ".by_vm.\"$VM\".databases | length" "$BACKUP_JSON")
      [ "$DB_COUNT" = "0" ] || [ "$IP" = "null" ] && echo "No databases for $VM" && exit 0
      echo "[$VM] Dumping $DB_COUNT databases on $USER@$IP"
      STAMP=$(date +%Y%m%d)

      DUMP_SCRIPT=$(jq -r --arg s "$STAMP" '.by_vm."'"$VM"'".databases[] |
        if .type == "postgres" then
          "if docker ps --format {{.Names}} | grep -qx \(.container); then docker exec \(.container) pg_dump -U \(.user) -d \(.db) 2>/dev/null | gzip > \(.container)-\($s).sql.gz && echo OK_\(.container) || echo FAIL_\(.container); else echo SKIP_\(.container); fi"
        elif .type == "mariadb" then
          "if docker ps --format {{.Names}} | grep -qx \(.container); then docker exec \(.container) mariadb-dump -u \(.user) \(.db) 2>/dev/null | gzip > \(.container)-\($s).sql.gz && echo OK_\(.container) || echo FAIL_\(.container); else echo SKIP_\(.container); fi"
        elif .type == "sqlite" then
          "if docker ps --format {{.Names}} | grep -qx \(.container); then docker cp \(.container):\(.path) /var/backups/databases/\(.container)-\($s).sqlite 2>/dev/null && gzip -f /var/backups/databases/\(.container)-\($s).sqlite && echo OK_\(.container) || echo FAIL_\(.container); else echo SKIP_\(.container); fi"
        elif .type == "custom" then
          "if docker ps --format {{.Names}} | grep -qx \(.container); then docker exec \(.container) \(.dump_cmd) 2>/dev/null | gzip > \(.container)-\($s).dump.gz && echo OK_\(.container) || echo FAIL_\(.container); else echo SKIP_\(.container); fi"
        else "echo UNKNOWN_TYPE_\(.type)_\(.container)" end
      ' "$BACKUP_JSON")

      ssh $SSH_OPTS "$USER@$IP" bash <<REMOTE
        mkdir -p /var/backups/databases && cd /var/backups/databases
        $DUMP_SCRIPT
        echo ""; ls -lh /var/backups/databases/*${STAMP}* 2>/dev/null | wc -l | xargs -I{} echo "Total: {} dumps on $VM"
      REMOTE

