      fi
      STAMP=$(date +%Y%m%d)
      COLLECT_IP=$(jq -r '.by_vm."oci-apps".wg_ip' "$BACKUP_JSON")
      COLLECT_USER=$(jq -r '.by_vm."oci-apps".user' "$BACKUP_JSON")

      # Copy local oci-apps dumps to collected/
      ssh $SSH_OPTS "$COLLECT_USER@$COLLECT_IP" bash <<REMOTE
        mkdir -p /var/backups/collected
        cp /var/backups/databases/*${STAMP}* /var/backups/collected/ 2>/dev/null || true
      REMOTE

      # Pull from each remote VM
      for vm in $(jq -r '.by_vm | keys[] | select(. != "oci-apps")' "$BACKUP_JSON"); do
        VM_IP=$(jq -r ".by_vm.\"$vm\".wg_ip" "$BACKUP_JSON")
        VM_USER=$(jq -r ".by_vm.\"$vm\".user" "$BACKUP_JSON")
        ssh $SSH_OPTS "$COLLECT_USER@$COLLECT_IP" bash -c "
          rsync -az -e 'ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR' \
            --ignore-missing-args '$VM_USER@$VM_IP:/var/backups/databases/*${STAMP}*' /var/backups/collected/ 2>/dev/null && \
            echo 'Pulled from $vm' || echo 'No dumps from $vm'
        "
      done

      echo "Collected:"
      ssh $SSH_OPTS "$COLLECT_USER@$COLLECT_IP" "ls -lh /var/backups/collected/*${STAMP}* 2>/dev/null"

      # Restic backup to OCI Object Storage
      ssh $SSH_OPTS "$COLLECT_USER@$COLLECT_IP" bash <<REMOTE
        export AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID"
        export AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY"
        export RUSTIC_REPO="$RUSTIC_REPO"
        export RUSTIC_PASSWORD="$RUSTIC_PASSWORD"

        # rustic-rs deployed via home-manager (system-packages.json)
        command -v rustic >/dev/null 2>&1 || { echo "ERROR: rustic not found — deploy home-manager first"; exit 1; }

        rustic init 2>/dev/null || true
        rustic backup /var/backups/collected/ --tag "databases" --tag "${STAMP}" --verbose && \
          echo "rustic upload OK" || echo "rustic upload FAILED"

        rustic forget --keep-daily 7 --keep-weekly 4 --keep-monthly 6 --prune 2>/dev/null

        # Clean local dumps older than 3 days
        find /var/backups/databases -name "*.gz" -mtime +3 -delete 2>/dev/null
        find /var/backups/collected -name "*.gz" -mtime +3 -delete 2>/dev/null
      REMOTE

  # ── Phase 3: Notify ────────────────────────────────────────────────
  - name: notify
    depends:
      - collect-and-upload
    command: |
      # 2026-04-27 migrated: cloud-data-backup-targets.json -> _cloud-data-consolidated.json[.vms,.services]
      # NOTE: consolidated derivation may miss `type: custom` entries with dump_cmd
      # (photos-webhook, crawlee redis/minio, matomo). Legacy fallback preserved for those.
      CONS=""
      for p in /var/lib/dagu/data/cloud-source/2_configs/dist/_cloud-data-consolidated.json \
               /var/lib/dagu/data/cloud-data/_cloud-data-consolidated.json \
               /var/lib/dagu/data/cloud-data/2_configs/dist/_cloud-data-consolidated.json \
               /app/_cloud-data-consolidated.json; do
        [ -f "$p" ] && CONS="$p" && break
      done
      if [ -n "$CONS" ]; then
        BACKUP_JSON="${RUNNER_TEMP:-/tmp}/derived-backup-targets.$$.json"
        jq '
          . as $root
          | ($root.vms | with_entries({key: .value.ssh_alias, value: {wg_ip: .value.wg_ip, user: .value.user}})) as $alias_vms
          | ($root.vms | with_entries({key: .key, value: .value.ssh_alias})) as $canon_to_alias
          | {
              by_vm: (
                $alias_vms
                | with_entries(
                    .key as $alias
                    | .value as $vm_info
                    | {
                        key: $alias,
                        value: ($vm_info + {
                          databases: [
                            $root.services | to_entries[]
                            | select(.value.backup.enabled == true)
                            | select($canon_to_alias[.value.vm] == $alias)
                            | (.key) as $svc
                            | .value.containers | to_entries[]
                            | select(.value.db_engine or .value.db_path)
                            | (.key) as $ckey
                            | .value as $c
                            | if $c.db_engine == "postgres" then
                                {service: $svc, container: $c.container_name, container_key: $ckey, type: "postgres", user: $c.db_user, db: $c.db_name}
                              elif $c.db_engine == "mariadb" then
                                {service: $svc, container: $c.container_name, container_key: $ckey, type: "mariadb", user: $c.db_user, db: $c.db_name}
                              elif $c.db_path then
                                {service: $svc, container: $c.container_name, container_key: $ckey, type: "sqlite", path: $c.db_path}
                              else empty end
                          ]
                        })
                      }
                  )
              )
            }
        ' "$CONS" > "$BACKUP_JSON"
      else
        for p in /var/lib/dagu/data/cloud-data/cloud-data-backup-targets.json \
                 /var/lib/dagu/data/cloud-data/2_configs/dist/cloud-data-backup-targets.json \
                 /app/cloud-data-backup-targets.json; do
          [ -f "$p" ] && BACKUP_JSON="$p" && break
        done
      fi
      COLLECT_IP=$(jq -r '.by_vm."oci-apps".wg_ip' "$BACKUP_JSON")
      COLLECT_USER=$(jq -r '.by_vm."oci-apps".user' "$BACKUP_JSON")
      COUNT=$(ssh $SSH_OPTS "$COLLECT_USER@$COLLECT_IP" "ls /var/backups/collected/*$(date +%Y%m%d)* 2>/dev/null | wc -l")
      SIZE=$(ssh $SSH_OPTS "$COLLECT_USER@$COLLECT_IP" "du -sh /var/backups/collected/ 2>/dev/null | awk '{print \$1}'" || echo "N/A")
      MSG="DB backup → OCI S3: $COUNT dumps ($SIZE)\nBucket: cloud-backups-db\nDagu: https://workflows.diegonmarcos.com"
      curl -s -X POST "$NTFY_URL/ops_backups" \
        -H "Authorization: Bearer $AUTHELIA_BEARER_TOKEN" \
        -H "Title: Daily DB Backup OK ($COUNT dumps)" \
        -H "Priority: 2" \
        -H "Tags: floppy_disk,white_check_mark" \
        -d "$(echo -e "$MSG")"
