schedule: "0 7 * * *"
env:
  - NTFY_URL: http://10.0.0.6:8090
mail_on:
  failure: false
  success: false
steps:
  - name: check-timers-and-notify
    command: |
      SSH="ssh -i /home/dagu/.ssh/vault_id_rsa -o StrictHostKeyChecking=no -o ConnectTimeout=5 -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR"
      ALERTS=""
      VM_LIST="10.0.0.1:gcp-proxy:diego 10.0.0.3:oci-mail:ubuntu 10.0.0.4:oci-analytics:ubuntu 10.0.0.6:oci-apps:ubuntu"
      for vm_data in $VM_LIST; do
        ip=${vm_data%%:*}
        temp=${vm_data#*:}
        name=${temp%:*}
        user=${temp#*:}
        FAILED_TIMERS=$($SSH $user@$ip "systemctl list-timers --failed --no-legend 2>/dev/null" 2>/dev/null || echo "")
        if [ -n "$FAILED_TIMERS" ]; then
          ALERTS="${ALERTS}  $name ($ip):\n"
          FMT=$(printf '%s\n' "$FAILED_TIMERS" | while IFS= read -r t; do [ -n "$t" ] && printf '    - %s\\n' "$t"; done)
          ALERTS="${ALERTS}${FMT}"
        fi
      done
      if [ -n "$ALERTS" ]; then
        MSG=$(echo -e "Failed systemd timers:\n${ALERTS}\nAction:\n  ssh <user>@<ip> 'systemctl list-timers --failed'\n  ssh <user>@<ip> 'journalctl -u <timer-name> --since yesterday'\n\nDagu: https://workflows.diegonmarcos.com")
        curl -s -X POST "$NTFY_URL/ops_reports" \
          -H "Title: Cron/Timer Failures" \
          -H "Priority: 4" \
          -H "Tags: warning,clock1" \
          -d "$MSG"
        exit 1
      fi
