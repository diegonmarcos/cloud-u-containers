# Weekly security data scan — sec-data is YARA + git-grep against the local
# clone (~140s on warm cache). It's pure local-CPU work that the daily report
# snapshot can't speed up, so it runs on its own slower cadence here instead
# of inside the daily fan-out.
schedule: "0 4 * * 1"   # Mondays 04:00
type: graph
env:
  - NTFY_URL: http://10.0.0.6:8090
  - GITHUB_TOKEN: ${GITHUB_TOKEN}
  - AUTHELIA_BEARER_TOKEN: ${AUTHELIA_BEARER_TOKEN}
mail_on:
  failure: true
  success: false
steps:
  - name: sec-data-scan
    # command: | (literal block) is mandatory — Dagu runs it through bash so
    # $VAR references expand. The previous `>-` (folded) form was exec'd
    # directly, leaving `$GITHUB_TOKEN` as a LITERAL string in the inner
    # container's env (same bug class as report_daily's 401, fixed 2026-06).
    # BEARER_TOKEN: entrypoint §5d fails loud without it (R6 hardening).
    command: |
      docker run --rm --network host \
        --pull always \
        -v /opt/ssh-keys/dagu:/root/.ssh \
        -v dagu_dagu_data:/var/lib/dagu/data \
        -w /var/lib/dagu/data/cloud-source/a_solutions/infra-obs_reports/src \
        -e GITHUB_TOKEN="$GITHUB_TOKEN" \
        -e BEARER_TOKEN="$AUTHELIA_BEARER_TOKEN" \
        ghcr.io/diegonmarcos/cloud-data-reports:latest \
        bash src/build.sh sec
      # App SOURCE moved to cloud-infra (2026-08-19) — cloud-source/ is a
      # hard-reset-hourly mirror, so dist/ output written there is never
      # persisted. Copy fresh dist/ into the cloud-data checkout in the same
      # volume, matching the GHA workflows' "Publish to cloud-data" step.
      docker run --rm --entrypoint sh \
        -v dagu_dagu_data:/var/lib/dagu/data \
        ghcr.io/diegonmarcos/cloud-data-reports:latest -c '
          set -e
          mkdir -p /var/lib/dagu/data/cloud-data/y_old/reports/dist
          cp -a /var/lib/dagu/data/cloud-source/a_solutions/infra-obs_reports/src/dist/. \
                /var/lib/dagu/data/cloud-data/y_old/reports/dist/
        '
