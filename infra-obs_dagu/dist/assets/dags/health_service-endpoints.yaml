schedule: "*/5 * * * *"
env:
  - NTFY_URL: http://10.0.0.6:8090
  - AUTHELIA_BEARER_TOKEN: ${AUTHELIA_BEARER_TOKEN}
  - MON_TARGETS: /var/lib/dagu/data/cloud-data/_cloud-data-consolidated.json
mail_on:
  failure: false
  success: false
steps:
  - name: check-endpoints-and-notify
    command: |
      # 2026-04-27 migrated: cloud-data-monitoring-targets.json -> _cloud-data-consolidated.json[.services]
      CONS=""
      for p in /var/lib/dagu/data/cloud-source/1_cloud-configs/dist/_cloud-data-consolidated.json \
               /var/lib/dagu/data/cloud-data/_cloud-data-consolidated.json \
               /var/lib/dagu/data/cloud-data/1_cloud-configs/dist/_cloud-data-consolidated.json \
               /app/_cloud-data-consolidated.json; do
        [ -f "$p" ] && CONS="$p" && break
      done
      if [ -n "$CONS" ]; then
        MON_TARGETS="${RUNNER_TEMP:-/tmp}/derived-mon-targets.$$.json"
        jq '{
          endpoint_checks: [.services | to_entries[]
            | select(.value.monitoring.endpoint_check == true and .value.domain)
            | {service: .key, url: ("https://" + .value.domain + "/")}]
        }' "$CONS" > "$MON_TARGETS"
      else
        for p in /var/lib/dagu/data/cloud-data/cloud-data-monitoring-targets.json \
                 /var/lib/dagu/data/cloud-data/1_cicd/dist/cloud-data-monitoring-targets.json \
                 /app/cloud-data-monitoring-targets.json; do
          [ -f "$p" ] && MON_TARGETS="$p" && break
        done
      fi
      FAILED=""
      ENDPOINTS=$(if [ -f "$MON_TARGETS" ]; then jq -r '.endpoint_checks[] | "\(.url):\(.service)"' "$MON_TARGETS"; else echo -e "https://auth.diegonmarcos.com/api/health:Authelia 2FA\nhttps://vault.diegonmarcos.com/:Vaultwarden\nhttps://api.diegonmarcos.com/c3-api/health:C3 API"; fi)
      echo "$ENDPOINTS" | while IFS=: read -r proto rest; do
        [ -z "$proto" ] && continue
        svc=${rest##*:}
        url="$proto:${rest%:*}"
        HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -m 5 "$url" 2>/dev/null || echo "000")
        # DOWN only if unreachable (000) or backend dead (502/503/504). An
        # auth-gated endpoint answers 401/403 UNAUTHENTICATED — that proves the
        # endpoint is ALIVE and correctly gating, NOT down. Treating >=400 as
        # down (the old rule) flagged every Authelia/ntfy-3tier service as a
        # false outage → this DAG exit-1'd every 5 min on healthy auth gates.
        # 2xx/3xx = up; 401/403 = up-and-gated; 000/502/503/504 = genuinely down.
        case "$HTTP_CODE" in
          000|502|503|504)
            echo "  - $svc ($url) -> HTTP $HTTP_CODE" >> /tmp/endpoints-failed.$$
            ;;
        esac
      done
      if [ -f /tmp/endpoints-failed.$$ ]; then
        FAILED=$(cat /tmp/endpoints-failed.$$)
        rm -f /tmp/endpoints-failed.$$
        MSG=$(printf "DOWN endpoints:\n%s\n\nAction:\n  curl -v https://<domain>\n  ssh gcp-proxy 'docker logs caddy --tail 20'\n\nDagu: https://workflows.diegonmarcos.com" "$FAILED")
        curl -s -X POST "$NTFY_URL/health_endpoints" \
          -H "Authorization: Bearer $AUTHELIA_BEARER_TOKEN" \
          -H "Title: Service Endpoint DOWN" \
          -H "Priority: 5" \
          -H "Tags: rotating_light" \
          -d "$MSG"
        exit 1
      fi
