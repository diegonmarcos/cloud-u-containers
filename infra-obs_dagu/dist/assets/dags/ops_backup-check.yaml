schedule: "0 11 * * *"
env:
  - NTFY_URL: http://10.0.0.6:8090
  - BACKUP_TARGETS: /var/lib/dagu/data/cloud-data/_cloud-data-consolidated.json
mail_on:
  failure: false
  success: false
steps:
  - name: check-backups-and-notify
    command: |
      # 2026-04-27 migrated: cloud-data-backup-targets.json -> _cloud-data-consolidated.json[.vms,.services]
      CONS=""
      for p in /var/lib/dagu/data/cloud-source/1_cloud-configs/dist/_cloud-data-consolidated.json \
               /var/lib/dagu/data/cloud-data/_cloud-data-consolidated.json \
               /var/lib/dagu/data/cloud-data/1_cloud-configs/dist/_cloud-data-consolidated.json \
               /app/_cloud-data-consolidated.json; do
        [ -f "$p" ] && CONS="$p" && break
      done
      if [ -n "$CONS" ]; then
        BACKUP_TARGETS="${RUNNER_TEMP:-/tmp}/derived-backup-targets.$$.json"
        # db_count = dumpable DBs per VM, using the SAME filter as ops_backup-databases
        # (postgres/mariadb/sqlite only — redis & other engines produce no dump file).
        # VMs with 0 dumpable DBs are never expected to have /var/backups dumps → skipped below.
        jq '
          . as $root
          | ($root.vms | with_entries({key: .key, value: .value.ssh_alias})) as $canon_to_alias
          | {
              by_vm: (
                [ $root.vms | to_entries[]
                  | select(.value.ssh_alias and .value.wg_ip)
                  | .value.ssh_alias as $alias
                  | { key: $alias,
                      value: {
                        wg_ip: .value.wg_ip,
                        user: .value.user,
                        db_count: ([
                          $root.services | to_entries[]
                          | select(.value.backup.enabled == true)
                          | select($canon_to_alias[.value.vm] == $alias)
                          | .value.containers | to_entries[]
                          | select(.value.db_engine == "postgres" or .value.db_engine == "mariadb" or .value.db_path)
                        ] | length)
                      } } ]
                | from_entries
              )
            }
        ' "$CONS" > "$BACKUP_TARGETS"
      else
        for p in /var/lib/dagu/data/cloud-data/cloud-data-backup-targets.json \
                 /var/lib/dagu/data/cloud-data/1_cicd/dist/cloud-data-backup-targets.json \
                 /app/cloud-data-backup-targets.json; do
          [ -f "$p" ] && BACKUP_TARGETS="$p" && break
        done
      fi
      SSH="ssh -i /home/dagu/.ssh/vault_id_rsa -o StrictHostKeyChecking=no -o ConnectTimeout=5 -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR"
      ALERTS=""
      # Data-driven VM list (wg_ip:alias:user:db_count) — fully derived, no hardcoded fallback.
      VM_LIST=$(jq -r '.by_vm | to_entries[] | "\(.value.wg_ip):\(.key):\(.value.user):\(.value.db_count // 0)"' "$BACKUP_TARGETS" 2>/dev/null)
      for vm_data in $VM_LIST; do
        ip=${vm_data%%:*}; rest=${vm_data#*:}
        name=${rest%%:*}; rest=${rest#*:}
        user=${rest%%:*}; dbcount=${rest#*:}
        # Skip VMs with no dumpable databases — they are never expected to have dumps.
        [ "${dbcount:-0}" -eq 0 ] 2>/dev/null && continue
        # Match any dump extension (.sql.gz, .sqlite.gz, .dump.gz) in the dump/collect dirs.
        RECENT=$($SSH $user@$ip "find /var/backups/databases /var/backups/collected -name '*.gz' 2>/dev/null | head -5 | while read f; do stat --format='%n (%s bytes, %y)' \"\$f\" 2>/dev/null; done | head -5" 2>/dev/null) || true
        COUNT=$($SSH $user@$ip "find /var/backups/databases /var/backups/collected -name '*.gz' -mtime -1 2>/dev/null | wc -l" 2>/dev/null || echo 0)
        if [ "$COUNT" -eq 0 ] 2>/dev/null; then
          ALERTS="${ALERTS}  $name ($ip): NO backups in last 24h\n"
          if [ -n "$RECENT" ]; then
            ALERTS="${ALERTS}    Latest files:\n"
            FMT=$(printf '%s\n' "$RECENT" | while IFS= read -r f; do [ -n "$f" ] && printf '      %s\\n' "$f"; done)
            ALERTS="${ALERTS}${FMT}"
          fi
        fi
      done
      if [ -n "$ALERTS" ]; then
        MSG=$(echo -e "Backup freshness issues:\n${ALERTS}\nAction:\n  ssh <user>@<ip> 'ls -lt /var/backups/ | head -10'\n  Check backup cron: ssh <user>@<ip> 'crontab -l'\n\nDagu: https://workflows.diegonmarcos.com")
        curl -s -X POST "$NTFY_URL/ops_backups" \
          -H "Authorization: Bearer $AUTHELIA_BEARER_TOKEN" \
          -H "Title: Backup Alert" \
          -H "Priority: 4" \
          -H "Tags: floppy_disk,warning" \
          -d "$MSG"
        exit 1
      fi
