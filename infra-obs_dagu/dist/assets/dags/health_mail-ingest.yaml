# Inbound-blackout alarm for the mail pipeline.
#
# 2026-08-13..08-21: leg B (Cloudflare Worker -> http-to-smtp -> maddy) was down
# for nine days. Zero mail arrived. Nothing alerted, because every check we had
# asked "is the service up?" and maddy was up the whole time — a live mailserver
# with an empty INBOX looks perfectly healthy.
#
# health_mail-full.yaml would arguably have caught it via e2e_delivery, but that
# DAG pulls ghcr.io/diegonmarcos/cloud-data-reports and has itself been failing
# on the image pull — so the heavy report produced no signal either.
#
# Hence this DAG: deliberately dependency-free. No report image, no jq, no OIDC
# token minting. One ssh + one sqlite query. It must keep working on the day
# everything else is broken, because that is the day it matters.
#
# dagu 2.5.0 requires snake_case keys. camelCase (maxActiveRuns) makes the DAG
# silently unparseable: it still lists, with an empty schedule, and never fires.
schedule: "*/30 * * * *"
max_active_runs: 1
env:
  - SSH: ssh -i /home/dagu/.ssh/vault_id_rsa -o StrictHostKeyChecking=no -o ConnectTimeout=10
  - NTFY_URL: http://10.0.0.6:8090
  - STALE_HOURS: "24"
mail_on:
  failure: false
  success: false
steps:
  - name: check-ingest-freshness
    # An alarm that cannot deliver its alarm is not an alarm. ntfy is WG-bound
    # and accepts anonymous publish from the mesh; the Authelia bearer that most
    # other DAGs send is NOT an ntfy token, so ntfy 401s and the alert is
    # silently dropped. Publish with no auth header — verified 200.
    continue_on:
      failure: true
    command: |
      set -u
      SQL="SELECT CAST((strftime('%s','now') - MAX(m.date))/3600 AS INT)
             FROM msgs m JOIN mboxes b ON b.id = m.mboxId
            WHERE b.name = 'INBOX';"
      AGE=$($SSH ubuntu@10.0.0.3 \
        "docker exec maddy sqlite3 -readonly /data/imapsql.db \"$SQL\"" 2>/dev/null | tr -d '[:space:]')

      # An unreadable store is itself an outage — do not treat it as "fresh".
      case "$AGE" in
        ''|*[!0-9]*)
          curl -s -X POST "$NTFY_URL/infra_mail-health" \
            -H "Title: Mail ingest UNKNOWN - cannot read maddy INBOX" \
            -H "Priority: 5" \
            -H "Tags: rotating_light,email" \
            -d "Could not determine last-delivery age on oci-mail. maddy or the WG path may be down."
          exit 1
          ;;
      esac

      echo "hours_since_last_inbound_delivery=$AGE (threshold ${STALE_HOURS}h)"
      if [ "$AGE" -ge "$STALE_HOURS" ]; then
        curl -s -X POST "$NTFY_URL/infra_mail-health" \
          -H "Title: Mail ingest STALLED - no inbound for ${AGE}h" \
          -H "Priority: 5" \
          -H "Tags: rotating_light,email" \
          -d "$(printf 'No message has reached maddy INBOX for %sh.\n\nInbound (leg B) is probably down: check the Cloudflare Worker, api.diegonmarcos.com/pub/mail/http-to-smtp, and the Authelia/introspect-proxy auth chain.\n\nCheck the reconciliation leg too. If gws-primary is failing, lost mail will NOT be recovered automatically.' "$AGE")"
        exit 1
      fi

  - name: check-reconciliation-leg
    # Runs even when the freshness step alarms (continue_on above): a blackout
    # plus a dead safety net is precisely the combination that caused nine days
    # of permanent loss, so both facts must reach the same alert. Steps are
    # sequential by default (type: chain); depends is rejected in that mode.
    command: |
      set -u
      # mail-puller re-pulls the Gmail/Workspace copy into maddy, so anything
      # leg B drops still lands. During the Aug blackout this leg was itself
      # dead (gws-primary: invalid_client) — which is why nothing self-healed.
      FAILING=$($SSH ubuntu@10.0.0.3 \
        "docker logs --since 15m mail-puller 2>&1 | sed 's/\x1b\[[0-9;]*m//g' | grep 'cycle failed' | grep -oE 'source=[a-z-]+' | sort -u" \
        2>/dev/null | tr '\n' ' ' | sed 's/ *$//')

      if [ -n "$FAILING" ]; then
        echo "failing_pull_sources: $FAILING"
        curl -s -X POST "$NTFY_URL/infra_mail-health" \
          -H "Title: Mail reconciliation leg DOWN" \
          -H "Priority: 4" \
          -H "Tags: warning,email" \
          -d "$(printf 'Failing mail-puller sources: %s\n\nThese legs re-pull the upstream copy into maddy. While they are down, any mail dropped by leg B is NOT recovered - the safety net is off.' "$FAILING")"
        exit 1
      fi
      echo "all pull sources healthy"
