schedule: "0 9 * * *"
env:
  - NTFY_URL: http://10.0.0.6:8090
  - JEV_ASK: /var/lib/dagu/dags/lib/jev-ask.sh
mail_on:
  failure: false
  success: false
steps:
  - name: collect-all-connections
    command: |
      SSH="ssh -i /home/dagu/.ssh/vault_id_rsa -o StrictHostKeyChecking=no -o ConnectTimeout=5 -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR"
      TODAY=$(date +"%b %e")
      REPORT=""
      VM_LIST="10.0.0.1:gcp-proxy:diego 10.0.0.3:oci-mail:ubuntu 10.0.0.4:oci-analytics:ubuntu 10.0.0.6:oci-apps:ubuntu"
      for vm_data in $VM_LIST; do
        ip=${vm_data%%:*}
        temp=${vm_data#*:}
        name=${temp%:*}
        user=${temp#*:}
        ACCEPTED=$($SSH $user@$ip "grep 'Accepted' /var/log/auth.log 2>/dev/null | grep -c '$TODAY' || echo 0" 2>/dev/null || echo "N/A")
        FAILED_SSH=$($SSH $user@$ip "grep 'Failed password' /var/log/auth.log 2>/dev/null | grep -c '$TODAY' || echo 0" 2>/dev/null || echo "N/A")
        SUDO_EVENTS=$($SSH $user@$ip "grep 'sudo:' /var/log/auth.log 2>/dev/null | grep -c '$TODAY' || echo 0" 2>/dev/null || echo "N/A")
        ACTIVE_CONN=$($SSH $user@$ip "ss -tun state established 2>/dev/null | tail -n +2 | wc -l" 2>/dev/null || echo "N/A")
        DOCKER_CONN=$($SSH $user@$ip "ss -tlnp 2>/dev/null | grep -c docker || echo 0" 2>/dev/null || echo "N/A")
        RECENT_LOGINS=$($SSH $user@$ip "grep 'Accepted' /var/log/auth.log 2>/dev/null | grep '$TODAY' | tail -3 | awk '{print \"    \" \$0}'" 2>/dev/null || echo "    (none)")
        REPORT="${REPORT}$name ($ip):\n  SSH accepted: $ACCEPTED | failed: $FAILED_SSH\n  Sudo events: $SUDO_EVENTS\n  Active TCP: $ACTIVE_CONN | Docker listeners: $DOCKER_CONN\n  Recent logins:\n$RECENT_LOGINS\n\n"
      done
      MSG=$(echo -e "Daily Connection Report ($TODAY):\n\n${REPORT}Inspect:\n  ssh <user>@<ip> 'journalctl -u ssh --since yesterday'\n  ssh <user>@<ip> 'last -20'\n  ssh <user>@<ip> 'ss -tunap'\n\nDagu: https://workflows.diegonmarcos.com")
      # #883 S10: Jev may bump the priority above P2 when the day looks anomalous (no opinion = P2, as before)
      PRIO=2
      ADV=$(sh "$JEV_ASK" security_digest report="$(printf '%b' "$REPORT" | head -c 3000)")
      case "$ADV" in *"not confident"*) ;; *anomalous=yes*) PRIO=3; MSG="$MSG$(printf '\n\n')$ADV";; esac
      curl -s -X POST "$NTFY_URL/sec_connections" \
        -H "Title: Daily Connection Report" \
        -H "Priority: $PRIO" \
        -H "Tags: key,shield" \
        -d "$MSG"
