schedule: "17 7 * * *"
env:
  - NTFY_URL: http://10.0.0.6:8090
  - AUTHELIA_BEARER_TOKEN: ${AUTHELIA_BEARER_TOKEN}
  - AUTHELIA_TOKEN_URL: ${AUTHELIA_TOKEN_URL}
  - AUTHELIA_OIDC_CLIENT_ID: ${AUTHELIA_OIDC_CLIENT_ID}
  - AUTHELIA_OIDC_CLIENT_SECRET: ${AUTHELIA_OIDC_CLIENT_SECRET}
  - REPORT_IMAGE: ghcr.io/diegonmarcos/cloud-data-reports:latest
mail_on:
  failure: true
  success: false
steps:
  - name: run-mail-health
    command: |
      # Run the Rust cloud-mail-health-full derive (replaces old TypeScript
      # health_mail.ts, retired 2026-04-23). Writes cloud_mail_full.{md,json}
      # into the dagu_dagu_data volume (Docker Compose prefixes named
      # volumes with the project name → bare `dagu_data` resolves to a
      # different, empty auto-created volume so cloud-data/y_old/reports/
      # build.sh isn't visible inside the spawned container).
      # The container-startup OIDC token (AUTHELIA_BEARER_TOKEN, minted once by
      # fetch-token.sh at boot) expires ~1h later, so scheduled reports run with
      # a stale token → every private/OIDC check false-fails → criticals → red.
      # Mint a fresh client_credentials token per run; fall back to the boot one.
      FRESH_TOKEN=$(curl -s --max-time 10 -X POST "$AUTHELIA_TOKEN_URL" \
        -u "$AUTHELIA_OIDC_CLIENT_ID:$AUTHELIA_OIDC_CLIENT_SECRET" \
        -d "grant_type=client_credentials&scope=authelia.bearer.authz" \
        | grep -o '"access_token":"[^"]*"' | cut -d'"' -f4)
      BEARER="${FRESH_TOKEN:-$AUTHELIA_BEARER_TOKEN}"
      # CLOUD_DATA_DIR points reports-common's find_cloud_data_file at the
      # cloud-source 1_cicd/dist tree (report cwd under cloud-data/ can't
      # walk up into cloud-source/). REPORTS_DIR: app SOURCE moved to
      # cloud-infra (2026-08-19) — cloud-source/a_solutions/infra-obs_reports/src
      # is where sync_secrets.yaml's hourly cloud-infra mirror puts it.
      docker run --pull always --rm --network host \
        -v dagu_dagu_data:/var/lib/dagu/data \
        -v /opt/ssh-keys/dagu:/root/.ssh \
        -e BEARER_TOKEN="$BEARER" \
        -e CLOUD_DATA_DIR=/var/lib/dagu/data/cloud-source/1_cloud-configs/dist \
        -e REPORTS_DIR=/var/lib/dagu/data/cloud-source/a_solutions/infra-obs_reports/src \
        "$REPORT_IMAGE" mail
      # cloud-source/ is hard-reset hourly (sync_secrets.yaml) — dist/ output
      # written there is never persisted. Copy it into the cloud-data
      # checkout in the same volume (git-pull-rebase'd, not hard-reset),
      # matching the GHA workflows' "Publish to cloud-data" step — this is
      # what keeps RESULT_JSON below (and the daily-mail send.sh) working.
      docker run --rm --entrypoint sh \
        -v dagu_dagu_data:/var/lib/dagu/data \
        "$REPORT_IMAGE" -c '
          set -e
          mkdir -p /var/lib/dagu/data/cloud-data/y_old/reports/dist
          cp -a /var/lib/dagu/data/cloud-source/a_solutions/infra-obs_reports/src/dist/. \
                /var/lib/dagu/data/cloud-data/y_old/reports/dist/
        '

      RESULT_JSON=/var/lib/dagu/data/cloud-data/y_old/reports/dist/cloud_mail_full.json
      if [ ! -f "$RESULT_JSON" ]; then
        curl -s -X POST "$NTFY_URL/infra_mail-health" \
          -H "Title: Mail Health FAILED — no report artefact" \
          -H "Priority: 5" \
          -H "Tags: rotating_light,email" \
          -d "cloud-mail-health-full did not write cloud_mail_full.json"
        exit 1
      fi

      PASSED=$(jq -r '.summary.passed // 0' "$RESULT_JSON")
      FAILED=$(jq -r '.summary.failed // 0' "$RESULT_JSON")
      CRITICAL=$(jq -r '.summary.critical // 0' "$RESULT_JSON")
      WARNINGS=$(jq -r '.summary.warnings // 0' "$RESULT_JSON")
      TOTAL=$(jq -r '.summary.total_checks // 0' "$RESULT_JSON")

      # Alert (red) only on CRITICAL findings — warnings are informational
      # health notes, not failures (consistent with health_cloud-full's gate).
      if [ "$CRITICAL" = "0" ]; then
        curl -s -X POST "$NTFY_URL/infra_mail-health" \
          -H "Title: Mail Health OK ($PASSED/$TOTAL passed)" \
          -H "Priority: 2" \
          -H "Tags: white_check_mark,email" \
          -d "$(printf 'All mail checks passed\nPASS=%s · WARN=%s · CRIT=%s\n\nDagu: https://workflows.diegonmarcos.com' "$PASSED" "$WARNINGS" "$CRITICAL")"
      else
        FAIL_DETAILS=$(jq -r '.path_checks[]?, .containers[]?, .network[]?, .dns_auth[]?, .internals[]?, .e2e_delivery[]? | select(.passed == false) | "  \(.severity // "?"): \(.name) — \(.details)"' "$RESULT_JSON" | head -15)
        curl -s -X POST "$NTFY_URL/infra_mail-health" \
          -H "Title: Mail Health FAILED ($CRITICAL critical, $FAILED failed)" \
          -H "Priority: 5" \
          -H "Tags: rotating_light,email" \
          -d "$(printf 'PASS=%s · FAIL=%s · CRIT=%s · WARN=%s\n\nTop issues:\n%s\n\nDagu: https://workflows.diegonmarcos.com' "$PASSED" "$FAILED" "$CRITICAL" "$WARNINGS" "$FAIL_DETAILS")"
        exit 1
      fi
