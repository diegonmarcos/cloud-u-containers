listen_addrs_ipv4 = ["10.0.0.1"]
listen_port = 53
directory = "/etc/zones"

# ── Wildcard zones (catch-all → Caddy WG IP) ──
[[zones]]
zone = "app"
zone_type = "Primary"
file = "app.zone"


[[zones]]
zone = "db"
zone_type = "Primary"
file = "db.zone"


[[zones]]
zone = "diegonmarcos.com"
zone_type = "Primary"
file = "diegonmarcos.com.zone"


# ── Root forwarder (everything else → declared upstream DNS) ──
[[zones]]
zone = "."
zone_type = "External"

[zones.stores]
type = "forward"

[[zones.stores.name_servers]]
ip = "1.1.1.1"
connections = [
  { protocol = { type = "udp" } },
  { protocol = { type = "tcp" } }
]


[[zones.stores.name_servers]]
ip = "8.8.8.8"
connections = [
  { protocol = { type = "udp" } },
  { protocol = { type = "tcp" } }
]

