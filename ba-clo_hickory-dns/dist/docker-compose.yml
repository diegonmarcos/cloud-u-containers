services:
  hickory-dns:
    image: hickorydns/hickory-dns:latest
    container_name: hickory-dns
    network_mode: host
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      - RUST_LOG=hickory_dns=info,hickory_server=info
    volumes:
      - ./config/named.toml:/etc/named.toml:ro
      - ./config/zones:/etc/zones:ro
    deploy:
      resources:
        limits:
          memory: 64M
          pids: 256
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
