services:
  hickory-dns:
    image: ghcr.io/diegonmarcos/hickory-dns:latest
    build:
      context: .
      dockerfile_inline: |
        FROM hickorydns/hickory-dns:latest
        COPY docker-compose.yml /opt/cloud-docs/docker-compose.yml
        LABEL org.opencontainers.image.source="https://github.com/diegonmarcos/cloud"
        LABEL org.opencontainers.image.description="hickory-dns"
        LABEL org.opencontainers.image.title="hickory-dns"
        LABEL cloud.diegonmarcos.from-image="hickorydns/hickory-dns:latest"
        LABEL cloud.diegonmarcos.registry="ghcr.io/diegonmarcos"
    container_name: hickory-dns
    network_mode: host
    restart: no
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      - RUST_LOG=hickory_dns=info,hickory_server=info
    volumes:
      - ./config/named.toml:/etc/named.toml:ro
      - ./config/zones:/etc/zones:ro
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "1.0"
          pids: 256
        reservations:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
