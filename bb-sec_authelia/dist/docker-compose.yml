services:
  authelia:
    image: ghcr.io/diegonmarcos/authelia:latest
    build:
      context: .
      dockerfile_inline: |
        FROM authelia/authelia:4.39.15
        COPY config/configuration.yml /config/configuration.yml
        COPY config/init.sh /config/init.sh
        COPY docker-compose.yml /opt/cloud-docs/docker-compose.yml
        LABEL org.opencontainers.image.source="https://github.com/diegonmarcos/cloud"
        LABEL org.opencontainers.image.description="authelia"
        LABEL org.opencontainers.image.title="authelia"
        LABEL cloud.diegonmarcos.from-image="authelia/authelia:4.39.15"
        LABEL cloud.diegonmarcos.registry="ghcr.io/diegonmarcos"
    container_name: authelia
    network_mode: host
    entrypoint: ["sh", "/config/init.sh"]
    restart: no
    stop_grace_period: 30s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    dns:
      - 10.0.0.1
      - 1.1.1.1
    env_file:
      - .secrets
    environment:
      TZ: Europe/Madrid
    depends_on:
      redis:
        condition: service_started
    volumes:
      - authelia_data:/data
      - ./config/oidc_jwks.pem:/config/oidc_jwks.pem:ro
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "1.0"
          pids: 256
        reservations:
          memory: 32M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    cap_add:
      - DAC_OVERRIDE

  redis:
    image: ghcr.io/diegonmarcos/redis:latest
    container_name: authelia-redis
    network_mode: host
    command: sh -c 'redis-server --port 6380 --requirepass $$AUTHELIA_REDIS_PASSWORD --appendonly yes --appendfsync everysec --save 900 1 --save 300 10'
    restart: no
    stop_grace_period: 30s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    dns:
      - 10.0.0.1
      - 1.1.1.1
    env_file:
      - .secrets
    volumes:
      - authelia_redis_data:/data
    deploy:
      resources:
        limits:
          memory: 48M
          cpus: "1.0"
          pids: 256
        reservations:
          memory: 16M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
networks:
  auth-net:
    driver: bridge
volumes:
  authelia_data:
  authelia_redis_data:
