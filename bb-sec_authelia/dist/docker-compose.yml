services:
  authelia:
    image: authelia/authelia:4.39.15
    container_name: authelia
    restart: unless-stopped
    env_file:
      - .secrets
    environment:
      TZ: Europe/Madrid
    volumes:
      - ./config:/config
    entrypoint: ["sh", "/config/init.sh"]
    ports:
      - "9091:9091"
    networks:
      - auth-net
      - npm_default
    depends_on:
      - redis

  redis:
    image: redis:7-bookworm
    container_name: authelia-redis
    command: redis-server --requirepass ${AUTHELIA_REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped
    networks:
      - auth-net

networks:
  auth-net:
    driver: bridge
  npm_default:
    external: true
