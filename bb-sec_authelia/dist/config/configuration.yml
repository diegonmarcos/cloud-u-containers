  ---
  theme: dark

  server:
    address: tcp://0.0.0.0:9091/authelia
    endpoints:
      authz:
        forward-auth:
          implementation: ForwardAuth
          authn_strategies:
            - name: HeaderAuthorization
              schemes:
                - Bearer
            - name: CookieSession
        auth-request:
          implementation: AuthRequest
          authn_strategies:
            - name: HeaderAuthorization
              schemes:
                - Bearer
            - name: CookieSession

  log:
    level: info

  authentication_backend:
    file:
      path: /config/users_database.yml
      watch: true

  access_control:
    default_policy: two_factor
    rules:
      - domain: auth.diegonmarcos.com
        policy: bypass
      - domain: 'ide.diegonmarcos.com'
        policy: two_factor
      - domain: 'pad.diegonmarcos.com'
        policy: two_factor
      - domain: 'files.diegonmarcos.com'
        policy: two_factor
      - domain: 'sheets.diegonmarcos.com'
        policy: two_factor
      - domain: 'doc.diegonmarcos.com'
        policy: two_factor
      - domain: 'chat.diegonmarcos.com'
        policy: two_factor
      - domain: 'photos.diegonmarcos.com'
        policy: two_factor
      - domain: 'cal.diegonmarcos.com'
        policy: two_factor
      - domain: 'slides.diegonmarcos.com'
        policy: two_factor
      - domain: 'webmail.diegonmarcos.com'
        policy: two_factor
      - domain: 'smtp.diegonmarcos.com'
        policy: two_factor
      - domain: 'mail.diegonmarcos.com'
        policy: two_factor
      - domain: 'vault.diegonmarcos.com'
        policy: two_factor
      - domain: 'api.diegonmarcos.com'
        policy: two_factor
      - domain: 'auth.diegonmarcos.com'
        policy: two_factor
      - domain: 'proxy.diegonmarcos.com'
        policy: two_factor
      - domain: 'api.diegonmarcos.com/c3-api'
        policy: two_factor
      - domain: 'mcp.diegonmarcos.com/c3-infra-mcp'
        policy: two_factor
      - domain: 'api.diegonmarcos.com/services'
        policy: two_factor
      - domain: 'workflows.diegonmarcos.com'
        policy: two_factor
      - domain: 'logs.diegonmarcos.com'
        policy: two_factor
      - domain: 'grafana.diegonmarcos.com'
        policy: two_factor
      - domain: 'analytics.diegonmarcos.com'
        policy: two_factor
      - domain: 'db.diegonmarcos.com'
        policy: two_factor
      - domain: 'rss.diegonmarcos.com'
        policy: two_factor
      - domain: 'analytics.diegonmarcos.com'
        policy: two_factor
      - domain: 'windmill.diegonmarcos.com'
        policy: two_factor
      - domain: 'git.diegonmarcos.com'
        policy: two_factor
      - domain: 'git.diegonmarcos.com'
        policy: two_factor
      - domain: '*.diegonmarcos.com'
        policy: two_factor
      - domain: "*.diegonmarcos.com"
        policy: two_factor

  session:
    name: authelia_session
    cookies:
      - name: authelia_session
        domain: diegonmarcos.com
        authelia_url: https://auth.diegonmarcos.com
        inactivity: 5m
        expiration: 1h
        remember_me: 30d
    redis:
      host: localhost
      port: 6380

  regulation:
    max_retries: 3
    find_time: 10m
    ban_time: 15m

  storage:
    local:
      path: /data/db.sqlite3

  notifier:
    disable_startup_check: true
    smtp:
      address: submissions://10.0.0.3:465
      username: no-reply@diegonmarcos.com
      sender: "Authelia <no-reply@diegonmarcos.com>"
      tls:
        server_name: mail.diegonmarcos.com

  webauthn:
    disable: false
    display_name: diegonmarcos.com
    attestation_conveyance_preference: indirect
    timeout: 60s

  totp:
    issuer: diegonmarcos.com
    period: 30
    skew: 1

  identity_providers:
    oidc:
      lifespans:
        access_token: 87600h
        refresh_token: 87600h
      jwks:
        - key_id: main
          algorithm: RS256
          use: sig
      cors:
        endpoints:
          - authorization
          - token
          - revocation
          - introspection
          - userinfo
        allowed_origins_from_client_redirect_uris: true
      clients:
        - client_id: oauth2-proxy-npm
          consent_mode: explicit
          client_name: NPM Proxy Manager
          public: false
          authorization_policy: two_factor
          redirect_uris:
            - https://proxy.diegonmarcos.com/oauth2/callback
          scopes:
            - openid
            - profile
            - email
            - groups
          userinfo_signed_response_alg: none
          token_endpoint_auth_method: client_secret_basic
          require_pushed_authorization_requests: true
          require_pkce: true
          pkce_challenge_method: S256

        - client_id: nocodb
          consent_mode: explicit
          client_name: NocoDB Database
          public: false
          authorization_policy: two_factor
          redirect_uris:
            - https://db.diegonmarcos.com/api/v1/auth/oidc/callback
            - https://db.diegonmarcos.com/api/v2/auth/oidc/callback
          scopes:
            - openid
            - profile
            - email
          userinfo_signed_response_alg: none
          token_endpoint_auth_method: client_secret_basic
          require_pushed_authorization_requests: true
          require_pkce: true
          pkce_challenge_method: S256

        - client_id: cloudflare-health-c3-api
          consent_mode: explicit
          client_name: Cloudflare Worker Health Check
          public: false
          authorization_policy: two_factor
          redirect_uris:
            - http://localhost:8400/callback
          grant_types:
            - authorization_code
            - refresh_token
          response_types:
            - code
          response_modes:
            - form_post
          scopes:
            - offline_access
            - authelia.bearer.authz
          token_endpoint_auth_method: client_secret_basic
          require_pushed_authorization_requests: true
          require_pkce: true
          pkce_challenge_method: S256
          access_token_signed_response_alg: RS256
          audience:
            - https://api.diegonmarcos.com/

        - client_id: claude-admin
