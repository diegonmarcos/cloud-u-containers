services:
  # ═══ CORE (built from source) ═══

  api:
    build:
      context: ./repo
      dockerfile: docker/Dockerfile.api
    image: ghcr.io/diegonmarcos/crawlee-cloud-api:latest
    container_name: crawlee_api
    restart: "no"  # container-init handles startup
    network_mode: host
    env_file:
      - .secrets
    environment:
      NODE_ENV: production
      PORT: "3000"
      REDIS_URL: redis://localhost:6381
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: crawlee-cloud
      S3_FORCE_PATH_STYLE: "true"
      RATE_LIMIT_MAX: "1000"
      LOG_LEVEL: info
      DB_HOST: localhost
      DB_PORT: "5433"
    command: >
      sh -c '
        export DATABASE_URL="postgresql://$$POSTGRES_USER:$$POSTGRES_PASSWORD@$$DB_HOST:$$DB_PORT/$$POSTGRES_DB"
        export S3_ACCESS_KEY="$$MINIO_USER"
        export S3_SECRET_KEY="$$MINIO_PASSWORD"
        exec node packages/api/dist/index.js
      '
    depends_on:
      crawlee_db:
        condition: service_healthy
      crawlee_redis:
        condition: service_healthy
      crawlee_minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  runner:
    build:
      context: ./repo
      dockerfile: docker/Dockerfile.runner
    image: ghcr.io/diegonmarcos/crawlee-cloud-runner:latest
    container_name: crawlee_runner
    restart: "no"  # container-init handles startup
    network_mode: host
    env_file:
      - .secrets
    environment:
      NODE_ENV: production
      API_BASE_URL: http://localhost:3000
      REDIS_URL: redis://localhost:6381
      DOCKER_SOCKET: /var/run/docker.sock
      DOCKER_NETWORK: host
      MAX_CONCURRENT_RUNS: "5"
      ACTOR_MAX_MEMORY_MB: "2048"
      ACTOR_DEFAULT_MEMORY_MB: "512"
      ACTOR_TIMEOUT_SECS: "3600"
      DB_HOST: localhost
      DB_PORT: "5433"
    command: >
      sh -c '
        export DATABASE_URL="postgresql://$$POSTGRES_USER:$$POSTGRES_PASSWORD@$$DB_HOST:$$DB_PORT/$$POSTGRES_DB"
        export API_TOKEN="$$RUNNER_TOKEN"
        exec node dist/index.js
      '
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      api:
        condition: service_healthy

  dashboard:
    build:
      context: ./repo
      dockerfile: docker/Dockerfile.dashboard
    image: ghcr.io/diegonmarcos/crawlee-cloud-dashboard:latest
    container_name: crawlee_dashboard
    restart: "no"  # container-init handles startup
    network_mode: host
    environment:
      NODE_ENV: production
      PORT: "3001"
      NEXT_PUBLIC_API_URL: http://localhost:3000
    depends_on:
      api:
        condition: service_healthy

  scheduler:
    build:
      context: ./repo
      dockerfile: docker/Dockerfile.api
    image: ghcr.io/diegonmarcos/crawlee-cloud-api:latest
    container_name: crawlee_scheduler
    restart: "no"  # container-init handles startup
    network_mode: host
    env_file:
      - .secrets
    environment:
      NODE_ENV: production
      REDIS_URL: redis://localhost:6381
      DB_HOST: localhost
      DB_PORT: "5433"
    command: >
      sh -c '
        export DATABASE_URL="postgresql://$$POSTGRES_USER:$$POSTGRES_PASSWORD@$$DB_HOST:$$DB_PORT/$$POSTGRES_DB"
        exec sleep infinity
      '

  # ═══ DATA STORES (standard images) ═══

  crawlee_db:
    image: ghcr.io/diegonmarcos/crawlee-db:latest
    build:
      context: .
      dockerfile_inline: |
        FROM postgres:16-alpine
        LABEL org.opencontainers.image.source="https://github.com/diegonmarcos/cloud"
    container_name: crawlee_db
    restart: "no"  # container-init handles startup
    network_mode: host
    env_file:
      - .secrets
    environment:
      PGPORT: "5433"
    volumes:
      - crawlee_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 5

  crawlee_redis:
    image: ghcr.io/diegonmarcos/crawlee-redis:latest
    build:
      context: .
      dockerfile_inline: |
        FROM redis:7-alpine
        LABEL org.opencontainers.image.source="https://github.com/diegonmarcos/cloud"
    container_name: crawlee_redis
    restart: "no"  # container-init handles startup
    network_mode: host
    command: redis-server --appendonly yes --port 6381
    volumes:
      - crawlee_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6381", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  crawlee_minio:
    image: ghcr.io/diegonmarcos/crawlee-minio:latest
    build:
      context: .
      dockerfile_inline: |
        FROM minio/minio:latest
        LABEL org.opencontainers.image.source="https://github.com/diegonmarcos/cloud"
    container_name: crawlee_minio
    restart: "no"  # container-init handles startup
    network_mode: host
    env_file:
      - .secrets
    entrypoint: ["sh", "-c"]
    command:
      - 'export MINIO_ROOT_USER="$$MINIO_USER" && export MINIO_ROOT_PASSWORD="$$MINIO_PASSWORD" && exec minio server /data --address ":9000" --console-address ":9001"'
    volumes:
      - crawlee_minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio_init:
    image: ghcr.io/diegonmarcos/crawlee-minio-mc:latest
    build:
      context: .
      dockerfile_inline: |
        FROM minio/mc:latest
        LABEL org.opencontainers.image.source="https://github.com/diegonmarcos/cloud"
    container_name: crawlee_minio_init
    network_mode: host
    depends_on:
      crawlee_minio:
        condition: service_healthy
    env_file:
      - .secrets
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://localhost:9000 $$MINIO_USER $$MINIO_PASSWORD;
      mc mb myminio/crawlee-cloud --ignore-existing;
      exit 0;
      "

volumes:
  crawlee_postgres:
    name: crawlee_postgres
  crawlee_redis:
    name: crawlee_redis
  crawlee_minio:
    name: crawlee_minio

