services:
  # ═══ CORE (built from source) ═══

  api:
    build:
      context: ./repo
      dockerfile: docker/Dockerfile.api
    image: crawlee-cloud-api:local
    container_name: crawlee_api
    restart: unless-stopped
    env_file:
      - .secrets
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@crawlee_db:5432/${POSTGRES_DB}
      REDIS_URL: redis://crawlee_redis:6379
      S3_ENDPOINT: http://crawlee_minio:9000
      S3_ACCESS_KEY: ${MINIO_USER}
      S3_SECRET_KEY: ${MINIO_PASSWORD}
      S3_BUCKET: crawlee-cloud
      S3_FORCE_PATH_STYLE: "true"
      JWT_SECRET: ${JWT_SECRET}
      RATE_LIMIT_MAX: "1000"
      LOG_LEVEL: info
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    ports:
      - "3000:3000"
    depends_on:
      crawlee_db:
        condition: service_healthy
      crawlee_redis:
        condition: service_healthy
      crawlee_minio:
        condition: service_healthy
    networks:
      - crawlee_network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  runner:
    build:
      context: ./repo
      dockerfile: docker/Dockerfile.runner
    image: crawlee-cloud-runner:local
    container_name: crawlee_runner
    restart: unless-stopped
    env_file:
      - .secrets
    environment:
      NODE_ENV: production
      API_BASE_URL: http://crawlee_api:3000
      API_TOKEN: ${RUNNER_TOKEN}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@crawlee_db:5432/${POSTGRES_DB}
      REDIS_URL: redis://crawlee_redis:6379
      DOCKER_SOCKET: /var/run/docker.sock
      DOCKER_NETWORK: crawlee_network
      MAX_CONCURRENT_RUNS: "5"
      ACTOR_MAX_MEMORY_MB: "2048"
      ACTOR_DEFAULT_MEMORY_MB: "512"
      ACTOR_TIMEOUT_SECS: "3600"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      api:
        condition: service_healthy
    networks:
      - crawlee_network

  dashboard:
    build:
      context: ./repo
      dockerfile: docker/Dockerfile.dashboard
    image: crawlee-cloud-dashboard:local
    container_name: crawlee_dashboard
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3001"
      NEXT_PUBLIC_API_URL: http://crawlee_api:3000
    ports:
      - "3001:3001"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - crawlee_network

  scheduler:
    build:
      context: ./repo
      dockerfile: docker/Dockerfile.api
    image: crawlee-cloud-api:local
    container_name: crawlee_scheduler
    restart: unless-stopped
    env_file:
      - .secrets
    command: ["sleep", "infinity"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@crawlee_db:5432/${POSTGRES_DB}
      REDIS_URL: redis://crawlee_redis:6379
    networks:
      - crawlee_network

  # ═══ DATA STORES (standard images) ═══

  crawlee_db:
    image: postgres:16-alpine
    container_name: crawlee_db
    restart: unless-stopped
    env_file:
      - .secrets
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - crawlee_postgres:/var/lib/postgresql/data
    networks:
      - crawlee_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  crawlee_redis:
    image: redis:7-alpine
    container_name: crawlee_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6380:6379"
    volumes:
      - crawlee_redis:/data
    networks:
      - crawlee_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  crawlee_minio:
    image: minio/minio:latest
    container_name: crawlee_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file:
      - .secrets
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - crawlee_minio:/data
    networks:
      - crawlee_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio_init:
    image: minio/mc:latest
    container_name: crawlee_minio_init
    depends_on:
      crawlee_minio:
        condition: service_healthy
    env_file:
      - .secrets
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://crawlee_minio:9000 ${MINIO_USER} ${MINIO_PASSWORD};
      mc mb myminio/crawlee-cloud --ignore-existing;
      exit 0;
      "
    networks:
      - crawlee_network

volumes:
  crawlee_postgres:
    name: crawlee_postgres
  crawlee_redis:
    name: crawlee_redis
  crawlee_minio:
    name: crawlee_minio

networks:
  crawlee_network:
    name: crawlee_network
    driver: bridge
