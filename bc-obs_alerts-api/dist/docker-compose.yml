services:
  alerts-api:
    image: ghcr.io/diegonmarcos/alerts-api:latest
    build: .
    container_name: alerts-api
    network_mode: host
    restart: no
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    dns:
      - 10.0.0.1
      - 1.1.1.1
    environment:
      - DB_PATH=/data/alerts.db
      - NTFY_URL=https://rss.diegonmarcos.com
      - LOG_LEVEL=info
    volumes:
      - alerts-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 64m
          cpus: "0.1"
          pids: 256
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
volumes:
  alerts-data:
