services:
  caddy:
    image: ghcr.io/diegonmarcos/caddy-l4:latest
    container_name: caddy
    network_mode: host
    restart: unless-stopped
    stop_grace_period: 30s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    env_file:
      - .secrets
    depends_on:
      introspect-proxy:
        condition: service_healthy
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./error.html:/srv/error.html:ro
      - ./dashboard.html:/srv/dashboard.html:ro
      - ./ntfy-setup.html:/srv/ntfy-setup.html:ro
      - ./wkd:/srv/wkd:ro
      - ./logs:/var/log/caddy
      - caddy_data:/data
      - caddy_config:/config
    pids_limit: 256
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    cap_add:
      - NET_BIND_SERVICE

  introspect-proxy:
    image: introspect-proxy:latest
    build: ./introspect-proxy
    container_name: introspect-proxy
    network_mode: host
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    environment:
      DEBUG: "true"
      ISSUER: https://auth.diegonmarcos.com
      JWKS_URL: https://auth.diegonmarcos.com/jwks.json
      REQUIRED_SCOPE: authelia.bearer.authz
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4182/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 96M
          pids: 256
        reservations:
          memory: 48M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
volumes:
  caddy_config:
    driver: local
  caddy_data:
    driver: local
