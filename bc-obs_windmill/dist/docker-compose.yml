# Windmill Workflow Orchestration Platform
# Deploy on: oci-A1-f_0 (oci-apps, 10.0.0.6)
# Port: 8000 (internal, proxied via Caddy)

services:
  windmill-db:
    image: postgres:16-alpine
    container_name: windmill-db
    restart: unless-stopped
    network_mode: host
    env_file:
      - .secrets
    environment:
      - POSTGRES_DB=windmill
      - POSTGRES_USER=windmill
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - PGPORT=5436
    volumes:
      - windmill-db-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U windmill -d windmill -p 5436"]
      interval: 10s
      timeout: 5s
      retries: 5

  windmill-server:
    image: ghcr.io/windmill-labs/windmill:main
    container_name: windmill-server
    restart: unless-stopped
    network_mode: host
    env_file:
      - .secrets
    environment:
      - DATABASE_URL=postgres://windmill:${DB_PASSWORD}@localhost:5436/windmill?sslmode=disable
      - MODE=server
      - BASE_URL=https://windmill.diegonmarcos.com
      - COOKIE_DOMAIN=diegonmarcos.com
      - NUM_WORKERS=2
      - DISABLE_NUSER=true
      - METRICS_ENABLED=false
      - OAUTH_CLIENT_ID=${OAUTH_CLIENT_ID:-}
      - OAUTH_CLIENT_SECRET=${OAUTH_CLIENT_SECRET:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - RUST_LOG=info
    depends_on:
      windmill-db:
        condition: service_healthy
    volumes:
      - windmill-server-data:/tmp/windmill
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  windmill-worker:
    image: ghcr.io/windmill-labs/windmill:main
    container_name: windmill-worker
    restart: unless-stopped
    network_mode: host
    env_file:
      - .secrets
    environment:
      - DATABASE_URL=postgres://windmill:${DB_PASSWORD}@localhost:5436/windmill?sslmode=disable
      - MODE=worker
      - WORKER_GROUP=default
      - NUM_WORKERS=2
      - DISABLE_NUSER=true
      - KEEP_JOB_DIR=false
      - METRICS_ENABLED=false
      - RUST_LOG=info
    depends_on:
      windmill-server:
        condition: service_healthy
    volumes:
      - windmill-worker-data:/tmp/windmill
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/ssh-keys/windmill-worker:/home/windmill/.ssh:ro
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M

volumes:
  windmill-db-data:
    name: windmill-db-data
  windmill-server-data:
    name: windmill-server-data
  windmill-worker-data:
    name: windmill-worker-data

