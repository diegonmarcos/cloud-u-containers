# Authelia - SSO and 2FA Authentication
# Deployed on: gcp-f-micro_1 (35.226.147.64)
# Path on server: /home/diego/authelia/
# Domain: auth.diegonmarcos.com

version: '3.8'

services:
  authelia:
    image: authelia/authelia:latest
    container_name: authelia
    ports:
      - '127.0.0.1:9091:9091'
    volumes:
      - ./config:/config
    environment:
      - TZ=UTC
    restart: unless-stopped
    networks:
      - auth-net

  redis:
    image: redis:7-bookworm
    container_name: authelia-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - '127.0.0.1:6379:6379'
    restart: unless-stopped
    networks:
      - auth-net

networks:
  auth-net:
    driver: bridge
