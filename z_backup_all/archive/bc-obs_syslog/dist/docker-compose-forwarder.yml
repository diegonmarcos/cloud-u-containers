

services:
  syslog-forwarder:
    image: balabit/syslog-ng:4.4.0
    container_name: syslog-forwarder
    restart: unless-stopped
    environment:
      TZ: Europe/Madrid
    volumes:
      - ./config/syslog-ng-forwarder.conf:/etc/syslog-ng/syslog-ng.conf:ro
      - /var/log:/var/log/host:ro
    networks:
      - proxy

networks:
  proxy:
    external: true
