@version: 4.4
@include "scl.conf"

options {
  time-reap(30);
  chain-hostnames(no);
  keep-hostname(yes);
};

source s_local {
  file("/var/log/host/syslog");
  file("/var/log/host/auth.log");
  file("/var/log/host/kern.log");
};

# Change this IP to your central syslog server
destination d_central {
  network("10.0.0.1" transport("tcp") port(514));
};

log {
  source(s_local);
  destination(d_central);
};
