@version: 4.4
@include "scl.conf"

options {
  time-reap(30);
  mark-freq(10);
  keep-hostname(yes);
  chain-hostnames(no);
};

source s_net {
  network(
    transport("udp")
    port(514)
  );
  network(
    transport("tcp")
    port(514)
  );
};

destination d_remote {
  file("/var/log/remote/$HOST/$YEAR-$MONTH-$DAY.log"
    create-dirs(yes)
    perm(0644)
    dir-perm(0755)
  );
};

log {
  source(s_net);
  destination(d_remote);
};
