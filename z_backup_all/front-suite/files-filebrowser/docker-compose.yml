version: '3.8'

# Filebrowser - Web file manager
# Simple and fast file management
# Deployed on: oci-p-flex_1 (Oracle Flex)

services:
  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser_app
    restart: "no"

    ports:
      - "3015:80"

    volumes:
      - filebrowser_data:/srv
      - filebrowser_db:/database
      - filebrowser_config:/config

    environment:
      - PUID=1000
      - PGID=1000
      - FB_DATABASE=/database/filebrowser.db
      - FB_CONFIG=/config/settings.json
      - FB_ROOT=/srv
      - FB_NOAUTH=false

    networks:
      - dev_network

    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:80/health']
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  dev_network:
    external: true
    name: dev_network

volumes:
  filebrowser_data:
    driver: local
  filebrowser_db:
    driver: local
  filebrowser_config:
    driver: local
