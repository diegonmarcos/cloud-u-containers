services:
  c3-infra-api:
    image: ghcr.io/diegonmarcos/c3-infra-api:latest
    container_name: c3-infra-api
    network_mode: host
    restart: no
    stop_grace_period: 30s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    dns:
      - 10.0.0.1
      - 1.1.1.1
    env_file:
      - .secrets
    environment:
      - NODE_ENV=production
      - GIT_BASE=/root/git
      - AUTHELIA_OIDC_CLIENT_ID=c3-infra-api
      - AUTHELIA_OIDC_CLIENT_SECRET=${AUTHELIA_OIDC_C3_INFRA_MCP_SECRET}
      - AUTHELIA_TOKEN_URL=https://auth.diegonmarcos.com/api/oidc/token
      - RESEND_API_KEY=${RESEND_API_KEY}
      - CF_API_KEY=${CF_API_KEY}
      - CF_API_EMAIL=${CF_API_EMAIL}
      - PATH=/usr/local/nix-bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      - PORT=8081
    volumes:
      - /opt/ssh-keys/c3-infra-api:/root/.ssh:ro
      - /nix/store:/nix/store:ro
      - /home/ubuntu/.nix-profile/bin:/usr/local/nix-bin:ro
      - ~/.config/gcloud:/root/.config/gcloud
      - c3_git_repos:/root/git
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
          pids: 256
        reservations:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
volumes:
  c3_git_repos:
    external: true
    name: c3-mcp-api_c3-repos
