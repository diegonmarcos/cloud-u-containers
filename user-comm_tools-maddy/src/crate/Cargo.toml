[package]
name = "maddy-sorter"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "maddy-sorter"
path = "src/main.rs"

[dependencies]
# "bundled" compiles its own libsqlite3 -- no system sqlite3 needed in the
# container, unlike the bash apply-rules this replaces (which shelled out
# to the `sqlite3` CLI + `xxd` for hex/blob round-tripping). The other
# post-hoc subcommands (integrity-check, dedupe, ...) stay bash and still
# need those apk packages -- this crate doesn't remove them from init.sh.
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

# NOTE: no Cargo.lock is committed -- see the same note in
# user-comm_tools-stalwart/src/crate/Cargo.toml (no local `cargo build`
# allowed; GHA resolves fresh on each build until a lock is committed from
# the first green run).
