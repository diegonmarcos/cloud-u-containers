services:
  introspect-proxy:
    image: ghcr.io/diegonmarcos/introspect-proxy:latest
    container_name: introspect-proxy
    network_mode: host
    restart: no
    stop_grace_period: 30s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    dns:
      - 10.0.0.1
      - 1.1.1.1
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:4182/health']
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "1.0"
          pids: 256
        reservations:
          memory: 16M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
