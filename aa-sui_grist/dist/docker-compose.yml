services:
  grist:
    image: ghcr.io/diegonmarcos/grist:latest
    build:
      context: .
      dockerfile_inline: |
        FROM gristlabs/grist:latest
        COPY docker-compose.yml /opt/cloud-docs/docker-compose.yml
        LABEL org.opencontainers.image.source="https://github.com/diegonmarcos/cloud"
        LABEL org.opencontainers.image.description="grist"
        LABEL org.opencontainers.image.title="grist"
        LABEL cloud.diegonmarcos.from-image="gristlabs/grist:latest"
        LABEL cloud.diegonmarcos.registry="ghcr.io/diegonmarcos"
    container_name: grist_app
    network_mode: host
    restart: no
    stop_grace_period: 30s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    dns:
      - 10.0.0.1
      - 1.1.1.1
    environment:
      - GRIST_SESSION_SECRET=changeme-secret-key
      - GRIST_SINGLE_ORG=docs
      - GRIST_DEFAULT_EMAIL=${GRIST_ADMIN_EMAIL:-admin@diegonmarcos.com}
      - APP_HOME_URL=https://sheets.diegonmarcos.com
      - GRIST_SANDBOX_FLAVOR=unsandboxed
      - GRIST_LOG_LEVEL=info
      - PORT=3011
    volumes:
      - grist_data:/persist
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3011/']
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
          pids: 256
        reservations:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
volumes:
  grist_data:
