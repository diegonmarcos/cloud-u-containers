services:
  grist:
    image: gristlabs/grist:latest
    container_name: grist_app
    network_mode: host
    restart: no
    stop_grace_period: 30s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    dns:
      - 10.0.0.1
      - 1.1.1.1
    environment:
      - GRIST_SESSION_SECRET=changeme-secret-key
      - GRIST_SINGLE_ORG=docs
      - GRIST_DEFAULT_EMAIL=${GRIST_ADMIN_EMAIL:-admin@diegonmarcos.com}
      - APP_HOME_URL=https://sheets.diegonmarcos.com
      - GRIST_SANDBOX_FLAVOR=unsandboxed
      - GRIST_LOG_LEVEL=info
    volumes:
      - grist_data:/persist
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8484/']
      interval: 30s
      timeout: 10s
      retries: 3
    pids_limit: 256
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
volumes:
  grist_data:
