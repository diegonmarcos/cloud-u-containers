# Grist - Modern collaborative spreadsheet
# Deployed on: oci-A1-f_1 (Oracle Flex)

services:
  grist:
    image: gristlabs/grist:latest
    container_name: grist_app
    restart: always
    ports:
      - "10.0.0.6:3011:8484"
    volumes:
      - grist_data:/persist
    environment:
      - GRIST_SESSION_SECRET=changeme-secret-key
      - GRIST_SINGLE_ORG=docs
      - GRIST_DEFAULT_EMAIL=${GRIST_ADMIN_EMAIL:-admin@diegonmarcos.com}
      - APP_HOME_URL=https://sheets.diegonmarcos.com
      - GRIST_SANDBOX_FLAVOR=unsandboxed
    networks:
      - dev_network
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8484/']
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  dev_network:
    external: true
    name: dev_network

volumes:
  grist_data:
    driver: local
