services:
  stalwart:
    image: ghcr.io/diegonmarcos/stalwart:latest
    build:
      context: .
      dockerfile_inline: |
        FROM stalwartlabs/stalwart:latest
        COPY config.toml /opt/stalwart-mail/etc/config.toml
        COPY docker-compose.yml /opt/cloud-docs/docker-compose.yml
        LABEL org.opencontainers.image.source="https://github.com/diegonmarcos/cloud"
        LABEL org.opencontainers.image.description="stalwart"
        LABEL org.opencontainers.image.title="stalwart"
        LABEL cloud.diegonmarcos.from-image="stalwartlabs/stalwart:latest"
        LABEL cloud.diegonmarcos.registry="ghcr.io/diegonmarcos"
    container_name: stalwart
    network_mode: host
    entrypoint: ["stalwart", "--config", "/opt/stalwart-mail/etc/config.toml"]
    restart: no
    stop_grace_period: 30s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    dns:
      - 10.0.0.1
      - 1.1.1.1
    environment:
      - TZ=Europe/Madrid
    volumes:
      - stalwart_data:/opt/stalwart-mail/data
      - /opt/containers/maddy/tls:/opt/stalwart-mail/tls:ro
      - ./config.toml:/opt/stalwart-mail/etc/config.toml:ro
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "1.0"
          pids: 256
        reservations:
          memory: 32M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true

  stalwart-sorter:
    image: python:3-alpine
    container_name: stalwart-sorter
    network_mode: host
    entrypoint: ["python3", "/app/imap-sorter.py"]
    restart: no
    stop_grace_period: 30s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    dns:
      - 10.0.0.1
      - 1.1.1.1
    env_file:
      - .secrets
    environment:
      - IMAP_PORT=2993
      - RULES_PATH=/data/mail-rules.json
      - STARTUP_DELAY=20
    volumes:
      - ./imap-sorter.py:/app/imap-sorter.py:ro
      - ./mail-rules.json:/data/mail-rules.json:ro
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "1.0"
          pids: 256
        reservations:
          memory: 16M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
volumes:
  stalwart_data:
