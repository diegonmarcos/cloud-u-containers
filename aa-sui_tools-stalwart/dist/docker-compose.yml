services:
  stalwart:
    image: ghcr.io/diegonmarcos/stalwart:latest
    build:
      context: .
      dockerfile_inline: |
        FROM stalwartlabs/stalwart:v0.13
        COPY config.toml.tpl /opt/stalwart-mail/etc/config.toml.tpl
        COPY init.sh /opt/stalwart-mail/init.sh
        RUN apt-get update && apt-get install -y --no-install-recommends gettext-base curl && rm -rf /var/lib/apt/lists/*
        COPY docker-compose.yml /opt/cloud-docs/docker-compose.yml
        LABEL org.opencontainers.image.source="https://github.com/diegonmarcos/cloud"
        LABEL org.opencontainers.image.description="stalwart"
        LABEL org.opencontainers.image.title="stalwart"
        LABEL cloud.diegonmarcos.from-image="stalwartlabs/stalwart:v0.13"
        LABEL cloud.diegonmarcos.registry="ghcr.io/diegonmarcos"
    container_name: stalwart
    network_mode: host
    entrypoint: ["sh", "/opt/stalwart-mail/init.sh"]
    restart: no
    stop_grace_period: 30s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    dns:
      - 10.0.0.1
      - 1.1.1.1
    env_file:
      - .secrets
    environment:
      - TZ=Europe/Madrid
    volumes:
      - stalwart_data:/opt/stalwart-mail/data
      - /opt/containers/maddy/tls:/opt/stalwart-mail/tls:ro
      - ./config.toml.tpl:/opt/stalwart-mail/etc/config.toml.tpl:ro
      - ./init.sh:/opt/stalwart-mail/init.sh:ro
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "1.0"
          pids: 256
        reservations:
          memory: 32M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
volumes:
  stalwart_data:
