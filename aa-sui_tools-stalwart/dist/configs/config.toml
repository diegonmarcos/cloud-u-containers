# Stalwart v0.13 — minimal config (shadow mode, offset ports)
# Matches auto-generated format. Admin panel manages everything else.

[server]
hostname = "mail-stalwart.diegonmarcos.com"
url = "https://mail-stalwart.diegonmarcos.com"

[server.listener.smtp]
bind = "[::]:2025"
protocol = "smtp"

[server.listener.submission]
bind = "[::]:2587"
protocol = "smtp"

[server.listener.submissions]
bind = "[::]:2465"
protocol = "smtp"
tls.implicit = true

[server.listener.imaptls]
bind = "[::]:2993"
protocol = "imap"
tls.implicit = true

[server.listener.sieve]
bind = "[::]:6190"
protocol = "managesieve"

[server.listener.https]
protocol = "http"
bind = "[::]:2443"
tls.implicit = true

[server.listener.http]
protocol = "http"
bind = "[::]:8080"

[storage]
data = "rocksdb"
fts = "rocksdb"
blob = "rocksdb"
lookup = "rocksdb"
directory = "internal"

[store.rocksdb]
type = "rocksdb"
path = "/opt/stalwart-mail/data"
compression = "lz4"

[directory.internal]
type = "internal"
store = "rocksdb"

[certificate.default]
default = true
cert = "%{file:/opt/stalwart-mail/tls/fullchain.pem}%"
private-key = "%{file:/opt/stalwart-mail/tls/privkey.pem}%"

[authentication.fallback-admin]
user = "admin"
secret = "$6$StalwartShadow$TnGwCZsckFjb/S6BcJV5UL8Gxf25mlA4eO2WI1G7jDYCwdMTfeSQUAUcR2H6mujyRMTjAWMHf3SyRNW/3.r7a/"

# ── Inbound SMTP (port 2025): no auth required (shadow delivery from smtp-proxy) ──
[session.auth]
require = [{if = "local_port != 2025", then = true}, {else = false}]

[tracer.log]
type = "stdout"
level = "info"
enable = true
