services:
  news-gdelt:
    image: ghcr.io/diegonmarcos/news-gdelt:latest
    container_name: news-gdelt
    network_mode: host
    restart: no
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    dns:
      - 10.0.0.1
      - 1.1.1.1
    environment:
      - NODE_ENV=production
      - CACHE_DIR=/app/cache
      - FETCH_INTERVAL=900
      - TZ=Europe/Paris
      - BASE_PATH=/news
      - PORT=3019
    volumes:
      - news_gdelt_cache:/app/cache
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://10.0.0.6:3019/health', r => { process.exit(r.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
          pids: 256
        reservations:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
volumes:
  news_gdelt_cache:
