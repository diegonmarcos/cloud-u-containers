services:
  bup:
    image: ghcr.io/diegonmarcos/backup-bup:latest
    build:
      context: .
      dockerfile_inline: |
        FROM alpine:3.20
        COPY authorized_keys /root/.ssh/authorized_keys
        COPY docker-compose.yml /opt/cloud-docs/docker-compose.yml
        LABEL org.opencontainers.image.source="https://github.com/diegonmarcos/cloud"
        LABEL org.opencontainers.image.description="backup-bup"
        LABEL org.opencontainers.image.title="backup-bup"
        LABEL cloud.diegonmarcos.from-image="alpine:3.20"
        LABEL cloud.diegonmarcos.registry="ghcr.io/diegonmarcos"
    container_name: bup-server
    network_mode: host
    command: sh -c "apk add --no-cache restic openssh-server && mkdir -p /backup/databases /root/.ssh && chmod 700 /root/.ssh && ssh-keygen -A && echo 'PermitRootLogin prohibit-password' >> /etc/ssh/sshd_config && /usr/sbin/sshd -D -p 2223"
    restart: no
    stop_grace_period: 30s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    dns:
      - 10.0.0.1
      - 1.1.1.1
    volumes:
      - bup_data:/backup/databases
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
          pids: 256
        reservations:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  bup_data:
    driver: local
    driver_opts:
      device: /backup/databases
      o: bind
      type: none
