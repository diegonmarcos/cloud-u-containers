services:
  rig:
    build:
      context: .
      dockerfile: Dockerfile
    image: rig-infra:latest
    container_name: rig
    restart: unless-stopped
    network_mode: host
    env_file:
      - .secrets
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8090/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
