services:
  cloud-cgc-mcp:
    image: ghcr.io/diegonmarcos/cloud-cgc-mcp:latest
    container_name: cloud-cgc-mcp
    restart: "no"  # container-init handles startup
    network_mode: host
    environment:
      MCP_TRANSPORT: http
      MCP_HTTP_PORT: "3105"
      CONFIG_PATH: "/data/config.json"
      GIT_ROOT: "/home/diego/Mounts/Git"
    volumes:
      - ./data:/data:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3105/mcp').catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

