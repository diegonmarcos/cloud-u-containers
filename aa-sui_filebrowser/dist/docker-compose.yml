services:
  filebrowser:
    image: ghcr.io/diegonmarcos/filebrowser:latest
    build:
      context: .
      dockerfile_inline: |
        FROM filebrowser/filebrowser:latest
        COPY docker-compose.yml /opt/cloud-docs/docker-compose.yml
        LABEL org.opencontainers.image.source="https://github.com/diegonmarcos/cloud"
        LABEL org.opencontainers.image.description="filebrowser"
        LABEL org.opencontainers.image.title="filebrowser"
        LABEL cloud.diegonmarcos.from-image="filebrowser/filebrowser:latest"
        LABEL cloud.diegonmarcos.registry="ghcr.io/diegonmarcos"
    container_name: filebrowser_app
    restart: no
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    dns:
      - 10.0.0.6
    environment:
      - PUID=1000
      - PGID=1000
      - FB_DATABASE=/database/filebrowser.db
      - FB_CONFIG=/config/settings.json
      - FB_ROOT=/srv
      - FB_NOAUTH=false
      - FB_LOG=stdout
      - FB_PORT=8080
    ports:
      - "10.0.0.6:3015:8080"
    volumes:
      - filebrowser_data:/srv
      - filebrowser_db:/database
      - filebrowser_config:/config
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:8080/health']
      interval: 30s
      timeout: 10s
      retries: 3
    pids_limit: 256
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
volumes:
  filebrowser_config:
  filebrowser_data:
  filebrowser_db:
