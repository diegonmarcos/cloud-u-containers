version: "3.8"

services:
  code-server:
    image: lscr.io/linuxserver/code-server:latest
    container_name: code-server
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
      # No password - protected by Authelia
      - PASSWORD=
      - SUDO_PASSWORD=${SUDO_PASSWORD:-changeme}
      - DEFAULT_WORKSPACE=/config/workspace
    volumes:
      - ./config:/config
      - ./workspace:/config/workspace
      # Mount additional directories as needed:
      # - /path/to/projects:/config/workspace/projects
    ports:
      # Bind to WireGuard IP only (10.0.0.2) for security
      # Use 0.0.0.0 for local testing
      - "${BIND_IP:-0.0.0.0}:8443:8443"
    networks:
      - webide_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8443/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  webide_net:
    driver: bridge
