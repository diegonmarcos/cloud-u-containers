version: '3.8'

services:
  cloud-connect:
    build:
      context: .
      dockerfile: Dockerfile
    image: cloud-connect:basic
    container_name: cloud-basic
    hostname: cloud-basic

    volumes:
      - cloud-home:/home/clouduser
      - /tmp/.X11-unix:/tmp/.X11-unix:rw

    environment:
      - DISPLAY=${DISPLAY}
      - CLOUD_PROFILE=basic

    network_mode: host

    cap_add:
      - NET_ADMIN
      - SYS_ADMIN

    devices:
      - /dev/net/tun:/dev/net/tun

    restart: unless-stopped

volumes:
  cloud-home:
