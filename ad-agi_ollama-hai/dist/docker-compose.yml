services:
  ollama-hai:
    image: ghcr.io/diegonmarcos/ollama-hai:latest
    build:
      context: .
      dockerfile_inline: |
        FROM ollama/ollama:latest
        LABEL org.opencontainers.image.source="https://github.com/diegonmarcos/cloud"
    container_name: ollama-hai
    restart: "no"  # container-init handles startup
    network_mode: host
    volumes:
      - ollama_hai_data:/root/.ollama
    environment:
      - TZ=America/Chicago
      - OLLAMA_KEEP_ALIVE=-1
      - OLLAMA_HOST=0.0.0.0:11435
      - OLLAMA_NUM_PARALLEL=2
      - OLLAMA_MAX_LOADED_MODELS=2
      - OLLAMA_NUM_CTX=4096
    deploy:
      resources:
        limits:
          memory: 6G
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  ollama_hai_data:
