---
theme: dark

server:
  address: tcp://0.0.0.0:9091/authelia
  endpoints:
    authz:
      forward-auth:
        implementation: ForwardAuth
        authn_strategies:
          - name: HeaderAuthorization
            schemes:
              - Bearer
          - name: CookieSession
      auth-request:
        implementation: AuthRequest
        authn_strategies:
          - name: HeaderAuthorization
            schemes:
              - Bearer
          - name: CookieSession

log:
  level: info

authentication_backend:
  file:
    path: /tmp/users_database.yml
    watch: true

access_control:
  default_policy: two_factor
  rules:
    - domain: auth.diegonmarcos.com
      policy: bypass
    - domain: '*.diegonmarcos.com'
      policy: two_factor
    - domain: "*.diegonmarcos.com"
      policy: two_factor

identity_validation:
  reset_password:
    jwt_secret: '{{ secret "/run/secrets/AUTHELIA_JWT_SECRET" }}'

session:
  secret: '{{ secret "/run/secrets/AUTHELIA_SESSION_SECRET" }}'
  name: authelia_session
  cookies:
    - name: authelia_session
      domain: diegonmarcos.com
      authelia_url: https://auth.diegonmarcos.com
      inactivity: 5m
      expiration: 1h
      remember_me: 30d
  redis:
    host: redis
    port: 6380
    password: '{{ secret "/run/secrets/AUTHELIA_REDIS_PASSWORD" }}'

regulation:
  max_retries: 3
  find_time: 10m
  ban_time: 15m

storage:
  encryption_key: '{{ secret "/run/secrets/AUTHELIA_STORAGE_ENCRYPTION_KEY" }}'
  local:
    path: /data/db.sqlite3

notifier:
  disable_startup_check: true
  smtp:
    address: submissions://10.0.0.3:465
    username: no-reply@diegonmarcos.com
    password: '{{ secret "/run/secrets/AUTHELIA_SMTP_PASSWORD" }}'
    sender: "Authelia <no-reply@diegonmarcos.com>"
    tls:
      server_name: mail.diegonmarcos.com

# Passkey (WebAuthn) is the primary factor offered; TOTP is the fallback.
default_2fa_method: 'webauthn'

webauthn:
  disable: false
  display_name: diegonmarcos.com
  attestation_conveyance_preference: indirect
  timeout: 60s

totp:
  issuer: diegonmarcos.com
  period: 30
  skew: 1

identity_providers:
  oidc:
    hmac_secret: '{{ secret "/run/secrets/AUTHELIA_OIDC_HMAC_SECRET" }}'
    lifespans:
      access_token: 87600h
      refresh_token: 87600h
    cors:
      endpoints:
        - authorization
        - token
        - revocation
        - introspection
        - userinfo
      allowed_origins_from_client_redirect_uris: true
    clients:
          - client_id: oauth2-proxy-npm
            client_secret: '{{ secret "/run/secrets/AUTHELIA_OIDC_CLIENT_NPM_SECRET" }}'
            consent_mode: explicit
            client_name: NPM Proxy Manager
            public: false
            authorization_policy: two_factor
            redirect_uris:
              - https://proxy.diegonmarcos.com/oauth2/callback
            scopes:
              - openid
              - profile
              - email
              - groups
            userinfo_signed_response_alg: none
            token_endpoint_auth_method: client_secret_basic
            require_pushed_authorization_requests: true
            require_pkce: true
            pkce_challenge_method: S256

          - client_id: nocodb
            client_secret: '{{ secret "/run/secrets/AUTHELIA_OIDC_CLIENT_NOCODB_SECRET" }}'
            consent_mode: explicit
            client_name: NocoDB Database
            public: false
            authorization_policy: two_factor
            redirect_uris:
              - https://db.diegonmarcos.com/api/v1/auth/oidc/callback
              - https://db.diegonmarcos.com/api/v2/auth/oidc/callback
            scopes:
              - openid
              - profile
              - email
            userinfo_signed_response_alg: none
            token_endpoint_auth_method: client_secret_basic
            require_pushed_authorization_requests: true
            require_pkce: true
            pkce_challenge_method: S256

          - client_id: cloudflare-health-c3-api
            client_secret: '{{ secret "/run/secrets/AUTHELIA_OIDC_CLIENT_CLOUDFLARE_SECRET" }}'
            consent_mode: explicit
            client_name: Cloudflare Worker Health Check
            public: false
            authorization_policy: two_factor
            redirect_uris:
              - http://localhost:8400/callback
            grant_types:
              - authorization_code
              - refresh_token
            response_types:
              - code
            response_modes:
              - form_post
            scopes:
              - offline_access
              - authelia.bearer.authz
            token_endpoint_auth_method: client_secret_basic
            require_pushed_authorization_requests: true
            require_pkce: true
            pkce_challenge_method: S256
            access_token_signed_response_alg: RS256
            audience:
