services:
  smtp-proxy:
    build: .
    container_name: smtp-proxy
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SMTP_HOST=front
      - SMTP_PORT=25
      - API_KEY=stalwart-proxy-key-2025
      - LISTEN_PORT=8080
    networks:
      - mailu_default

networks:
  mailu_default:
    external: true
