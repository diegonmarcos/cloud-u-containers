; PHP-FPM main config for the receiver (always-on)
; Only loads the receiver pool

[global]
pid = /run/php/receiver-fpm.pid
error_log = /var/log/supervisor/receiver-php-error.log

[receiver]
user = www-data
group = www-data

listen = /run/php/receiver-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Minimal pool - only needs 1-2 workers for tracking payload saving
pm = static
pm.max_children = 2

; Security
php_admin_value[open_basedir] = /var/www/receiver:/inbox:/tmp
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen

; Resource limits
php_admin_value[memory_limit] = 16M
php_admin_value[max_execution_time] = 10
php_admin_value[post_max_size] = 1M
php_admin_value[upload_max_filesize] = 0
php_admin_flag[log_errors] = on
