services:
  code-server:
    image: linuxserver/code-server:latest
    container_name: code-server
    restart: always
    environment:
      TZ: Europe/Madrid
      PUID: 1000
      PGID: 1000
      DEFAULT_WORKSPACE: /workspace
    ports:
      - "8443:8443"
    volumes:
      - ./config:/config
      - /home/ubuntu/workspace:/workspace
    networks:
      - dev_network

networks:
  dev_network:
    external: true
