# Gitea secrets - ENCRYPT WITH: sops -e -i secrets.yaml

# Admin account (created on first run if INSTALL_LOCK=false)
GITEA__security__SECRET_KEY: CHANGE_ME_64_CHAR_SECRET
GITEA__security__INTERNAL_TOKEN: CHANGE_ME_INTERNAL_TOKEN

# Optional: OAuth2 JWT secret
GITEA__oauth2__JWT_SECRET: CHANGE_ME_JWT_SECRET
