services:
  caddy:
    image: ghcr.io/diegonmarcos/caddy-custom:latest
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./error.html:/srv/error.html:ro
      - ./logs:/var/log/caddy
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - npm_default
    depends_on:
      introspect-proxy:
        condition: service_healthy

  introspect-proxy:
    build: ./introspect-proxy
    image: introspect-proxy:latest
    container_name: introspect-proxy
    restart: unless-stopped
    env_file:
      - .env
    environment:
      INTROSPECT_URL: https://auth.diegonmarcos.com/api/oidc/introspection
      CLIENT_ID: cli
      CLIENT_SECRET: ${AUTHELIA_CLI_SECRET}
    networks:
      - npm_default
    deploy:
      resources:
        limits:
          memory: 96M
        reservations:
          memory: 48M
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4182/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  caddy_data:
    driver: local
  caddy_config:
    driver: local

networks:
  npm_default:
    external: true
