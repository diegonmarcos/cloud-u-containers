# Etherpad - Real-time collaborative document editor
# Deployed on: oci-p-flex_1 (Oracle Flex)

services:
  etherpad:
    image: etherpad/etherpad:latest
    container_name: etherpad_app
    restart: always
    ports:
      - "3012:9001"
    volumes:
      - etherpad_data:/opt/etherpad-lite/var
    environment:
      - TITLE=Etherpad
      - DEFAULT_PAD_TEXT=Welcome to Etherpad!
      - ADMIN_PASSWORD=${ETHERPAD_ADMIN_PASSWORD:-changeme}
      - DB_TYPE=postgres
      - DB_HOST=etherpad_postgres
      - DB_PORT=5432
      - DB_NAME=etherpad
      - DB_USER=etherpad
      - DB_PASS=etherpad
      - TRUST_PROXY=true
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dev_network
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9001/']
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:16-alpine
    container_name: etherpad_postgres
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=etherpad
      - POSTGRES_PASSWORD=etherpad
      - POSTGRES_DB=etherpad
      - PGDATA=/var/lib/postgresql/data/pgdata
    networks:
      - dev_network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U etherpad']
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  dev_network:
    external: true
    name: dev_network

volumes:
  etherpad_data:
    driver: local
  postgres_data:
    driver: local
