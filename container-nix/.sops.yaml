# SOPS configuration for container-nix secrets
# Uses age encryption with Diego's key

keys:
  - &diego age1u575hx8h4t5cgle2uznmyfy75e7cgd02h9t5dax506luz9e05vlqxtd7pq

creation_rules:
  # Per-service secrets files
  - path_regex: .*/secrets\.yaml$
    key_groups:
      - age:
          - *diego
  # JWKS key files
  - path_regex: .*/jwks_key\.yaml$
    key_groups:
      - age:
          - *diego
