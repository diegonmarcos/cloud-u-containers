# HedgeDoc - Collaborative markdown editor
# Real-time collaboration on markdown documents
# Deployed on: oci-p-flex_1 (Oracle Flex)

services:
  hedgedoc:
    image: quay.io/hedgedoc/hedgedoc:latest
    container_name: hedgedoc_app
    restart: "no"
    ports:
      - "3010:3000"
    depends_on:
      hedgedoc_postgres:
        condition: service_healthy
    volumes:
      - hedgedoc_uploads:/hedgedoc/public/uploads
    environment:
      - CMD_DB_URL=postgres://hedgedoc:hedgedoc@hedgedoc_postgres:5432/hedgedoc
      - CMD_DOMAIN=notes.diegonmarcos.com
      - CMD_PROTOCOL_USESSL=true
      - CMD_URL_ADDPORT=false
      - CMD_ALLOW_ANONYMOUS=true
      - CMD_ALLOW_ANONYMOUS_EDITS=true
      - CMD_ALLOW_FREEURL=true
      - CMD_DEFAULT_PERMISSION=freely
      - CMD_SESSION_SECRET=hedgedoc-secret-change-me
      - CMD_EMAIL=true
      - CMD_ALLOW_EMAIL_REGISTER=true
    networks:
      - dev_network
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:3000/status']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  hedgedoc_postgres:
    image: postgres:16-alpine
    container_name: hedgedoc_postgres
    restart: "no"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=hedgedoc
      - POSTGRES_PASSWORD=hedgedoc
      - POSTGRES_DB=hedgedoc
      - PGDATA=/var/lib/postgresql/data/pgdata
    networks:
      - dev_network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hedgedoc']
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  dev_network:
    external: true
    name: dev_network

volumes:
  hedgedoc_uploads:
    driver: local
  postgres_data:
    driver: local
