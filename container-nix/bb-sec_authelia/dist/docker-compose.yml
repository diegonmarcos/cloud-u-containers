services:
  authelia:
    image: authelia/authelia:latest
    container_name: authelia
    restart: always
    env_file:
      - .env
    environment:
      TZ: Europe/Madrid
    volumes:
      - ./config:/config
    entrypoint: /config/init.sh
    ports:
      - "9091:9091"
    networks:
      - auth-net
      - npm_default
    depends_on:
      - redis

  redis:
    image: redis:7-bookworm
    container_name: authelia-redis
    command: redis-server --requirepass ${AUTHELIA_REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    restart: always
    networks:
      - auth-net

networks:
  auth-net:
    driver: bridge
  npm_default:
    external: true
