# Authelia secrets - ENCRYPT WITH: sops -e -i secrets.yaml
# Decrypted to .env at deploy time, mounted into container

# JWT secret (64+ chars)
AUTHELIA_JWT_SECRET: CHANGE_ME_64_CHAR_SECRET

# Session secret (64+ chars)
AUTHELIA_SESSION_SECRET: CHANGE_ME_64_CHAR_SECRET

# Storage encryption key (64+ chars)
AUTHELIA_STORAGE_ENCRYPTION_KEY: CHANGE_ME_64_CHAR_SECRET

# User password hash - generate with:
# docker run authelia/authelia:latest authelia crypto hash generate argon2 --password 'yourpassword'
AUTHELIA_USER_DIEGO_HASH: "$argon2id$v=19$m=65536,t=3,p=4$CHANGE_ME"
