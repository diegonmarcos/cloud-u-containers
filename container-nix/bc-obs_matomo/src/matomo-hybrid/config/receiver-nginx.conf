# Receiver Nginx - Always On (port 8080)
# Serves static JS, proxies tracking to Matomo or falls back to inbox receiver

server {
    listen 8080 default_server;
    server_name _;

    root /var/www/html;
    index index.php index.html;

    # Logging
    access_log /var/log/nginx/receiver-access.log;
    error_log /var/log/nginx/receiver-error.log;

    # ═══════════════════════════════════════════════════════════════
    # STATIC JS - Always served from matomo_data volume
    # ═══════════════════════════════════════════════════════════════

    location = /matomo.js {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }

    location = /piwik.js {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }

    location /js/ {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }

    # ═══════════════════════════════════════════════════════════════
    # TRACKING ENDPOINTS - Proxy to Matomo or fallback to receiver
    # ═══════════════════════════════════════════════════════════════

    location = /matomo.php {
        error_page 502 504 = @tracking_fallback;
        proxy_pass http://127.0.0.1:8081/matomo.php;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
    }

    location = /piwik.php {
        error_page 502 504 = @tracking_fallback;
        proxy_pass http://127.0.0.1:8081/piwik.php;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
    }

    # Anti-blocker endpoints
    location = /collect.php {
        error_page 502 504 = @tracking_fallback;
        proxy_pass http://127.0.0.1:8081/matomo.php;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
    }

    location = /api.php {
        error_page 502 504 = @tracking_fallback;
        proxy_pass http://127.0.0.1:8081/matomo.php;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
    }

    location = /track.php {
        error_page 502 504 = @tracking_fallback;
        proxy_pass http://127.0.0.1:8081/matomo.php;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
    }

    # Fallback: save tracking payload to inbox via receiver PHP-FPM
    location @tracking_fallback {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/receiver/receive.php;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_param CONTENT_TYPE $content_type;
        fastcgi_param CONTENT_LENGTH $content_length;
        fastcgi_pass unix:/run/php/receiver-fpm.sock;
    }

    # ═══════════════════════════════════════════════════════════════
    # UI - Proxy to Matomo or return 503
    # ═══════════════════════════════════════════════════════════════

    location / {
        error_page 502 = @sleeping;
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
    }

    location @sleeping {
        default_type text/html;
        return 503 '<!DOCTYPE html>
<html><head><title>Matomo - Sleeping</title>
<style>body{font-family:sans-serif;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;background:#1a1a2e;color:#e0e0e0}
.box{text-align:center;padding:2rem;border-radius:8px;background:#16213e;border:1px solid #0f3460}
h1{color:#e94560}p{color:#a0a0a0}</style></head>
<body><div class="box"><h1>Matomo is sleeping</h1>
<p>The analytics dashboard is in sleep mode to save resources.</p>
<p>Tracking data is still being collected.</p></div></body></html>';
    }
}
