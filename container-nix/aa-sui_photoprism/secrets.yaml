# Photoprism secrets - ENCRYPT WITH: sops -e -i secrets.yaml
# These env vars are read by both photoprism-app and photoprism-db containers

# Photoprism admin password
PHOTOPRISM_ADMIN_PASSWORD: CHANGE_ME_ADMIN_PASSWORD

# Database password (used by both app and db)
PHOTOPRISM_DATABASE_PASSWORD: CHANGE_ME_DB_PASSWORD
MYSQL_PASSWORD: CHANGE_ME_DB_PASSWORD
MYSQL_ROOT_PASSWORD: CHANGE_ME_ROOT_PASSWORD
