[package]
name = "rig-infra"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }

# Phase 3+: uncomment when AI ops needed
# rig-core = "0.6"

[profile.release]
opt-level = "s"
lto = false
strip = true
codegen-units = 8
