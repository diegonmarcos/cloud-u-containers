

services:
  introspect-proxy:
    build: .
    image: introspect-proxy:latest
    container_name: introspect-proxy
    restart: unless-stopped
    ports:
      - "127.0.0.1:4182:4182"
    environment:
      TZ: Europe/Madrid
      INTROSPECT_URL: https://auth.diegonmarcos.com/api/oidc/introspection
      CLIENT_ID: cli
      CLIENT_SECRET: CHANGE_ME_CLIENT_SECRET
      DEBUG: "false"
    networks:
      - proxy
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 32M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4182/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  proxy:
    external: true
