services:
  syncthing:
    image: syncthing/syncthing:latest
    container_name: syncthing
    hostname: web-server-1
    restart: always
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - /home/ubuntu/syncthing-config:/var/syncthing/config
      - /home/ubuntu/sync:/var/syncthing/data
    ports:
      - "8384:8384"
      - "22000:22000"
      - "21027:21027/udp"
    networks:
      - matomo_default
    deploy:
      resources:
        limits:
          memory: 150M
        reservations:
          memory: 50M

networks:
  matomo_default:
    external: true
