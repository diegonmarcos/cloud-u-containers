

services:
  syncthing:
    image: syncthing/syncthing:latest
    container_name: syncthing
    restart: unless-stopped
    hostname: syncthing-server
    environment:
      TZ: Europe/Madrid
      PUID: 1000
      PGID: 1000
    ports:
      - "8384:8384"
      - "22000:22000/tcp"
      - "22000:22000/udp"
      - "21027:21027/udp"
    volumes:
      - ./config:/var/syncthing/config
      - ./data:/var/syncthing/data
    networks:
      - proxy

networks:
  proxy:
    external: true
