

services:
  github-rss:
    image: rsshub/rsshub:latest
    container_name: github-rss
    restart: unless-stopped
    environment:
      TZ: Europe/Madrid
      GITHUB_ACCESS_TOKEN: CHANGE_ME_GITHUB_TOKEN
      CACHE_TYPE: memory
      CACHE_EXPIRE: 300
      REQUEST_TIMEOUT: 5000
    ports:
      - "1200:1200"
    volumes:
      - ./data:/app/data
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:1200/"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  proxy:
    external: true
