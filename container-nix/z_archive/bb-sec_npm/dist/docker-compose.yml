services:
  npm:
    image: jc21/nginx-proxy-manager:latest
    container_name: npm
    restart: always
    environment:
      DISABLE_IPV6: "true"
    ports:
      - "80:80"
      - "443:443"
      - "81:81"
    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt
    networks:
      - npm_default

networks:
  npm_default:
    name: npm_default
    driver: bridge
