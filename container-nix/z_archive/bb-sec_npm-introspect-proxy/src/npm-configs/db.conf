# ------------------------------------------------------------
# db.diegonmarcos.com - NocoDB with Bearer + Authelia auth
# CLI/API clients can use Bearer tokens
# Browser users use Authelia cookies
# ------------------------------------------------------------

map $scheme $hsts_header {
    https   "max-age=63072000; preload";
}

server {
  set $forward_scheme http;
  set $server         "144.24.196.72";
  set $port           8085;

  listen 80;
  listen 443 ssl;

  server_name db.diegonmarcos.com;

  http2 on;

  include conf.d/include/letsencrypt-acme-challenge.conf;
  include conf.d/include/ssl-cache.conf;
  include conf.d/include/ssl-ciphers.conf;
  ssl_certificate /etc/letsencrypt/live/npm-28/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/npm-28/privkey.pem;

  include conf.d/include/block-exploits.conf;
  include conf.d/include/force-ssl.conf;

  add_header Strict-Transport-Security $hsts_header always;

  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $http_connection;
  proxy_http_version 1.1;

  access_log /data/logs/proxy-host-18_access.log proxy;
  error_log /data/logs/proxy-host-18_error.log warn;

  # ═══════════════════════════════════════════════════════════════
  # AUTHENTICATION ENDPOINTS (internal)
  # ═══════════════════════════════════════════════════════════════

  # Bearer token validation
  location = /_auth/bearer {
    internal;
    proxy_pass http://introspect-proxy:4182/auth;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Authorization $http_x_bearer_token;
    proxy_set_header X-Original-URI $request_uri;
  }

  # Authelia cookie validation
  location = /_auth/authelia {
    internal;
    proxy_pass http://authelia:9091/api/authz/forward-auth;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-URI $request_uri;
    proxy_set_header X-Forwarded-Method $request_method;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Cookie $http_cookie;
  }

  # ═══════════════════════════════════════════════════════════════
  # PROTECTED LOCATION - Bearer or Authelia cookie auth
  # ═══════════════════════════════════════════════════════════════

  location / {
    set $auth_user "";
    set $auth_email "";
    set $auth_groups "";

    access_by_lua_block {
      local auth_header = ngx.var.http_authorization or ""

      if string.match(auth_header, "^Bearer ") then
        ngx.req.set_header("X-Bearer-Token", auth_header)
        local res = ngx.location.capture("/_auth/bearer", { method = ngx.HTTP_GET })

        if res.status == 200 then
          ngx.var.auth_user = res.header["X-Auth-User"] or ""
          ngx.var.auth_email = res.header["X-Auth-Email"] or ""
          return
        else
          return ngx.redirect("https://auth.diegonmarcos.com/?rd=" ..
            ngx.escape_uri(ngx.var.scheme .. "://" .. ngx.var.http_host .. ngx.var.request_uri),
            ngx.HTTP_MOVED_TEMPORARILY)
        end
      else
        local res = ngx.location.capture("/_auth/authelia", { method = ngx.HTTP_GET })

        if res.status == 200 then
          ngx.var.auth_user = res.header["Remote-User"] or ""
          ngx.var.auth_email = res.header["Remote-Email"] or ""
          ngx.var.auth_groups = res.header["Remote-Groups"] or ""
          return
        else
          return ngx.redirect("https://auth.diegonmarcos.com/?rd=" ..
            ngx.escape_uri(ngx.var.scheme .. "://" .. ngx.var.http_host .. ngx.var.request_uri),
            ngx.HTTP_MOVED_TEMPORARILY)
        end
      end
    }

    proxy_set_header Remote-User $auth_user;
    proxy_set_header Remote-Email $auth_email;
    proxy_set_header Remote-Groups $auth_groups;
    proxy_set_header X-Forwarded-User $auth_user;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_http_version 1.1;

    include conf.d/include/proxy.conf;
  }

  include /data/nginx/custom/server_proxy[.]conf;
}
