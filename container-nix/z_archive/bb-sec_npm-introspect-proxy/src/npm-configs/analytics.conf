# ------------------------------------------------------------
# analytics.diegonmarcos.com - Matomo with Bearer + Authelia auth
# Uses ngx.req.set_header before subrequest
# ------------------------------------------------------------

map $scheme $hsts_header {
    https   "max-age=63072000; preload";
}

server {
  set $forward_scheme http;
  set $server         "130.110.251.193";
  set $port           8081;

  listen 80;
  listen 443 ssl;

  server_name analytics.diegonmarcos.com;

  http2 on;

  include conf.d/include/letsencrypt-acme-challenge.conf;
  include conf.d/include/ssl-ciphers.conf;
  ssl_certificate /etc/letsencrypt/live/npm-16/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/npm-16/privkey.pem;

  include conf.d/include/force-ssl.conf;

  add_header Strict-Transport-Security $hsts_header always;

  proxy_connect_timeout 300;
  proxy_send_timeout 300;
  proxy_read_timeout 300;

  access_log /data/logs/proxy-host-3_access.log proxy;
  error_log /data/logs/proxy-host-3_error.log warn;

  # ═══════════════════════════════════════════════════════════════
  # PUBLIC TRACKING ENDPOINTS (no auth required)
  # ═══════════════════════════════════════════════════════════════

  location = /matomo.js {
    proxy_pass http://129.151.228.66:8080/matomo.js;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  location = /matomo.php {
    proxy_pass http://129.151.228.66:8080/matomo.php;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  location = /piwik.js {
    proxy_pass http://129.151.228.66:8080/piwik.js;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  location = /piwik.php {
    proxy_pass http://129.151.228.66:8080/piwik.php;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  location /js/ {
    proxy_pass http://129.151.228.66:8080/js/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  # Anti-blocker tracking endpoints (no auth required)
  location = /collect.php {
    proxy_pass http://129.151.228.66:8080/collect.php;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  location = /api.php {
    proxy_pass http://129.151.228.66:8080/api.php;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  location = /track.php {
    proxy_pass http://129.151.228.66:8080/track.php;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  # ═══════════════════════════════════════════════════════════════
  # AUTHENTICATION ENDPOINTS (internal)
  # ═══════════════════════════════════════════════════════════════

  # Bearer token validation - uses X-Bearer-Token header set by Lua
  location = /_auth/bearer {
    internal;
    proxy_pass http://introspect-proxy:4182/auth;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    # Get Authorization from custom header set by Lua
    proxy_set_header Authorization $http_x_bearer_token;
    proxy_set_header X-Original-URI $request_uri;
  }

  # Authelia cookie validation
  location = /_auth/authelia {
    internal;
    proxy_pass http://authelia:9091/api/authz/forward-auth;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-URI $request_uri;
    proxy_set_header X-Forwarded-Method $request_method;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Cookie $http_cookie;
  }

  # ═══════════════════════════════════════════════════════════════
  # PROTECTED LOCATION - Lua conditional auth
  # ═══════════════════════════════════════════════════════════════

  location / {
    set $auth_user "";
    set $auth_email "";
    set $auth_groups "";

    access_by_lua_block {
      local auth_header = ngx.var.http_authorization or ""

      -- Check if Bearer token is present
      if string.match(auth_header, "^Bearer ") then
        -- Set custom header with the token for the subrequest
        ngx.req.set_header("X-Bearer-Token", auth_header)

        -- Validate via introspect-proxy
        local res = ngx.location.capture("/_auth/bearer", {
          method = ngx.HTTP_GET
        })

        ngx.log(ngx.INFO, "Bearer subrequest status: ", res.status)

        if res.status == 200 then
          -- Token valid - set user headers
          ngx.var.auth_user = res.header["X-Auth-User"] or ""
          ngx.var.auth_email = res.header["X-Auth-Email"] or ""
          ngx.log(ngx.INFO, "Bearer auth OK for user: ", ngx.var.auth_user)
          return -- Allow request to proceed
        else
          -- Token invalid
          ngx.log(ngx.WARN, "Bearer token invalid, status: ", res.status, " body: ", res.body)
          local redirect_url = "https://auth.diegonmarcos.com/?rd=" ..
            ngx.escape_uri(ngx.var.scheme .. "://" .. ngx.var.http_host .. ngx.var.request_uri)
          return ngx.redirect(redirect_url, ngx.HTTP_MOVED_TEMPORARILY)
        end
      else
        -- No Bearer token - validate via Authelia cookie
        local res = ngx.location.capture("/_auth/authelia", {
          method = ngx.HTTP_GET
        })

        if res.status == 200 then
          -- Cookie valid
          ngx.var.auth_user = res.header["Remote-User"] or ""
          ngx.var.auth_email = res.header["Remote-Email"] or ""
          ngx.var.auth_groups = res.header["Remote-Groups"] or ""
          return
        else
          local redirect_url = "https://auth.diegonmarcos.com/?rd=" ..
            ngx.escape_uri(ngx.var.scheme .. "://" .. ngx.var.http_host .. ngx.var.request_uri)
          return ngx.redirect(redirect_url, ngx.HTTP_MOVED_TEMPORARILY)
        end
      end
    }

    proxy_set_header Remote-User $auth_user;
    proxy_set_header Remote-Email $auth_email;
    proxy_set_header Remote-Groups $auth_groups;
    proxy_set_header X-Forwarded-User $auth_user;

    proxy_pass http://129.151.228.66:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;
    proxy_set_header Cookie $http_cookie;
  }
}
