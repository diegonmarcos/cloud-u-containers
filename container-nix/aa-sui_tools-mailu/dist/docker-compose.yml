

services:
  # Reverse proxy and HTTPS termination
  front:
    image: ghcr.io/mailu/nginx:2024.06
    container_name: mailu-front
    restart: unless-stopped
    env_file: mailu.env
    logging:
      driver: journald
      options:
        tag: mailu-front
    ports:
      - "80:80"
      - "443:443"
      - "25:25"
      - "465:465"
      - "993:993"
    volumes:
      - ./certs:/certs
      - ./overrides/nginx:/overrides:ro
    networks:
      - default
      - proxy

  # Admin interface
  admin:
    image: ghcr.io/mailu/admin:2024.06
    container_name: mailu-admin
    restart: unless-stopped
    env_file: mailu.env
    logging:
      driver: journald
      options:
        tag: mailu-admin
    volumes:
      - ./data:/data
      - ./dkim:/dkim
    depends_on:
      - redis
    networks:
      - default

  # IMAP server
  imap:
    image: ghcr.io/mailu/dovecot:2024.06
    container_name: mailu-imap
    restart: unless-stopped
    env_file: mailu.env
    logging:
      driver: journald
      options:
        tag: mailu-imap
    volumes:
      - ./mail:/mail
      - ./overrides/dovecot:/overrides:ro
    depends_on:
      - front
    networks:
      - default

  # SMTP server
  smtp:
    image: ghcr.io/mailu/postfix:2024.06
    container_name: mailu-smtp
    restart: unless-stopped
    env_file: mailu.env
    logging:
      driver: journald
      options:
        tag: mailu-smtp
    volumes:
      - ./mailqueue:/queue
      - ./overrides/postfix:/overrides:ro
    depends_on:
      - front
    networks:
      - default

  # Antispam
  antispam:
    image: ghcr.io/mailu/rspamd:2024.06
    container_name: mailu-antispam
    restart: unless-stopped
    env_file: mailu.env
    logging:
      driver: journald
      options:
        tag: mailu-antispam
    volumes:
      - ./filter:/var/lib/rspamd
      - ./overrides/rspamd:/overrides:ro
    depends_on:
      - front
    networks:
      - default

  # Webmail (Roundcube)
  webmail:
    image: ghcr.io/mailu/webmail:2024.06
    container_name: mailu-webmail
    restart: unless-stopped
    env_file: mailu.env
    logging:
      driver: journald
      options:
        tag: mailu-webmail
    volumes:
      - ./webmail:/data
      - ./overrides/roundcube:/overrides:ro
    depends_on:
      - front
    networks:
      - default

  # Redis for session storage
  redis:
    image: redis:7-bookworm
    container_name: mailu-redis
    restart: unless-stopped
    volumes:
      - ./redis:/data
    networks:
      - default

  # DNS resolver
  resolver:
    image: ghcr.io/mailu/unbound:2024.06
    container_name: mailu-resolver
    restart: unless-stopped
    env_file: mailu.env
    networks:
      default:
        ipv4_address: 192.168.203.254

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.203.0/24
  proxy:
    external: true
