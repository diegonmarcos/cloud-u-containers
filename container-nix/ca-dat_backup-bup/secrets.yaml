# Bup backup secrets - ENCRYPT WITH: sops -e -i secrets.yaml

# MySQL/MariaDB credentials (if backing up MySQL databases)
MYSQL_HOST: localhost
MYSQL_USER: backup
MYSQL_PASSWORD: CHANGE_ME_MYSQL_PASSWORD
MYSQL_DBS: "matomo photoprism"

# PostgreSQL credentials (if backing up PostgreSQL databases)
PGHOST: localhost
PGUSER: backup
PGPASSWORD: CHANGE_ME_PG_PASSWORD
POSTGRES_DBS: "affine nocodb"

# SQLite database paths (space-separated)
SQLITE_DBS: "/opt/containers/authelia/config/db.sqlite3 /opt/containers/vaultwarden/data/db.sqlite3"
