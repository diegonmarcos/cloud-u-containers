services:
  redis:
    image: redis:alpine
    container_name: redis
    restart: unless-stopped
    env_file:
      - .secrets
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD}
    volumes:
      - /data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - dev_network

networks:
  dev_network:
    external: true
