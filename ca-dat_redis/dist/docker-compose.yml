services:
  redis:
    image: ghcr.io/diegonmarcos/redis:latest
    build:
      context: .
      dockerfile_inline: |
        FROM redis:alpine
        COPY docker-compose.yml /opt/cloud-docs/docker-compose.yml
        LABEL org.opencontainers.image.source="https://github.com/diegonmarcos/cloud"
        LABEL org.opencontainers.image.description="redis"
        LABEL org.opencontainers.image.title="redis"
        LABEL cloud.diegonmarcos.from-image="redis:alpine"
        LABEL cloud.diegonmarcos.registry="ghcr.io/diegonmarcos"
    container_name: redis
    restart: "no"  # container-init handles startup
    network_mode: host
    env_file:
      - .secrets
    command: ["sh", "-c", "redis-server --appendonly yes --port 6379 --bind 10.0.0.1 127.0.0.1 --maxmemory 128mb --maxmemory-policy allkeys-lru --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - /data/redis:/data
    deploy:
      resources:
        limits:
          memory: 48M
        reservations:
          memory: 16M
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

