# LGTM Stack - Grafana Labs Observability
# Deployed on: oci-A1-f_0 (Oracle Flex — consolidated)
services:
  grafana:
    image: ghcr.io/diegonmarcos/lgtm-grafana:latest
    build:
      context: .
      dockerfile_inline: |
        FROM grafana/grafana:latest
        COPY docker-compose.yml /opt/cloud-docs/docker-compose.yml
        LABEL org.opencontainers.image.source="https://github.com/diegonmarcos/cloud"
        LABEL org.opencontainers.image.description="lgtm-grafana"
        LABEL org.opencontainers.image.title="lgtm-grafana"
        LABEL cloud.diegonmarcos.from-image="grafana/grafana:latest"
        LABEL cloud.diegonmarcos.registry="ghcr.io/diegonmarcos"
    container_name: lgtm_grafana
    restart: "no"  # container-init handles startup
    network_mode: host
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-changeme}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_HTTP_PORT=3200
      - GF_SERVER_ROOT_URL=https://grafana.diegonmarcos.com
    depends_on:
      - loki
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:3200/api/health']
      interval: 30s
      timeout: 10s
      retries: 3

  loki:
    image: ghcr.io/diegonmarcos/lgtm-loki:latest
    build:
      context: .
      dockerfile_inline: |
        FROM grafana/loki:latest
        COPY docker-compose.yml /opt/cloud-docs/docker-compose.yml
        LABEL org.opencontainers.image.source="https://github.com/diegonmarcos/cloud"
        LABEL org.opencontainers.image.description="lgtm-loki"
        LABEL org.opencontainers.image.title="lgtm-loki"
        LABEL cloud.diegonmarcos.from-image="grafana/loki:latest"
        LABEL cloud.diegonmarcos.registry="ghcr.io/diegonmarcos"
    container_name: lgtm_loki
    restart: "no"  # container-init handles startup
    network_mode: host
    volumes:
      - loki_data:/loki
      - /home/ubuntu/bin/busybox-static:/usr/local/bin/busybox:ro
    command: -config.file=/etc/loki/local-config.yaml -server.http-listen-address=0.0.0.0 -server.http-listen-port=3110 -server.grpc-listen-port=9111
    healthcheck:
      test: ['CMD', '/usr/local/bin/busybox', 'wget', '-qO', '/dev/null', 'http://127.0.0.1:3110/ready']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  tempo:
    image: ghcr.io/diegonmarcos/lgtm-tempo:latest
    build:
      context: .
      dockerfile_inline: |
        FROM grafana/tempo:2.7.2
        COPY config/tempo.yaml /etc/tempo/tempo.yaml
        COPY docker-compose.yml /opt/cloud-docs/docker-compose.yml
        LABEL org.opencontainers.image.source="https://github.com/diegonmarcos/cloud"
        LABEL org.opencontainers.image.description="lgtm-tempo"
        LABEL org.opencontainers.image.title="lgtm-tempo"
        LABEL cloud.diegonmarcos.from-image="grafana/tempo:2.7.2"
        LABEL cloud.diegonmarcos.registry="ghcr.io/diegonmarcos"
    container_name: lgtm_tempo
    restart: "no"  # container-init handles startup
    network_mode: host
    volumes:
      - tempo_data:/var/tempo
    command: ["-config.file=/etc/tempo/tempo.yaml"]

  mimir:
    image: ghcr.io/diegonmarcos/lgtm-mimir:latest
    build:
      context: .
      dockerfile_inline: |
        FROM grafana/mimir:latest
        COPY config/mimir.yaml /etc/mimir/mimir.yaml
        COPY docker-compose.yml /opt/cloud-docs/docker-compose.yml
        LABEL org.opencontainers.image.source="https://github.com/diegonmarcos/cloud"
        LABEL org.opencontainers.image.description="lgtm-mimir"
        LABEL org.opencontainers.image.title="lgtm-mimir"
        LABEL cloud.diegonmarcos.from-image="grafana/mimir:latest"
        LABEL cloud.diegonmarcos.registry="ghcr.io/diegonmarcos"
    container_name: lgtm_mimir
    restart: "no"  # container-init handles startup
    network_mode: host
    volumes:
      - mimir_data:/data
    command: ["-config.file=/etc/mimir/mimir.yaml", "-target=all"]

volumes:
  grafana_data:
  loki_data:
  tempo_data:
  mimir_data:
