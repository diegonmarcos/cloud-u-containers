services:
  c3-services-mcp:
    image: ghcr.io/diegonmarcos/c3-services-mcp:latest
    container_name: c3-services-mcp
    restart: no
    stop_grace_period: 30s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    dns:
      - 10.0.0.1
      - 1.1.1.1
    env_file:
      - .secrets
    environment:
      - NODE_ENV=production
      - MCP_HTTP_PORT=3101
    ports:
      - "10.0.0.6:3101:3101"
    healthcheck:
      test: ["CMD-SHELL", "curl -so /dev/null -w '%{http_code}' http://localhost:3101/mcp | grep -qE '^[2-4]' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
          pids: 256
        reservations:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
