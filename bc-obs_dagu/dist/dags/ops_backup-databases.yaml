# Data-driven database backup — reads all targets from cloud-data-backup-targets.json
# Adding a new database: update the service's build.json containers section with db_user/db_name/db_path/dump_cmd
# then regenerate cloud-data. This DAG picks it up automatically via sync_cloud-data.yaml (every 5 min).
schedule: "0 3 * * *"
env:
  - NTFY_URL: http://10.0.0.6:8090
  - AUTHELIA_BEARER_TOKEN: ${AUTHELIA_BEARER_TOKEN}
  - AWS_ACCESS_KEY_ID: "<REDACTED-LEAK-2026-04-21>"
  - AWS_SECRET_ACCESS_KEY: ${OCI_S3_SECRET_KEY}
  - RESTIC_REPOSITORY: "s3:https://axpmn3qtq4ig.compat.objectstorage.eu-marseille-1.oraclecloud.com/cloud-backups-db"
  - RESTIC_PASSWORD: ${RESTIC_PASSWORD}
  - BACKUP_JSON: /var/lib/dagu/data/cloud-data/cloud-data-backup-targets.json
  - SSH_OPTS: "-i /home/dagu/.ssh/vault_id_rsa -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o ServerAliveInterval=10 -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR"
mailOn:
  failure: true
  success: false
type: graph
steps:
  # ── Phase 1: Dump databases on each VM (parallel) ──────────────────
  - name: dump-oci-apps
    command: |
      VM="oci-apps"
      IP=$(jq -r ".by_vm.\"$VM\".wg_ip" "$BACKUP_JSON")
      USER=$(jq -r ".by_vm.\"$VM\".user" "$BACKUP_JSON")
      DB_COUNT=$(jq ".by_vm.\"$VM\".databases | length" "$BACKUP_JSON")
      [ "$DB_COUNT" = "0" ] || [ "$IP" = "null" ] && echo "No databases for $VM" && exit 0
      echo "[$VM] Dumping $DB_COUNT databases on $USER@$IP"
      STAMP=$(date +%Y%m%d)

      DUMP_SCRIPT=$(jq -r --arg s "$STAMP" '.by_vm."'"$VM"'".databases[] |
        if .type == "postgres" then
          "if docker ps --format {{.Names}} | grep -qx \(.container); then docker exec \(.container) pg_dump -U \(.user) -d \(.db) 2>/dev/null | gzip > \(.container)-\($s).sql.gz && echo OK_\(.container) || echo FAIL_\(.container); else echo SKIP_\(.container); fi"
        elif .type == "mariadb" then
          "if docker ps --format {{.Names}} | grep -qx \(.container); then docker exec \(.container) mariadb-dump -u \(.user) \(.db) 2>/dev/null | gzip > \(.container)-\($s).sql.gz && echo OK_\(.container) || echo FAIL_\(.container); else echo SKIP_\(.container); fi"
        elif .type == "sqlite" then
          "if docker ps --format {{.Names}} | grep -qx \(.container); then docker exec \(.container) sqlite3 \(.path) \".backup /tmp/backup-dump.db\" 2>/dev/null && docker cp \(.container):/tmp/backup-dump.db /var/backups/databases/\(.container)-\($s).sqlite && gzip -f /var/backups/databases/\(.container)-\($s).sqlite && echo OK_\(.container) || echo FAIL_\(.container); else echo SKIP_\(.container); fi"
        elif .type == "custom" then
          "if docker ps --format {{.Names}} | grep -qx \(.container); then docker exec \(.container) \(.dump_cmd) 2>/dev/null | gzip > \(.container)-\($s).dump.gz && echo OK_\(.container) || echo FAIL_\(.container); else echo SKIP_\(.container); fi"
        else "echo UNKNOWN_TYPE_\(.type)_\(.container)" end
      ' "$BACKUP_JSON")

      ssh $SSH_OPTS "$USER@$IP" bash <<REMOTE
        mkdir -p /var/backups/databases && cd /var/backups/databases
        $DUMP_SCRIPT
        echo ""; ls -lh /var/backups/databases/*${STAMP}* 2>/dev/null | wc -l | xargs -I{} echo "Total: {} dumps on $VM"
      REMOTE

  - name: dump-gcp-proxy
    command: |
      VM="gcp-proxy"
      IP=$(jq -r ".by_vm.\"$VM\".wg_ip" "$BACKUP_JSON")
      USER=$(jq -r ".by_vm.\"$VM\".user" "$BACKUP_JSON")
      DB_COUNT=$(jq ".by_vm.\"$VM\".databases | length" "$BACKUP_JSON")
      [ "$DB_COUNT" = "0" ] || [ "$IP" = "null" ] && echo "No databases for $VM" && exit 0
      echo "[$VM] Dumping $DB_COUNT databases on $USER@$IP"
      STAMP=$(date +%Y%m%d)

      DUMP_SCRIPT=$(jq -r --arg s "$STAMP" '.by_vm."'"$VM"'".databases[] |
        if .type == "postgres" then
          "if docker ps --format {{.Names}} | grep -qx \(.container); then docker exec \(.container) pg_dump -U \(.user) -d \(.db) 2>/dev/null | gzip > \(.container)-\($s).sql.gz && echo OK_\(.container) || echo FAIL_\(.container); else echo SKIP_\(.container); fi"
        elif .type == "mariadb" then
          "if docker ps --format {{.Names}} | grep -qx \(.container); then docker exec \(.container) mariadb-dump -u \(.user) \(.db) 2>/dev/null | gzip > \(.container)-\($s).sql.gz && echo OK_\(.container) || echo FAIL_\(.container); else echo SKIP_\(.container); fi"
        elif .type == "sqlite" then
          "if docker ps --format {{.Names}} | grep -qx \(.container); then docker exec \(.container) sqlite3 \(.path) \".backup /tmp/backup-dump.db\" 2>/dev/null && docker cp \(.container):/tmp/backup-dump.db /var/backups/databases/\(.container)-\($s).sqlite && gzip -f /var/backups/databases/\(.container)-\($s).sqlite && echo OK_\(.container) || echo FAIL_\(.container); else echo SKIP_\(.container); fi"
        elif .type == "custom" then
          "if docker ps --format {{.Names}} | grep -qx \(.container); then docker exec \(.container) \(.dump_cmd) 2>/dev/null | gzip > \(.container)-\($s).dump.gz && echo OK_\(.container) || echo FAIL_\(.container); else echo SKIP_\(.container); fi"
        else "echo UNKNOWN_TYPE_\(.type)_\(.container)" end
      ' "$BACKUP_JSON")

      ssh $SSH_OPTS "$USER@$IP" bash <<REMOTE
        sudo mkdir -p /var/backups/databases && cd /var/backups/databases
        $DUMP_SCRIPT
        echo ""; ls -lh /var/backups/databases/*${STAMP}* 2>/dev/null | wc -l | xargs -I{} echo "Total: {} dumps on $VM"
      REMOTE

  - name: dump-oci-mail
    command: |
      VM="oci-mail"
      IP=$(jq -r ".by_vm.\"$VM\".wg_ip" "$BACKUP_JSON")
      USER=$(jq -r ".by_vm.\"$VM\".user" "$BACKUP_JSON")
      DB_COUNT=$(jq ".by_vm.\"$VM\".databases | length" "$BACKUP_JSON")
      [ "$DB_COUNT" = "0" ] || [ "$IP" = "null" ] && echo "No databases for $VM" && exit 0
      echo "[$VM] Dumping $DB_COUNT databases on $USER@$IP"
      STAMP=$(date +%Y%m%d)

      DUMP_SCRIPT=$(jq -r --arg s "$STAMP" '.by_vm."'"$VM"'".databases[] |
        if .type == "postgres" then
          "if docker ps --format {{.Names}} | grep -qx \(.container); then docker exec \(.container) pg_dump -U \(.user) -d \(.db) 2>/dev/null | gzip > \(.container)-\($s).sql.gz && echo OK_\(.container) || echo FAIL_\(.container); else echo SKIP_\(.container); fi"
        elif .type == "mariadb" then
          "if docker ps --format {{.Names}} | grep -qx \(.container); then docker exec \(.container) mariadb-dump -u \(.user) \(.db) 2>/dev/null | gzip > \(.container)-\($s).sql.gz && echo OK_\(.container) || echo FAIL_\(.container); else echo SKIP_\(.container); fi"
        elif .type == "sqlite" then
          "if docker ps --format {{.Names}} | grep -qx \(.container); then docker exec \(.container) sqlite3 \(.path) \".backup /tmp/backup-dump.db\" 2>/dev/null && docker cp \(.container):/tmp/backup-dump.db /var/backups/databases/\(.container)-\($s).sqlite && gzip -f /var/backups/databases/\(.container)-\($s).sqlite && echo OK_\(.container) || echo FAIL_\(.container); else echo SKIP_\(.container); fi"
        elif .type == "custom" then
          "if docker ps --format {{.Names}} | grep -qx \(.container); then docker exec \(.container) \(.dump_cmd) 2>/dev/null | gzip > \(.container)-\($s).dump.gz && echo OK_\(.container) || echo FAIL_\(.container); else echo SKIP_\(.container); fi"
        else "echo UNKNOWN_TYPE_\(.type)_\(.container)" end
      ' "$BACKUP_JSON")

      ssh $SSH_OPTS "$USER@$IP" bash <<REMOTE
        mkdir -p /var/backups/databases && cd /var/backups/databases
        $DUMP_SCRIPT
        echo ""; ls -lh /var/backups/databases/*${STAMP}* 2>/dev/null | wc -l | xargs -I{} echo "Total: {} dumps on $VM"
      REMOTE

  - name: dump-oci-analytics
    command: |
      VM="oci-analytics"
      IP=$(jq -r ".by_vm.\"$VM\".wg_ip" "$BACKUP_JSON")
      USER=$(jq -r ".by_vm.\"$VM\".user" "$BACKUP_JSON")
      DB_COUNT=$(jq ".by_vm.\"$VM\".databases | length" "$BACKUP_JSON")
      [ "$DB_COUNT" = "0" ] || [ "$IP" = "null" ] && echo "No databases for $VM" && exit 0
      echo "[$VM] Dumping $DB_COUNT databases on $USER@$IP"
      STAMP=$(date +%Y%m%d)

      DUMP_SCRIPT=$(jq -r --arg s "$STAMP" '.by_vm."'"$VM"'".databases[] |
        if .type == "postgres" then
          "if docker ps --format {{.Names}} | grep -qx \(.container); then docker exec \(.container) pg_dump -U \(.user) -d \(.db) 2>/dev/null | gzip > \(.container)-\($s).sql.gz && echo OK_\(.container) || echo FAIL_\(.container); else echo SKIP_\(.container); fi"
        elif .type == "mariadb" then
          "if docker ps --format {{.Names}} | grep -qx \(.container); then docker exec \(.container) mariadb-dump -u \(.user) \(.db) 2>/dev/null | gzip > \(.container)-\($s).sql.gz && echo OK_\(.container) || echo FAIL_\(.container); else echo SKIP_\(.container); fi"
        elif .type == "sqlite" then
          "if docker ps --format {{.Names}} | grep -qx \(.container); then docker exec \(.container) sqlite3 \(.path) \".backup /tmp/backup-dump.db\" 2>/dev/null && docker cp \(.container):/tmp/backup-dump.db /var/backups/databases/\(.container)-\($s).sqlite && gzip -f /var/backups/databases/\(.container)-\($s).sqlite && echo OK_\(.container) || echo FAIL_\(.container); else echo SKIP_\(.container); fi"
        elif .type == "custom" then
          "if docker ps --format {{.Names}} | grep -qx \(.container); then docker exec \(.container) \(.dump_cmd) 2>/dev/null | gzip > \(.container)-\($s).dump.gz && echo OK_\(.container) || echo FAIL_\(.container); else echo SKIP_\(.container); fi"
        else "echo UNKNOWN_TYPE_\(.type)_\(.container)" end
      ' "$BACKUP_JSON")

      ssh $SSH_OPTS "$USER@$IP" bash <<REMOTE
        mkdir -p /var/backups/databases && cd /var/backups/databases
        $DUMP_SCRIPT
        echo ""; ls -lh /var/backups/databases/*${STAMP}* 2>/dev/null | wc -l | xargs -I{} echo "Total: {} dumps on $VM"
      REMOTE

  # ── Phase 2: Collect dumps to oci-apps + restic to OCI S3 ─────────
  - name: collect-and-upload
    depends:
      - dump-oci-apps
      - dump-gcp-proxy
      - dump-oci-mail
      - dump-oci-analytics
    command: |
      STAMP=$(date +%Y%m%d)
      COLLECT_IP=$(jq -r '.by_vm."oci-apps".wg_ip' "$BACKUP_JSON")
      COLLECT_USER=$(jq -r '.by_vm."oci-apps".user' "$BACKUP_JSON")

      # Copy local oci-apps dumps to collected/
      ssh $SSH_OPTS "$COLLECT_USER@$COLLECT_IP" bash <<REMOTE
        mkdir -p /var/backups/collected
        cp /var/backups/databases/*${STAMP}* /var/backups/collected/ 2>/dev/null || true
      REMOTE

      # Pull from each remote VM
      for vm in $(jq -r '.by_vm | keys[] | select(. != "oci-apps")' "$BACKUP_JSON"); do
        VM_IP=$(jq -r ".by_vm.\"$vm\".wg_ip" "$BACKUP_JSON")
        VM_USER=$(jq -r ".by_vm.\"$vm\".user" "$BACKUP_JSON")
        ssh $SSH_OPTS "$COLLECT_USER@$COLLECT_IP" bash -c "
          rsync -az -e 'ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR' \
            --ignore-missing-args '$VM_USER@$VM_IP:/var/backups/databases/*${STAMP}*' /var/backups/collected/ 2>/dev/null && \
            echo 'Pulled from $vm' || echo 'No dumps from $vm'
        "
      done

      echo "Collected:"
      ssh $SSH_OPTS "$COLLECT_USER@$COLLECT_IP" "ls -lh /var/backups/collected/*${STAMP}* 2>/dev/null"

      # Restic backup to OCI Object Storage
      ssh $SSH_OPTS "$COLLECT_USER@$COLLECT_IP" bash <<REMOTE
        export AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID"
        export AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY"
        export RESTIC_REPOSITORY="$RESTIC_REPOSITORY"
        export RESTIC_PASSWORD="$RESTIC_PASSWORD"

        command -v restic >/dev/null 2>&1 || { echo "Installing restic..."; sudo apt-get install -y restic >/dev/null 2>&1 || sudo snap install restic 2>/dev/null; }

        restic init 2>/dev/null || true
        restic backup /var/backups/collected/ --tag "databases" --tag "${STAMP}" --verbose && \
          echo "restic upload OK" || echo "restic upload FAILED"

        restic forget --keep-daily 7 --keep-weekly 4 --keep-monthly 6 --prune 2>/dev/null

        # Clean local dumps older than 3 days
        find /var/backups/databases -name "*.gz" -mtime +3 -delete 2>/dev/null
        find /var/backups/collected -name "*.gz" -mtime +3 -delete 2>/dev/null
      REMOTE

  # ── Phase 3: Notify ────────────────────────────────────────────────
  - name: notify
    depends:
      - collect-and-upload
    command: |
      COLLECT_IP=$(jq -r '.by_vm."oci-apps".wg_ip' "$BACKUP_JSON")
      COLLECT_USER=$(jq -r '.by_vm."oci-apps".user' "$BACKUP_JSON")
      COUNT=$(ssh $SSH_OPTS "$COLLECT_USER@$COLLECT_IP" "ls /var/backups/collected/*$(date +%Y%m%d)* 2>/dev/null | wc -l")
      SIZE=$(ssh $SSH_OPTS "$COLLECT_USER@$COLLECT_IP" "du -sh /var/backups/collected/ 2>/dev/null | awk '{print \$1}'" || echo "N/A")
      MSG="DB backup → OCI S3: $COUNT dumps ($SIZE)\nBucket: cloud-backups-db\nDagu: http://10.0.0.3:8070"
      curl -s -X POST "$NTFY_URL/ops_backups" \
        -H "Authorization: Bearer $AUTHELIA_BEARER_TOKEN" \
        -H "Title: Daily DB Backup OK ($COUNT dumps)" \
        -H "Priority: 2" \
        -H "Tags: floppy_disk,white_check_mark" \
        -d "$(echo -e "$MSG")"
