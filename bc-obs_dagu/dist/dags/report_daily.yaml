schedule: "0 7 * * *"
type: graph
env:
  - NTFY_URL: http://10.0.0.6:8090
  - AUTHELIA_BEARER_TOKEN: ${AUTHELIA_BEARER_TOKEN}
  - NOREPLY_PASSWORD: ${NOREPLY_PASSWORD}
  - GITHUB_TOKEN: ${GITHUB_TOKEN}
  - REPORT_DIR: /var/lib/dagu/data/cloud-data/reports/cloud-health-daily-mail
mail_on:
  failure: true
  success: false
steps:
  - name: generate-html
    command: >-
      docker run --rm --network host
      -v /opt/ssh-keys/dagu:/home/dagu/.ssh:ro
      -v dagu_data:/var/lib/dagu/data
      -w /var/lib/dagu/data/cloud-data/reports/cloud-health-daily-mail
      ghcr.io/diegonmarcos/cloud-data-reports:latest
      sh -c "cloud-health-daily-mail"
  - name: send-email
    command: sh $REPORT_DIR/build.sh send
    depends:
      - generate-html
