shell: /bin/bash

smtp:
  host: 10.0.0.3
  port: "587"
  username: "no-reply@diegonmarcos.com"
  password: "$NOREPLY_PASSWORD"

mailOn:
  failure: false
  success: false

errorMail:
  from: no-reply@diegonmarcos.com
  to:
    - me@diegonmarcos.com
  prefix: "[Dagu FAIL]"
  attachLogs: true

infoMail:
  from: no-reply@diegonmarcos.com
  to:
    - me@diegonmarcos.com
  prefix: "[Dagu OK]"
