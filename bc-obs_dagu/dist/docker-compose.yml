services:
  dagu:
    image: ghcr.io/dagu-org/dagu:1.30.3
    container_name: dagu
    restart: unless-stopped
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        apt-get update -qq && apt-get install -y -qq curl openssh-client dnsutils > /dev/null 2>&1
        if [ -f /mnt/ssh/id_rsa ]; then
          mkdir -p /root/.ssh-internal
          cp /mnt/ssh/* /root/.ssh-internal/
          chmod 700 /root/.ssh-internal
          chmod 600 /root/.ssh-internal/id_rsa
          chmod 644 /root/.ssh-internal/*.pub 2>/dev/null || true
        fi
        dagu start-all
    ports:
      - "10.0.0.3:8070:8080"
    environment:
      - DAGU_HOST=0.0.0.0
      - DAGU_PORT=8080
      - DAGU_DAGS_DIR=/var/lib/dagu/dags
      - DAGU_BASE_CONFIG=/var/lib/dagu/base.yaml
      - DAGU_AUTH_MODE=basic
      - DAGU_AUTH_BASIC_USERNAME=${DAGU_USERNAME}
      - DAGU_AUTH_BASIC_PASSWORD=${DAGU_PASSWORD}
      - DAGU_TZ=Europe/Berlin
      - BEARER_TOKEN=${BEARER_TOKEN}
    volumes:
      - dagu-data:/var/lib/dagu
      - ./dags:/var/lib/dagu/dags
      - ./base.yaml:/var/lib/dagu/base.yaml:ro
      - /home/ubuntu/.ssh:/mnt/ssh:ro
    mem_limit: 128m
    networks:
      - default
      - mailu_default

volumes:
  dagu-data:
    driver: local

networks:
  mailu_default:
    external: true
