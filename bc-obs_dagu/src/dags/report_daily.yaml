schedule: "0 7 * * *"
type: graph
env:
  - NTFY_URL: http://10.0.0.6:8090
  - AUTHELIA_BEARER_TOKEN: ${AUTHELIA_BEARER_TOKEN}
  - NOREPLY_PASSWORD: ${NOREPLY_PASSWORD}
  - GITHUB_TOKEN: ${GITHUB_TOKEN}
  - UMAMI_USERNAME: ${UMAMI_USERNAME}
  - UMAMI_PASSWORD: ${UMAMI_PASSWORD}
  - UMAMI_URL: http://10.0.0.6:3006
mail_on:
  failure: true
  success: false
steps:
  # Single step: build + send via the master crate's `ship` target.
  # Entrypoint case `bash|sh)` runs SSH/SOPS setup then exec's the script,
  # so SSH config from /opt/ssh-keys/dagu reaches the cloud-data binaries.
  # The crate's build.sh ship = engine_build + engine_run + send_html (SMTP
  # 10.0.0.3:587). HTML stays inside the image fs; send happens before exit.
  #
  # When the cloud-data-reports image is rebuilt with the `daily-mail`
  # entrypoint target (already in src/), this command can shorten to just
  # `cloud-data-reports:latest daily-mail`.
  - name: daily-mail
    command: >-
      docker run --rm --network host
      --pull always
      -v /opt/ssh-keys/dagu:/root/.ssh
      -v dagu_dagu_data:/var/lib/dagu/data
      -w /var/lib/dagu/data/cloud-data/reports
      -e NOREPLY_PASSWORD=$NOREPLY_PASSWORD
      -e GITHUB_TOKEN=$GITHUB_TOKEN
      -e UMAMI_USERNAME=$UMAMI_USERNAME
      -e UMAMI_PASSWORD=$UMAMI_PASSWORD
      -e UMAMI_URL=$UMAMI_URL
      ghcr.io/diegonmarcos/cloud-data-reports:latest
      bash src/cloud-health-full-daily/build.sh ship
