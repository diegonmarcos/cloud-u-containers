schedule: "0 7 * * *"
type: graph
env:
  - NTFY_URL: http://10.0.0.6:8090
  - AUTHELIA_BEARER_TOKEN: ${AUTHELIA_BEARER_TOKEN}
  - NOREPLY_PASSWORD: ${NOREPLY_PASSWORD}
  - GITHUB_TOKEN: ${GITHUB_TOKEN}
  - UMAMI_USERNAME: ${UMAMI_USERNAME}
  - UMAMI_PASSWORD: ${UMAMI_PASSWORD}
  - UMAMI_URL: http://10.0.0.6:3006
  - REPORT_DIR: /var/lib/dagu/data/cloud-data/reports/cloud-health-daily-mail
mail_on:
  failure: true
  success: false
steps:
  - name: generate-html
    command: >-
      docker run --rm --network host
      -v /opt/ssh-keys/dagu:/root/.ssh
      -v dagu_data:/var/lib/dagu/data
      -e GITHUB_TOKEN=$GITHUB_TOKEN
      -e UMAMI_USERNAME=$UMAMI_USERNAME
      -e UMAMI_PASSWORD=$UMAMI_PASSWORD
      -e UMAMI_URL=$UMAMI_URL
      -w /var/lib/dagu/data/cloud-data/reports/cloud-health-daily-mail
      --entrypoint cloud-health-daily-mail
      ghcr.io/diegonmarcos/cloud-data-reports:latest
  - name: send-email
    command: sh $REPORT_DIR/build.sh send
    depends:
      - generate-html
