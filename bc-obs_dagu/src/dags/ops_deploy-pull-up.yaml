schedule: ""
description: "Manual: Pull + Up all Docker containers on VMs using manifest"
env:
  - SSH_KEY: /root/.ssh/vault_id_rsa
  - SSH_OPTS: -i /root/.ssh/vault_id_rsa -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -o ConnectTimeout=10
  - NTFY_URL: http://10.0.0.6:8090
mailOn:
  failure: true
  success: false
steps:
  - name: gcp-proxy
    command: |
      VM=gcp-proxy; IP=10.0.0.1; USER=diego
      MANIFEST="/opt/scripts/containers-${VM}.json"
      echo "── Pull + Up: $VM ──"
      ssh $SSH_OPTS ${USER}@${IP} "
        if [ -f $MANIFEST ] && [ -f /opt/scripts/vm-images-pull-up.sh ]; then
          sudo /opt/scripts/vm-images-pull-up.sh --manifest $MANIFEST
        else
          sudo /opt/scripts/vm-images-pull-up.sh
        fi
      " 2>&1
      RC=$?
      [ $RC -ne 0 ] && curl -sf -X POST "$NTFY_URL/deploy" -H "Title: [$VM] pull-up FAILED" -H "Priority: 4" -d "exit=$RC" 2>/dev/null
      exit $RC
  - name: oci-mail
    command: |
      VM=oci-mail; IP=10.0.0.3; USER=ubuntu
      MANIFEST="/opt/scripts/containers-${VM}.json"
      echo "── Pull + Up: $VM ──"
      ssh $SSH_OPTS ${USER}@${IP} "
        if [ -f $MANIFEST ] && [ -f /opt/scripts/vm-images-pull-up.sh ]; then
          sudo /opt/scripts/vm-images-pull-up.sh --manifest $MANIFEST
        else
          sudo /opt/scripts/vm-images-pull-up.sh
        fi
      " 2>&1
      RC=$?
      [ $RC -ne 0 ] && curl -sf -X POST "$NTFY_URL/deploy" -H "Title: [$VM] pull-up FAILED" -H "Priority: 4" -d "exit=$RC" 2>/dev/null
      exit $RC
  - name: oci-analytics
    command: |
      VM=oci-analytics; IP=10.0.0.4; USER=ubuntu
      MANIFEST="/opt/scripts/containers-${VM}.json"
      echo "── Pull + Up: $VM ──"
      ssh $SSH_OPTS ${USER}@${IP} "
        if [ -f $MANIFEST ] && [ -f /opt/scripts/vm-images-pull-up.sh ]; then
          sudo /opt/scripts/vm-images-pull-up.sh --manifest $MANIFEST
        else
          sudo /opt/scripts/vm-images-pull-up.sh
        fi
      " 2>&1
      RC=$?
      [ $RC -ne 0 ] && curl -sf -X POST "$NTFY_URL/deploy" -H "Title: [$VM] pull-up FAILED" -H "Priority: 4" -d "exit=$RC" 2>/dev/null
      exit $RC
  - name: oci-apps
    command: |
      VM=oci-apps; IP=10.0.0.6; USER=ubuntu
      MANIFEST="/opt/scripts/containers-${VM}.json"
      echo "── Pull + Up: $VM ──"
      ssh $SSH_OPTS ${USER}@${IP} "
        if [ -f $MANIFEST ] && [ -f /opt/scripts/vm-images-pull-up.sh ]; then
          sudo /opt/scripts/vm-images-pull-up.sh --manifest $MANIFEST
        else
          sudo /opt/scripts/vm-images-pull-up.sh
        fi
      " 2>&1
      RC=$?
      [ $RC -ne 0 ] && curl -sf -X POST "$NTFY_URL/deploy" -H "Title: [$VM] pull-up FAILED" -H "Priority: 4" -d "exit=$RC" 2>/dev/null
      exit $RC
