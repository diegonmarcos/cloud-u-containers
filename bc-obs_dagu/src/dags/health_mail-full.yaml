schedule: "17 7 * * *"
env:
  - NTFY_URL: http://10.0.0.6:8090
  - AUTHELIA_BEARER_TOKEN: ${AUTHELIA_BEARER_TOKEN}
mail_on:
  failure: true
  success: false
steps:
  - name: run-mail-health
    command: |
      SSH="ssh -i /home/dagu/.ssh/vault_id_rsa -o StrictHostKeyChecking=no -o ConnectTimeout=10 -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR"
      # Run health_mail.ts inside the C3 API container (has all deps + SSH keys)
      RESULT=$($SSH ubuntu@10.0.0.6 "docker exec c3-infra-mcp npx tsx mcp/tools/health_mail.ts 2>&1") || true

      if [ -z "$RESULT" ]; then
        curl -s -X POST "$NTFY_URL/infra_mail-health" \
          -H "Authorization: Bearer $AUTHELIA_BEARER_TOKEN" \
          -H "Title: Mail Health FAILED — could not run check" \
          -H "Priority: 5" \
          -H "Tags: rotating_light,email" \
          -d "health_mail.ts returned empty output"
        exit 1
      fi

      STATUS=$(echo "$RESULT" | jq -r '.status // .overall // "unknown"' 2>/dev/null || echo "unknown")
      SUMMARY=$(echo "$RESULT" | jq -r '.summary // empty' 2>/dev/null || echo "$RESULT" | tail -10)
      FAILS=$(echo "$RESULT" | jq -r '.failed // 0' 2>/dev/null || echo "?")

      if [ "$STATUS" = "ok" ] || [ "$STATUS" = "healthy" ] || [ "$STATUS" = "pass" ] || [ "$FAILS" = "0" ]; then
        curl -s -X POST "$NTFY_URL/infra_mail-health" \
          -H "Authorization: Bearer $AUTHELIA_BEARER_TOKEN" \
          -H "Title: Mail Health OK" \
          -H "Priority: 2" \
          -H "Tags: white_check_mark,email" \
          -d "$(echo -e "All checks passed\n\n$SUMMARY\n\nDagu: http://10.0.0.3:8070")"
      else
        curl -s -X POST "$NTFY_URL/infra_mail-health" \
          -H "Authorization: Bearer $AUTHELIA_BEARER_TOKEN" \
          -H "Title: Mail Health FAILED ($FAILS issues)" \
          -H "Priority: 5" \
          -H "Tags: rotating_light,email" \
          -d "$(echo -e "Status: $STATUS\n\n$SUMMARY\n\nDagu: http://10.0.0.3:8070")"
        exit 1
      fi
