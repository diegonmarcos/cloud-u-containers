schedule: "0 11 * * *"
env:
  - NTFY_URL: http://10.0.0.6:8090
  - BACKUP_TARGETS: /var/lib/dagu/data/cloud-data/cloud-data-backup-targets.json
mail_on:
  failure: false
  success: false
steps:
  - name: check-backups-and-notify
    command: |
      # Path-priority chain: legacy clone → 2_configs/dist → in-image bundled copy
      for p in /var/lib/dagu/data/cloud-data/cloud-data-backup-targets.json \
               /var/lib/dagu/data/cloud-data/2_configs/dist/cloud-data-backup-targets.json \
               /app/cloud-data-backup-targets.json; do
        [ -f "$p" ] && BACKUP_TARGETS="$p" && break
      done
      SSH="ssh -i /home/dagu/.ssh/vault_id_rsa -o StrictHostKeyChecking=no -o ConnectTimeout=5 -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR"
      ALERTS=""
      # Data-driven VM list from cloud-data-backup-targets.json
      VM_LIST=$(jq -r '.by_vm | to_entries[] | "\(.value.wg_ip):\(.key):\(.value.user)"' "$BACKUP_TARGETS" 2>/dev/null || echo "10.0.0.1:gcp-proxy:diego 10.0.0.3:oci-mail:ubuntu 10.0.0.4:oci-analytics:ubuntu 10.0.0.6:oci-apps:ubuntu")
      for vm_data in $VM_LIST; do
        ip=${vm_data%%:*}
        temp=${vm_data#*:}
        name=${temp%:*}
        user=${temp#*:}
        RECENT=$($SSH $user@$ip "find /var/backups -name '*.sql.gz' -o -name '*.tar.gz' -o -name '*.bak' 2>/dev/null | head -5 | while read f; do stat --format='%n (%s bytes, %y)' \"\$f\" 2>/dev/null; done | head -5" 2>/dev/null)
        COUNT=$($SSH $user@$ip "find /var/backups -name '*.sql.gz' -mtime -1 2>/dev/null | wc -l" 2>/dev/null || echo 0)
        if [ "$COUNT" -eq 0 ] 2>/dev/null; then
          ALERTS="${ALERTS}  $name ($ip): NO backups in last 24h\n"
          if [ -n "$RECENT" ]; then
            ALERTS="${ALERTS}    Latest files:\n"
            while IFS= read -r f; do
              ALERTS="${ALERTS}      $f\n"
            done <<< "$RECENT"
          fi
        fi
      done
      if [ -n "$ALERTS" ]; then
        MSG=$(echo -e "Backup freshness issues:\n${ALERTS}\nAction:\n  ssh <user>@<ip> 'ls -lt /var/backups/ | head -10'\n  Check backup cron: ssh <user>@<ip> 'crontab -l'\n\nDagu: http://10.0.0.3:8070")
        curl -s -X POST "$NTFY_URL/ops_backups" \
          -H "Authorization: Bearer $AUTHELIA_BEARER_TOKEN" \
          -H "Title: Backup Alert" \
          -H "Priority: 4" \
          -H "Tags: floppy_disk,warning" \
          -d "$MSG"
        exit 1
      fi
