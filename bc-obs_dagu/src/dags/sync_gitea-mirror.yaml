schedule: "0 3 * * *"
env:
  - GIT_SSH_COMMAND: ssh -i /root/.ssh/vault_id_rsa -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR
  - MIRROR_BASE: /var/lib/dagu/data/gitea-mirrors
  - GITHUB_ORG: diegonmarcos
  - GITEA_URL: git@git.diegonmarcos.com
  - GITEA_ORG: diego
  - NTFY_URL: http://10.0.0.1:8090
mailOn:
  failure: true
  success: false
steps:
  - name: mirror-repos
    command: |
      REPOS="unix cloud cloud-data front front-data tools vault"
      mkdir -p "$MIRROR_BASE"

      OK=0
      FAIL=0

      for repo in $REPOS; do
        echo ""
        echo "── Mirror: $repo ──"

        REPO_DIR="$MIRROR_BASE/$repo.git"

        # Initial bare clone from GitHub (source of truth)
        if [ ! -d "$REPO_DIR" ]; then
          echo "  Cloning bare from GitHub..."
          if ! git clone --bare "git@github.com:${GITHUB_ORG}/${repo}.git" "$REPO_DIR"; then
            echo "  FAIL clone $repo"
            FAIL=$((FAIL + 1))
            continue
          fi
          # Add Gitea as push remote
          git -C "$REPO_DIR" remote add gitea "${GITEA_URL}:${GITEA_ORG}/${repo}.git"
        fi

        # Fetch latest from GitHub (remote always wins)
        echo "  Fetching from GitHub..."
        if ! git -C "$REPO_DIR" fetch origin --prune --force 2>&1; then
          echo "  FAIL fetch $repo"
          FAIL=$((FAIL + 1))
          continue
        fi

        # Force push all refs to Gitea (mirror)
        echo "  Pushing to Gitea..."
        if git -C "$REPO_DIR" push gitea --mirror --force 2>&1; then
          echo "  OK $repo"
          OK=$((OK + 1))
        else
          echo "  FAIL push $repo"
          FAIL=$((FAIL + 1))
        fi
      done

      echo ""
      echo "═══════════════════════════════════════════════"
      echo "Gitea mirror: $OK ok, $FAIL failed (of $(echo $REPOS | wc -w) repos)"
      echo "═══════════════════════════════════════════════"

      [ "$FAIL" -gt 0 ] && exit 1
      exit 0

  - name: notify
    depends:
      - mirror-repos
    command: |
      curl -sf -d "Gitea mirror sync complete" "$NTFY_URL/ops" >/dev/null 2>&1 || true
