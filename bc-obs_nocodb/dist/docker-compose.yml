services:
  nocodb:
    image: ghcr.io/diegonmarcos/nocodb:latest
    build:
      context: .
      dockerfile_inline: |
        FROM nocodb/nocodb:latest
        LABEL org.opencontainers.image.source="https://github.com/diegonmarcos/cloud"
    container_name: nocodb
    restart: "no"  # container-init handles startup
    network_mode: host
    env_file:
      - .secrets
    environment:
      PORT: "8085"
      NC_DB: "pg://localhost:5441?u=nocodb&p=${POSTGRES_PASSWORD}&d=nocodb"
      NC_PUBLIC_URL: https://db.diegonmarcos.com
      NC_DISABLE_TELE: "true"
      NC_OIDC_ISSUER: https://auth.diegonmarcos.com
      NC_OIDC_CLIENT_ID: nocodb
      NC_OIDC_CLIENT_SECRET: ${NC_OIDC_CLIENT_SECRET}
      NC_OIDC_AUTHORIZATION_URL: https://auth.diegonmarcos.com/api/oidc/authorization
      NC_OIDC_TOKEN_URL: https://auth.diegonmarcos.com/api/oidc/token
      NC_OIDC_USERINFO_URL: https://auth.diegonmarcos.com/api/oidc/userinfo
      NC_OIDC_SCOPE: openid profile email
    volumes:
      - nocodb_data:/usr/app/data
      - /mnt/gcloud-sqlite:/sqlite:ro
    depends_on:
      nocodb-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8085/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  nocodb-db:
    image: ghcr.io/diegonmarcos/nocodb-db:latest
    build:
      context: .
      dockerfile_inline: |
        FROM postgres:16-bookworm
        LABEL org.opencontainers.image.source="https://github.com/diegonmarcos/cloud"
    container_name: nocodb-db
    restart: "no"  # container-init handles startup
    network_mode: host
    environment:
      POSTGRES_DB: nocodb
      POSTGRES_USER: nocodb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGPORT: "5441"
    volumes:
      - nocodb_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nocodb -d nocodb -p 5441"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  nocodb_data:
    name: nocodb_data
  nocodb_postgres:
    name: nocodb_postgres

