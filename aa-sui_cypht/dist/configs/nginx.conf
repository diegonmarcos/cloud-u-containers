# Cypht nginx config — bound to WireGuard IP only (defense in depth).
# Bind-mounted RO over /etc/nginx/nginx.conf in the container, replacing
# the upstream image's `listen 80` server block.
#
# Network model:
#   - cypht runs network_mode: host on oci-mail (WG IP 10.0.0.3).
#   - nginx binds 10.0.0.3:8889 → only reachable from WG mesh.
#   - VM iptables INPUT policy is DROP except 10.0.0.0/24 + lo + RELATED
#     (belt-and-suspenders enforcement).
#   - Caddy on gcp-proxy reverse_proxies webmail.diegonmarcos.com → 10.0.0.3:8889.
user www-data;
worker_processes 4;
pid /run/nginx.pid;
events {
	worker_connections 768;
}
http {
	sendfile off;
	tcp_nopush on;
	tcp_nodelay on;
	keepalive_timeout 65;
	types_hash_max_size 2048;
	include /etc/nginx/mime.types;
	default_type application/octet-stream;
	ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
	ssl_prefer_server_ciphers on;
	access_log /var/log/nginx/access.log;
	error_log /var/log/nginx/error.log;
	gzip on;
	gzip_disable "msie6";
	server {
		# WG-only bind. NEVER 0.0.0.0 — relying on iptables alone is single-layer
		# and the rest of our services (Maddy 10.0.0.3:993/465/etc.) bind explicit WG.
		listen 10.0.0.3:8889;
		server_name webmail.diegonmarcos.com cypht.app localhost;
		index index.php;
		root /var/www;
		client_max_body_size 60M;
		location / {
			try_files $uri /index.php$is_args$args;
		}
		location ~ \.php {
			try_files $uri =404;
			fastcgi_split_path_info ^(.+\.php)(/.+)$;
			include fastcgi_params;
			fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
			fastcgi_param SCRIPT_NAME $fastcgi_script_name;
			fastcgi_index index.php;
			# UNIX socket — shared with cypht's php-fpm via /run (tmpfs).
			# TCP :9000 collides with snappymail (both host-network on oci-mail).
			fastcgi_pass unix:/run/cypht-php-fpm.sock;
		}
	}
}
