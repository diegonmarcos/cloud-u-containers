# Goose config for the my-ai-api container — baked at /app/.config/goose/config.yaml
# schema mirrors III_unix/bb_flakes_termux/src/modules/dotfiles/goose/config.yaml (goose 1.44)

# Provider: goose -> my-ai-api's own OpenAI-compatible front (/v1/chat/completions)
# so every goose LLM call flows back through the my-ai-api plugin pipeline
# (principles/RTK/ponytail/headroom) before hitting OpenRouter.
# OPENAI_HOST is deliberately NOT set here: compose.nix exports it from the same wg0
# bind the API listens on. A host pinned in this file (http://127.0.0.1:3217) went
# dead when that bind moved to the WG IP, and goose could reach neither its model
# nor any extension below.
#
# GOOSE_MODEL is deliberately NOT set here either, for exactly the same reason:
# compose.nix exports it from build.json's runtime.model. This file used to pin
# deepseek/deepseek-v4-pro in two places (here and providers.openai.model below),
# which silently outranked build.json — the declared v4-flash never reached goose.
GOOSE_PROVIDER: openai
OPENAI_API_KEY: sk-my-ai-api-local
GOOSE_CONTEXT_WINDOW: 8192
GOOSE_TELEMETRY_ENABLED: false

extensions:
  # ══ BEGIN GENERATED MCP SERVERS — do not edit; derived from cloud-infra/1_cloud-configs/dist/mcp.json + mcp-policy.json by cloud-u-linux da_my-ai/data/claude/gen-mcp-tpl.sh (platform: container-goose) ══
  cloud-cgc-pub-mcp:
    name: Cloud Code Graph Context MCP
    type: streamable_http
    uri: http://10.0.0.6:3105/mcp
    enabled: true
    timeout: 300
  cloud-infra-mcp:
    name: Cloud Infra MCP
    type: streamable_http
    uri: http://10.0.0.6:3100/mcp
    enabled: false
    timeout: 300
  # ══ END GENERATED MCP SERVERS ══

  developer:
    enabled: true
    type: platform
    name: developer
    description: Write and edit files, and execute shell commands
    display_name: Developer
    bundled: true
    available_tools: []

  todo:
    enabled: true
    type: platform
    name: todo
    description: Enable a todo list for goose so it can keep track of what it is doing
    display_name: Todo
    bundled: true
    available_tools: []

providers:
  openai:
    enabled: true
    # No `model:` key — see the GOOSE_MODEL note at the top of this file.
    configured: true

active_provider: openai
