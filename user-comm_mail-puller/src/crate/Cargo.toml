[package]
name         = "mail-puller"
version      = "0.1.0"
edition      = "2021"
description  = "IMAP IDLE sidecar: pulls remote mailboxes (Gmail/Outlook), dual-delivers into local Maddy + Stalwart."

[[bin]]
name = "mail-puller"
path = "src/main.rs"

[dependencies]
tokio         = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "sync", "io-util", "net"] }
tokio-util    = { version = "0.7", features = ["compat"] }
tokio-rustls  = "0.25"
rustls        = "0.22"
rustls-pemfile = "2"
webpki-roots  = "0.26"
async-imap    = "0.9"
futures       = "0.3"

# SMTP delivery — hand-rolled in src/deliver.rs (lettre 0.11 had Envelope
# private + MIME-rewrap issues; needs are minimal: 1 authenticated submission
# over STARTTLS in trusted WG mesh, raw RFC822 forward).
base64        = "0.22"

# OAuth2 token refresh (Gmail + Outlook)
reqwest       = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Config + state
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"
rusqlite      = { version = "0.31", features = ["bundled"] }

# Observability
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Util
anyhow        = "1"
thiserror     = "1"

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
strip         = "symbols"
