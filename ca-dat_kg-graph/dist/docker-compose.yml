services:
  surrealdb:
    image: ghcr.io/diegonmarcos/kg-graph:latest
    build:
      context: .
      dockerfile_inline: |
        FROM surrealdb/surrealdb:v2
        COPY docker-compose.yml /opt/cloud-docs/docker-compose.yml
        LABEL org.opencontainers.image.source="https://github.com/diegonmarcos/cloud"
        LABEL org.opencontainers.image.description="kg-graph"
        LABEL org.opencontainers.image.title="kg-graph"
        LABEL cloud.diegonmarcos.from-image="surrealdb/surrealdb:v2"
        LABEL cloud.diegonmarcos.registry="ghcr.io/diegonmarcos"
    container_name: surrealdb
    restart: "no"  # container-init handles startup
    network_mode: host
    command: start --log info --user root --pass ${SURREAL_ROOT_PASSWORD} --bind 127.0.0.1:8001 file:/data/surreal.db
    env_file:
      - .secrets
    volumes:
      - /opt/data/surrealdb:/data
    healthcheck:
      test: ["CMD", "/surreal", "is-ready", "--conn", "http://localhost:8001"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

