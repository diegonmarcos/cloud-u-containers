services:
  cloud-spec:
    image: ghcr.io/diegonmarcos/cloud-spec:latest
    build:
      context: .
      dockerfile_inline: |
        FROM busybox:latest
        COPY docker-compose.yml /opt/cloud-docs/docker-compose.yml
        LABEL org.opencontainers.image.source="https://github.com/diegonmarcos/cloud"
        LABEL org.opencontainers.image.description="cloud-spec"
        LABEL org.opencontainers.image.title="cloud-spec"
        LABEL cloud.diegonmarcos.from-image="busybox:latest"
        LABEL cloud.diegonmarcos.registry="ghcr.io/diegonmarcos"
    container_name: cloud-spec
    network_mode: host
    command: busybox httpd -f -p 3080 -h /srv
    restart: no
    stop_grace_period: 30s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    dns:
      - 10.0.0.1
      - 1.1.1.1
    volumes:
      - ./site:/srv:ro
    pids_limit: 256
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
