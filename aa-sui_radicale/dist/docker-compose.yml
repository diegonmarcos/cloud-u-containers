services:
  radicale:
    image: tomsquest/docker-radicale:latest
    container_name: radicale
    network_mode: host
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    dns:
      - 10.0.0.1
      - 1.1.1.1
    environment:
      - TAKE_FILE_OWNERSHIP=true
    volumes:
      - ./data:/data
      - ./config:/config:ro
    healthcheck:
      test: curl -f http://localhost:5232/.web/ || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
    pids_limit: 256
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
networks:
  default:
