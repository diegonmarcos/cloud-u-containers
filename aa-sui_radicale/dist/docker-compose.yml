services:
  radicale:
    image: ghcr.io/diegonmarcos/radicale:latest
    build:
      context: .
      dockerfile_inline: |
        FROM tomsquest/docker-radicale:latest
        COPY config/config /config/config
        COPY docker-compose.yml /opt/cloud-docs/docker-compose.yml
        LABEL org.opencontainers.image.source="https://github.com/diegonmarcos/cloud"
        LABEL org.opencontainers.image.description="radicale"
        LABEL org.opencontainers.image.title="radicale"
        LABEL cloud.diegonmarcos.from-image="tomsquest/docker-radicale:latest"
        LABEL cloud.diegonmarcos.registry="ghcr.io/diegonmarcos"
    container_name: radicale
    restart: no
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    dns:
      - 10.0.0.1
      - 1.1.1.1
    environment:
      - TAKE_FILE_OWNERSHIP=true
    ports:
      - "10.0.0.6:5232:5232"
    volumes:
      - radicale_data:/data
    networks:
      - default
    healthcheck:
      test: curl -f http://localhost:5232/.web/ || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
          pids: 256
        reservations:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
networks:
  default:
volumes:
  radicale_data:
