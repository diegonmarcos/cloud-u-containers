name = "email-forwarder"
main = "email-forwarder.js"
compatibility_date = "2024-01-01"
account_id = "e5cb0a0c6f448e54f217de484259f0ae"

# Email Routing architecture:
#   Internet → Cloudflare MX (route1/2/3.mx.cloudflare.net)
#     → Email Routing rule: me@diegonmarcos.com → Worker "email-forwarder"
#     → In parallel:
#       Copy 1: ALWAYS → Maddy via cf-worker-bridge (oci-analytics, wg-public ingress;
#                          replaces legacy http-to-smtp-proxy-api on gcp-proxy as of Phase 5)
#       Copy 2: ALWAYS → Google Workspace via Gmail API (service account JWT)
#       Copy 3: ONLY if C3 health unhealthy → live.com (disaster backup)

# Persistent logging — Workers Logs (queryable in CF dashboard + API)
[observability]
enabled = true
[observability.logs]
invocation_logs = true
head_sampling_rate = 1

[vars]
# Non-secret configuration
GOOGLE_EMAIL = "me@diegonmarcos.com"
GOOGLE_SA_EMAIL = "diego-cli@diegonmarcos-infra-prod.iam.gserviceaccount.com"
C3_HEALTH_URL = "https://api.diegonmarcos.com/c3-services-api/cf-worker-http-to-wg-public-bridge/reach"
HTTP_TO_SMTP_PROXY_API_URL = "https://api.diegonmarcos.com/cf-worker-bridge/"
BACKUP_EMAIL = "diegonmarcos@live.com"
# Secrets — set via: wrangler secret put <NAME>
# C3_BEARER_TOKEN              — Authelia OIDC bearer token (cloudflare-health-c3-api client)
#                                Reused for HTTP_TO_SMTP_PROXY_API auth — Caddy forward_auth
#                                introspect-proxy validates.
# HTTP_TO_SMTP_PROXY_API_KEY   — App-layer API key validated by cf-worker-http-to-wg-public-bridge
#                                Rust binary (defence-in-depth alongside Caddy bearer auth). Rotate
#                                when Phase 5 of the wg-public plan ships — fresh key generated
#                                in a_solutions/aa-sui_tools-cf-worker-http-to-wg-public-bridge/src/secrets.yaml
#                                (sops-encrypted). To be retired once Caddy bearer is the sole gate;
#                                for now both are sent on each request.
# GOOGLE_SA_KEY                — GCP service account private key (PEM, for Gmail API JWT)
