name = "email-forwarder"
main = "email-forwarder.js"
compatibility_date = "2024-01-01"
account_id = "e5cb0a0c6f448e54f217de484259f0ae"

# Email Routing architecture:
#   Internet → Cloudflare MX (route1/2/3.mx.cloudflare.net)
#     → Email Routing rule: me@diegonmarcos.com → Worker "email-forwarder"
#     → In parallel: POST to smtp-proxy + check /reach/smtp-proxy
#     → If delivered: done (send insurance copy if reach says flaky)
#     → If failed: forward to BACKUP_EMAIL (diegonmarcos@live.com)
#
# Email Routing rules are managed in Cloudflare Dashboard:
#   Email > Email Routing > Routing Rules
#   Rule: me@diegonmarcos.com → Send to Worker → email-forwarder

# Persistent logging — Workers Logs (queryable in CF dashboard + API)
[observability]
enabled = true
[observability.logs]
invocation_logs = true
head_sampling_rate = 1

[vars]
# C3 API route reachability — tests full path (Cloudflare → Caddy → smtp-proxy)
