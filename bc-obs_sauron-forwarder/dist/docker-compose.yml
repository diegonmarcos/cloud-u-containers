services:
  sauron-forwarder:
    image: ghcr.io/diegonmarcos/sauron-forwarder:latest
    build:
      context: .
      dockerfile_inline: |
        FROM debian:bookworm-slim
        COPY docker-compose.yml /opt/cloud-docs/docker-compose.yml
        LABEL org.opencontainers.image.source="https://github.com/diegonmarcos/cloud"
        LABEL org.opencontainers.image.description="sauron-forwarder"
        LABEL org.opencontainers.image.title="sauron-forwarder"
        LABEL cloud.diegonmarcos.from-image="debian:bookworm-slim"
        LABEL cloud.diegonmarcos.registry="ghcr.io/diegonmarcos"
    container_name: sauron-forwarder
    restart: "no"  # container-init handles startup
    network_mode: host
    environment:
      - CENTRAL_HOST=${CENTRAL_HOST}
      - CENTRAL_PORT=${CENTRAL_PORT:-5514}
    volumes:
      - sauron-data:/var/log/sauron:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apt-get update && apt-get install -y --no-install-recommends netcat-openbsd && rm -rf /var/lib/apt/lists/*
        echo "Forwarding alerts to $${CENTRAL_HOST}:$${CENTRAL_PORT}"
        tail -F /var/log/sauron/alerts.jsonl 2>/dev/null | while read line; do
          echo "$$line" | nc -w1 $${CENTRAL_HOST} $${CENTRAL_PORT} 2>/dev/null || true
        done

volumes:
  sauron-data:
    name: sauron-lite_sauron-data
    external: true
