[SERVICE]
    Flush         5
    Daemon        Off
    Log_Level     info
    Parsers_File  parsers.conf
    HTTP_Server   On
    HTTP_Listen   0.0.0.0
    HTTP_Port     2020
    storage.path  /fluent-bit/db
    storage.sync  normal
    storage.checksum off
    storage.backlog.mem_limit 16M

# Tail all docker container logs (json-file driver)
[INPUT]
    Name              tail
    Tag               docker.*
    Path              /var/lib/docker/containers/*/*-json.log
    Parser            docker
    DB                /fluent-bit/db/docker.db
    Mem_Buf_Limit     32MB
    Skip_Long_Lines   On
    Refresh_Interval  10

# Tail /var/log/syslog for host-level events
[INPUT]
    Name              tail
    Tag               host.syslog
    Path              /var/log/syslog
    DB                /fluent-bit/db/syslog.db
    Mem_Buf_Limit     16MB
    Skip_Long_Lines   On
    Refresh_Interval  10

# Enrich docker logs with container metadata from the path
[FILTER]
    Name          parser
    Match         docker.*
    Key_Name      log
    Parser        docker_no_time
    Reserve_Data  On

# Forward everything to central Loki on oci-apps (LGTM stack: 10.0.0.6:3110)
[OUTPUT]
    Name        loki
    Match       *
    Host        10.0.0.6
    Port        3110
    Labels      job=fluent-bit,host=${HOSTNAME}
    Label_Keys  $container_name,$tag
    Line_Format json
    Auto_Kubernetes_Labels off
    Retry_Limit 3

# Mirror to stdout for local dozzle inspection (low-volume fallback)
[OUTPUT]
    Name        stdout
    Match       host.syslog
    Format      json_lines
