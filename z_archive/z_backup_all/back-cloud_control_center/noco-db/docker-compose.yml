# NocoDB - Open Source Airtable Alternative
# Deploy on: oci-p-flex_1 (144.24.196.72 / WireGuard: 10.0.0.2)
# Access via: https://db.diegonmarcos.com (Authelia 2FA protected)

services:
  nocodb:
    image: nocodb/nocodb:latest
    container_name: nocodb
    restart: unless-stopped
    environment:
      NC_DB: "pg://nocodb-db:5432?u=nocodb&p=${POSTGRES_PASSWORD}&d=nocodb"
      NC_AUTH_JWT_SECRET: ${NC_AUTH_JWT_SECRET}
      NC_ADMIN_EMAIL: ${NC_ADMIN_EMAIL}
      NC_ADMIN_PASSWORD: ${NC_ADMIN_PASSWORD}
      NC_PUBLIC_URL: https://db.diegonmarcos.com
      NC_DISABLE_TELE: "true"
    volumes:
      - nocodb_data:/usr/app/data
    ports:
      # Bind to WireGuard IP only - accessible via NPM proxy
      - "10.0.0.2:8085:8080"
    networks:
      - nocodb_network
    depends_on:
      nocodb-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  nocodb-db:
    image: postgres:16-alpine
    container_name: nocodb-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: nocodb
      POSTGRES_USER: nocodb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - nocodb_postgres:/var/lib/postgresql/data
    networks:
      - nocodb_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nocodb -d nocodb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  nocodb_data:
    name: nocodb_data
  nocodb_postgres:
    name: nocodb_postgres

networks:
  nocodb_network:
    name: nocodb_network
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/24
