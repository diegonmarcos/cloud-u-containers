# NocoDB - Airtable alternative
# Database as spreadsheet
# Deployed on: oci-p-flex_1 (Oracle Flex)

services:
  nocodb:
    image: nocodb/nocodb:latest
    container_name: nocodb_app
    restart: "no"

    ports:
      - "3020:8080"

    volumes:
      - nocodb_data:/usr/app/data

    environment:
      - NC_PUBLIC_URL=https://nocodb.diegonmarcos.com
      - NC_DISABLE_TELE=true
      - NC_DB=${NC_DB:-pg://nocodb_postgres:5432?u=nocodb&p=changeme&d=nocodb}
      - NC_AUTH_JWT_SECRET=${NC_AUTH_JWT_SECRET:-changeme}

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - dev_network

    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:8080/api/v1/health']
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:16-bookworm
    container_name: nocodb_postgres
    restart: "no"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    environment:
      - POSTGRES_USER=${POSTGRES_USER:-nocodb}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - POSTGRES_DB=${POSTGRES_DB:-nocodb}
      - PGDATA=/var/lib/postgresql/data/pgdata

    networks:
      - dev_network

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nocodb']
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  dev_network:
    external: true
    name: dev_network

volumes:
  nocodb_data:
    driver: local
  postgres_data:
    driver: local
