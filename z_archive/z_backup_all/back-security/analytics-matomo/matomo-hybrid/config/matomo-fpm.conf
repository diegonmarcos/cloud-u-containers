; PHP-FPM main config for Matomo (on-demand)
; Only loads the Matomo pool

[global]
pid = /run/php/matomo-fpm.pid
error_log = /var/log/supervisor/matomo-php-error.log

[matomo]
user = www-data
group = www-data

listen = /run/php/matomo-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Dynamic pool for Matomo UI and API processing
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

; Matomo requirements
php_admin_value[memory_limit] = 256M
php_admin_value[max_execution_time] = 300
php_admin_value[post_max_size] = 64M
php_admin_value[upload_max_filesize] = 64M
php_admin_flag[log_errors] = on

; Session
php_admin_value[session.save_handler] = files
php_admin_value[session.save_path] = /tmp
