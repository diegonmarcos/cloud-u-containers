# Matomo Nginx - On-demand (port 8081, internal only)
# Standard Matomo FPM nginx configuration
# Started/stopped via supervisor wake/sleep scripts

user www-data;
worker_processes 1;
pid /run/matomo-nginx.pid;
error_log /var/log/matomo-nginx/error.log warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/matomo-nginx/access.log;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    server {
        listen 8081;
        server_name _;

        root /var/www/html;
        index index.php index.html;

        # Matomo static files
        location / {
            try_files $uri $uri/ =404;
        }

        # PHP processing via Matomo FPM pool
        location ~ \.php$ {
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            try_files $fastcgi_script_name =404;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_param HTTP_PROXY "";
            fastcgi_pass unix:/run/php/matomo-fpm.sock;
            fastcgi_read_timeout 300;
        }

        # Deny access to sensitive files
        location ~ /\.ht {
            deny all;
        }

        location ~ /config/ {
            deny all;
        }

        location ~ /tmp/ {
            deny all;
        }

        location ~ /lang/ {
            deny all;
        }
    }
}
