services:
  research:
    image: ghcr.io/diegonmarcos/quant-full-research:latest
    build:
      context: .
      dockerfile_inline: |
        FROM ghcr.io/diegonmarcos/quant-full-research:latest
        LABEL org.opencontainers.image.source="https://github.com/diegonmarcos/cloud-infra"
    container_name: quant_full_research
    restart: "no"  # container-init handles startup
    network_mode: host
    volumes:
      - ./notebooks:/home/jovyan/work
      - shared_data:/home/jovyan/data
    environment:
      JUPYTER_ENABLE_LAB: "yes"
    command: >
      sh -c "pip install openbb polars plotly &&
             start-notebook.sh --NotebookApp.token='' --ServerApp.port=8890"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8890/api || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  analytics:
    image: ghcr.io/diegonmarcos/quant-full-analytics:latest
    build:
      context: .
      dockerfile_inline: |
        FROM ghcr.io/diegonmarcos/quant-full-analytics:latest
        LABEL org.opencontainers.image.source="https://github.com/diegonmarcos/cloud-infra"
    container_name: quant_full_analytics
    restart: "no"  # container-init handles startup
    network_mode: host
    volumes:
      - ./scripts:/app
      - shared_data:/data
    working_dir: /app
    command: >
      sh -c "pip install polars numpy scipy pandas matplotlib seaborn plotly dash &&
             tail -f /dev/null"

  ml_brain:
    image: ghcr.io/diegonmarcos/quant-full-ml:latest
    build:
      context: .
      dockerfile_inline: |
        FROM ghcr.io/diegonmarcos/quant-full-ml:latest
        LABEL org.opencontainers.image.source="https://github.com/diegonmarcos/cloud-infra"
    container_name: quant_full_ml
    restart: "no"  # container-init handles startup
    network_mode: host
    volumes:
      - ./models:/workspace/models
      - shared_data:/data
    working_dir: /workspace
    # Uncomment for GPU support:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    command: >
      sh -c "pip install torch scikit-learn lightgbm pycaret xgboost &&
             tail -f /dev/null"

  risk_manager:
    image: ghcr.io/diegonmarcos/quant-full-risk:latest
    build:
      context: .
      dockerfile_inline: |
        FROM ghcr.io/diegonmarcos/quant-full-risk:latest
        LABEL org.opencontainers.image.source="https://github.com/diegonmarcos/cloud-infra"
    container_name: quant_full_risk
    restart: "no"  # container-init handles startup
    network_mode: host
    volumes:
      - ./risk_reports:/reports
      - shared_data:/data
    working_dir: /reports
    command: >
      sh -c "pip install riskfolio-lib quantstats cvxpy &&
             tail -f /dev/null"

  execution_engine:
    image: ghcr.io/diegonmarcos/quant-full-engine:latest
    build:
      context: .
      dockerfile_inline: |
        FROM ghcr.io/diegonmarcos/quant-full-engine:latest
        LABEL org.opencontainers.image.source="https://github.com/diegonmarcos/cloud-infra"
    container_name: quant_full_engine
    restart: "no"  # container-init handles startup
    network_mode: host
    volumes:
      - ./strategies:/app/strategies
      - shared_data:/data
    working_dir: /app
    command: >
      sh -c "pip install nautilus_trader ib_insync &&
             tail -f /dev/null"

  database:
    image: ghcr.io/diegonmarcos/quant-full-db:latest
    build:
      context: .
      dockerfile_inline: |
        FROM ghcr.io/diegonmarcos/quant-full-db:latest
        LABEL org.opencontainers.image.source="https://github.com/diegonmarcos/cloud-infra"
    container_name: quant_full_db
    restart: "no"  # container-init handles startup
    network_mode: host
    env_file:
      - .secrets
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGPORT: "5437"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pg_data:
    name: quant_full_pg_data
  shared_data:
    name: quant_full_shared_data

