services:
  introspect-proxy:
    build: .
    image: introspect-proxy:latest
    container_name: introspect-proxy
    restart: always
    env_file:
      - .env
    ports:
      - "127.0.0.1:4182:4182"
    environment:
      TZ: Europe/Madrid
      INTROSPECT_URL: http://authelia:9091/authelia/api/oidc/introspection
      CLIENT_ID: cli
      CLIENT_SECRET: ${AUTHELIA_CLI_SECRET}
      DEBUG: "false"
    networks:
      - npm_default
    deploy:
      resources:
        limits:
          memory: 96M
        reservations:
          memory: 48M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4182/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  npm_default:
    external: true
