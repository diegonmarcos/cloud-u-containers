services:
  syslog-forwarder:
    image: ghcr.io/diegonmarcos/syslog-forwarder:latest
    build:
      context: .
      dockerfile_inline: |
        FROM balabit/syslog-ng:4.4.0
        COPY docker-compose.yml /opt/cloud-docs/docker-compose.yml
        LABEL org.opencontainers.image.source="https://github.com/diegonmarcos/cloud-infra"
        LABEL org.opencontainers.image.description="syslog-forwarder"
        LABEL org.opencontainers.image.title="syslog-forwarder"
        LABEL cloud.diegonmarcos.from-image="balabit/syslog-ng:4.4.0"
        LABEL cloud.diegonmarcos.registry="ghcr.io/diegonmarcos"
    container_name: syslog-forwarder
    restart: "no"  # container-init handles startup
    network_mode: host
    environment:
      - VM_NAME=${VM_NAME:-unknown}
      - CENTRAL_HOST=${CENTRAL_HOST}
      - CENTRAL_PORT=${CENTRAL_PORT:-5514}
    volumes:
      - /opt/sauron/config/syslog-ng.conf:/etc/syslog-ng/syslog-ng.conf:ro
      - sauron-logs:/var/log/sauron:ro
      - syslog-cache:/var/cache/syslog-ng

volumes:
  sauron-logs:
    name: sauron_sauron-logs
    external: true
  syslog-cache:
    driver: local
