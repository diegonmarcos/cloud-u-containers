    "crates/agents/agents-llm",
    "crates/analytics/analytics-backtest",
    "crates/analytics/analytics-cfa",
    "crates/analytics/analytics-derivatives",
    "crates/analytics/analytics-fixedincome",
    "crates/analytics/analytics-portfolio",
    "crates/analytics/analytics-quant",
    "crates/analytics/analytics-risk",
    "crates/auth",
    "crates/brokers/brokers-alpaca",
    "crates/brokers/brokers-core",
    "crates/brokers/brokers-generic",
    "crates/brokers/brokers-paper",
    "crates/client",
    "crates/core",
    "crates/data/data-akshare",
    "crates/data/data-alphavantage",
    "crates/data/data-coingecko",
    "crates/data/data-core",
    "crates/data/data-dbnomics",
    "crates/data/data-fred",
    "crates/data/data-generic",
    "crates/datahub",
    "crates/data/data-imf",
    "crates/data/data-kraken",
    "crates/data/data-polygon",
    "crates/data/data-worldbank",
    "crates/data/data-yahoo",
    "crates/eventbus",
    "crates/http",
    "crates/mcp",
    "crates/migration",
    "crates/ml/ml-candle",
    "crates/ml/ml-factor",
    "crates/ml/ml-hft",
    "crates/ml/ml-rl",
    "crates/nodegraph",
    "crates/server",
    "crates/storage",
    "crates/trading",
    "crates/ui/ui-charts",
    "crates/ui/ui-core",
    "crates/ui/ui-screens",
    "crates/ui/ui-widgets",
    "crates/ws",
    # AUTO-GENERATED: end
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
license = "AGPL-3.0-or-later"
authors = ["Fincept Corporation", "Diego Nepomuceno Marcos"]
repository = "https://github.com/diegonmarcos/fincept-rs"

[workspace.dependencies]
# Runtime
tokio = { version = "1.43", features = ["full"] }
futures = "0.3"
async-trait = "0.1"

# Serde + formats
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
csv = "1.3"

# Errors + logging
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Concurrency
dashmap = "6"
parking_lot = "0.12"
once_cell = "1"

# HTTP / WS
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "brotli", "stream"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }

# Storage
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "sqlite", "migrate", "macros", "chrono"] }
rusqlite = { version = "0.32", features = ["bundled"] }

# Rate limit + retry + URL
governor = "0.8"
url = "2.5"

# Web server + client layer (Phase 11 — backend/frontend split)
axum = { version = "0.8", features = ["ws", "macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Numerics / dataframes
polars = { version = "0.46", features = ["lazy", "temporal", "strings", "json", "csv"] }
ndarray = "0.16"
nalgebra = "0.33"
statrs = "0.18"
argmin = "0.10"

# Time
chrono = { version = "0.4", features = ["serde"] }
time = { version = "0.3", features = ["serde", "macros"] }

# UI (egui family)
egui = "0.30"
eframe = { version = "0.30", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui_plot = "0.30"
egui_extras = { version = "0.30", features = ["all_loaders"] }
egui_dock = "0.15"

# Testing
wiremock = "0.6"
criterion = { version = "0.5", features = ["async_tokio"] }
insta = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 1

[profile.bench]
lto = "thin"
