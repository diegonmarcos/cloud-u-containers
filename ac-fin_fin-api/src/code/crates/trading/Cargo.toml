[package]
name = "fincept-trading"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Trading engine: OrderRouter picks broker, PositionAggregator rolls up cross-broker books, RiskCheck enforces limits before submit."

[dependencies]
fincept-brokers-core = { path = "../brokers/brokers-core" }
fincept-brokers-paper = { path = "../brokers/brokers-paper" }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
parking_lot = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
