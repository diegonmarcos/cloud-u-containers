# Umami Analytics (lightweight, always-on)
# VM: oci-E2-f_1 (129.151.228.66)
# URL: https://analytics.diegonmarcos.com/umami

services:
  umami:
    image: ghcr.io/diegonmarcos/umami:latest
    build:
      context: .
      dockerfile_inline: |
        FROM ghcr.io/umami-software/umami:latest
        COPY docker-compose.yml /opt/cloud-docs/docker-compose.yml
        LABEL org.opencontainers.image.source="https://github.com/diegonmarcos/cloud"
        LABEL org.opencontainers.image.description="umami"
        LABEL org.opencontainers.image.title="umami"
        LABEL cloud.diegonmarcos.from-image="ghcr.io/umami-software/umami:latest"
        LABEL cloud.diegonmarcos.registry="ghcr.io/diegonmarcos"
    container_name: umami
    restart: "no"  # container-init handles startup
    ports:
      - "10.0.0.4:3006:3006"
    env_file:
      - .secrets
    environment:
      DATABASE_URL: postgresql://umami:${DB_PASSWORD}@umami-db:5442/umami
      DATABASE_TYPE: postgresql
      APP_SECRET: ${APP_SECRET}
      PORT: "3006"
      BASE_PATH: /umami
      DISABLE_TELEMETRY: "1"
    depends_on:
      umami-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3006/api/heartbeat || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M

  umami-db:
    image: ghcr.io/diegonmarcos/umami-db:latest
    build:
      context: .
      dockerfile_inline: |
        FROM postgres:16-alpine
        COPY docker-compose.yml /opt/cloud-docs/docker-compose.yml
        LABEL org.opencontainers.image.source="https://github.com/diegonmarcos/cloud"
        LABEL org.opencontainers.image.description="umami-db"
        LABEL org.opencontainers.image.title="umami-db"
        LABEL cloud.diegonmarcos.from-image="postgres:16-alpine"
        LABEL cloud.diegonmarcos.registry="ghcr.io/diegonmarcos"
    container_name: umami-db
    restart: "no"  # container-init handles startup
    expose:
      - "5442"
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGPORT: "5442"
    command: ["-p", "5442"]
    volumes:
      - umami_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -p 5442"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M

  umami-setup:
    image: ghcr.io/diegonmarcos/umami-setup:latest
    build:
      context: .
      dockerfile_inline: |
        FROM curlimages/curl:latest
        COPY setup.sh /setup/setup.sh
        COPY docker-compose.yml /opt/cloud-docs/docker-compose.yml
        LABEL org.opencontainers.image.source="https://github.com/diegonmarcos/cloud"
        LABEL org.opencontainers.image.description="umami-setup"
        LABEL org.opencontainers.image.title="umami-setup"
        LABEL cloud.diegonmarcos.from-image="curlimages/curl:latest"
        LABEL cloud.diegonmarcos.registry="ghcr.io/diegonmarcos"
    container_name: umami-setup
    restart: "no"
    env_file:
      - .secrets
    depends_on:
      umami:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/setup/setup.sh"]
    volumes:
      - umami_config:/output

volumes:
  umami_db_data:
    name: umami_db_data
  umami_config:
    name: umami_config
