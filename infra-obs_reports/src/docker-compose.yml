services:
  reports:
    image: ghcr.io/diegonmarcos/cloud-data-reports:latest
    build:
      context: .
      network: host
    container_name: cloud-data-reports
    network_mode: host
    # WireGuard requires NET_ADMIN to manage the wg0 interface and /dev/net/tun
    # to create the userspace tunnel. Without these wg-quick fails silently and
    # every downstream check (10.0.0.0/24 SSH, Hickory DNS, mail probes) breaks.
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    # /root/.ssh is a tmpfs: the entrypoint WRITES its own config + keys there
    # (from env vars). 2026-07-02 incident: this dir was a RW bind of the
    # host's ~/.ssh and the entrypoint clobbered the desktop ssh config
    # (root-owned, /root paths) — killing all VM aliases mid-recovery.
    # Host keys stay available read-only at /home/diego/.ssh.
    tmpfs:
      - /root/.ssh:mode=700
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOME}/.ssh:/home/diego/.ssh:ro
      - ${HOME}/.config/sops:/root/.config/sops:ro
      - ${HOME}/.config/gh:/root/.config/gh:ro
      - ${HOME}/git/cloud-vault/A0_keys:/home/diego/git/cloud-vault/A0_keys:ro
      - /nix/store:/nix/store:ro
      - ${HOME}/git/cloud-data:/root/git/cloud-data
      # RW (not :ro): the app's own build.sh derives dist/ output relative to
      # its OWN script location (reports-common's SELF_DIR-relative DIST_DIR),
      # which now lives inside this cloud-infra checkout — so this mount must
      # be writable, or the report run fails at the first `mkdir dist/`.
      # Reports binaries also fall back to ~/git/cloud-infra/1_cloud-configs/dist
      # for _cloud-data-consolidated.json + build-reports.json (per
      # reports-common/src/context.rs::find_cloud_data_file).
      - ${HOME}/git/cloud-infra:/root/git/cloud-infra
    environment:
      - GITHUB_TOKEN
      - GITHUB_ACTOR
      - SSH_KEY
      - SSH_HOST
      - SSH_USER
      - SSH_ALIAS
      - SOPS_AGE_KEY
      - WG_PRIVATE_KEY
      - WG_PUBLIC_PRIVATE_KEY
      - OCI_SSH_KEY
      - GCP_PROXY_SSH_KEY
      - GCP_T4_SSH_KEY
      # R6: bearer token for private/OIDC endpoint checks. Passed through from
      # the workflow env when set; otherwise entrypoint.sh loads the pre-signed
      # JWT from the RO-mounted vault (A0_keys volume above). If BOTH are absent
      # the entrypoint FAILS LOUD (exit 1) for auth-requiring runs rather than
      # false-failing every gated check — set REQUIRE_BEARER=false for an
      # explicit public-only run.
      - BEARER_TOKEN
      - REQUIRE_BEARER
      # Mail-stack E2E credentials (pass-through from the workflow env).
      - NOREPLY_PASSWORD
      - ME_PASSWORD
      - GMAIL_CLIENT_ID
      - GMAIL_CLIENT_SECRET
      - GMAIL_REFRESH_TOKEN
      - SIEM_API_URL=https://api.diegonmarcos.com/siem-api
      # Authoritative pointer for reports-common/context.rs::find_cloud_data_file
      # (checked FIRST, before cwd walk-up + $HOME fallback). On GHA the
      # consolidated json lives ONLY in the sibling `cloud` sparse-checkout,
      # mounted at /root/git/cloud-infra (line above) — but the container's HOME is
      # not /root, so the resolver's $HOME/git/cloud-infra/1_cloud-configs/dist
      # fallback computed /home/diego/... (unmounted) and health_full2 /
      # cloud-sec-network failed with "_cloud-data-consolidated.json not found".
      # Pinning the dir makes resolution deterministic. (build-reports.json is
      # symlinked into cloud-data and still resolves via walk-up; this just
      # adds the cloud SoT.)
      - CLOUD_DATA_DIR=/root/git/cloud-infra/1_cloud-configs/dist
      # 2026-08-19: app moved cloud-data/y_old/reports -> here
      # (cloud-infra/a_solutions/infra-obs_reports/src). Pin REPORTS_DIR to
      # the mounted cloud-infra checkout so entrypoint.sh's default (which
      # points at the image-baked clone path) isn't relied on for local runs.
      - REPORTS_DIR=/root/git/cloud-infra/a_solutions/infra-obs_reports/src
