[package]
name = "fincept-agents-hedgefund"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Multi-team hedge-fund orchestrator. Aggregates research/trading/risk team outputs into a decision."

[dependencies]
fincept-agents-core = { path = "../agents-core" }
fincept-agents-investors = { path = "../agents-investors" }
fincept-agents-economic = { path = "../agents-economic" }
fincept-agents-geopolitical = { path = "../agents-geopolitical" }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
