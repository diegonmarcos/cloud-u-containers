[package]
name = "fincept-eventbus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Cross-module event bus for imperative events (commands, UI triggers) — distinct from DataHub which is for data state"

[dependencies]
fincept-core = { path = "../core" }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread", "sync", "time"] }
