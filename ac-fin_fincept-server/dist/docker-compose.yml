services:
  fincept-server:
    image: ghcr.io/diegonmarcos/fincept-server:latest
    build:
      context: .
      dockerfile_inline: |
        FROM ghcr.io/diegonmarcos/fincept-server:latest
        COPY docker-compose.yml /opt/cloud-docs/docker-compose.yml
        LABEL org.opencontainers.image.source="https://github.com/diegonmarcos/cloud"
        LABEL org.opencontainers.image.description="fincept-server"
        LABEL org.opencontainers.image.title="fincept-server"
        LABEL cloud.diegonmarcos.from-image="ghcr.io/diegonmarcos/fincept-server:latest"
        LABEL cloud.diegonmarcos.registry="ghcr.io/diegonmarcos"
    container_name: fincept-server
    network_mode: host
    restart: no
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    dns:
      - 10.0.0.1
      - 1.1.1.1
    environment:
      FINCEPT_PORT: 8340
      RUST_LOG: info,tower_http=info
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
          pids: 256
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
