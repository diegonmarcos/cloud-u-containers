# Authelia Access Control Rule for NocoDB
# Add this to /authelia/configuration.yml on gcp-f-micro_1

# Under access_control.rules section, add:

- domain: db.diegonmarcos.com
  policy: two_factor
  subject:
    - "user:diego"

