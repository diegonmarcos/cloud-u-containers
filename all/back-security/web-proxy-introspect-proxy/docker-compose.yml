version: '3.8'

# Authelia Token Introspection Proxy
# Validates Bearer tokens via Authelia's OIDC introspection endpoint
# Deploy on gcp-f-micro_1 alongside NPM and Authelia

services:
  introspect-proxy:
    build: .
    image: introspect-proxy:latest
    container_name: introspect-proxy
    restart: unless-stopped
    ports:
      - "127.0.0.1:4182:4182"  # Internal only, NPM accesses via docker network
    environment:
      - INTROSPECT_URL=https://auth.diegonmarcos.com/api/oidc/introspection
      - CLIENT_ID=cli
      - CLIENT_SECRET=${AUTHELIA_CLI_SECRET}  # From .env file
      - DEBUG=false
    networks:
      - npm_default
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 32M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4182/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  npm_default:
    external: true

# Deployment:
# 1. Create .env file with AUTHELIA_CLI_SECRET
# 2. docker compose build
# 3. docker compose up -d
