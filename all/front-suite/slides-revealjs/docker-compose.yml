# RevealMD - Markdown to reveal.js presentations
# Easy markdown-based slides
# Deployed on: oci-p-flex_1 (Oracle Flex)

services:
  revealmd:
    image: webpronl/reveal-md:latest
    container_name: revealmd_app
    restart: "no"

    ports:
      - "3014:1948"

    volumes:
      - slides_data:/slides

    command: /slides --watch

    networks:
      - dev_network

    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:1948']
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  dev_network:
    external: true
    name: dev_network

volumes:
  slides_data:
    driver: local
