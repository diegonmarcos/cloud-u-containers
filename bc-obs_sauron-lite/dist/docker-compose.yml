services:
  forwarder:
    image: ghcr.io/diegonmarcos/sauron-forwarder:latest
    build:
      context: .
      dockerfile_inline: |
        FROM debian:bookworm-slim
        COPY forwarder.sh /forwarder.sh
        COPY docker-compose.yml /opt/cloud-docs/docker-compose.yml
        LABEL org.opencontainers.image.source="https://github.com/diegonmarcos/cloud"
        LABEL org.opencontainers.image.description="sauron-forwarder"
        LABEL org.opencontainers.image.title="sauron-forwarder"
        LABEL cloud.diegonmarcos.from-image="debian:bookworm-slim"
        LABEL cloud.diegonmarcos.registry="ghcr.io/diegonmarcos"
    container_name: sauron-forwarder
    network_mode: host
    entrypoint: ["/bin/sh", "/forwarder.sh"]
    restart: no
    stop_grace_period: 30s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    dns:
      - 10.0.0.1
      - 1.1.1.1
    environment:
      CENTRAL_HOST: 35.226.147.64
      CENTRAL_PORT: "5514"
    depends_on:
      sauron:
        condition: service_started
    volumes:
      - sauron_logs:/var/log/sauron:ro
    deploy:
      resources:
        limits:
          memory: 16m
          cpus: "0.05"
          pids: 256
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true

  sauron:
    image: ghcr.io/diegonmarcos/sauron:latest
    build: .
    container_name: sauron
    network_mode: host
    restart: no
    stop_grace_period: 30s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    dns:
      - 10.0.0.1
      - 1.1.1.1
    environment:
      ALERTS_FILE: /var/log/sauron/alerts.jsonl
      QUEUE_FILE: /var/spool/sauron/scan-queue.txt
      RULES_DIR: /etc/sauron/yara-rules
      TZ: Europe/Madrid
      VM_NAME: ${VM_NAME:-unknown}
      WATCH_DIRS: /watch/etc /watch/home
    volumes:
      - /etc:/watch/etc:ro
      - /home:/watch/home:ro
      - sauron_logs:/var/log/sauron
      - sauron_queue:/var/spool/sauron
    healthcheck:
      test: ["CMD", "pgrep", "-f", "inotifywait"]
      interval: 60s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 64m
          cpus: "0.25"
          pids: 256
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
volumes:
  sauron_logs:
  sauron_queue:
