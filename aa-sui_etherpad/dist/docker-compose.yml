services:
  etherpad:
    image: ghcr.io/diegonmarcos/etherpad:latest
    build:
      context: .
      dockerfile_inline: |
        FROM etherpad/etherpad:latest
        COPY docker-compose.yml /opt/cloud-docs/docker-compose.yml
        LABEL org.opencontainers.image.source="https://github.com/diegonmarcos/cloud"
        LABEL org.opencontainers.image.description="etherpad"
        LABEL org.opencontainers.image.title="etherpad"
        LABEL cloud.diegonmarcos.from-image="etherpad/etherpad:latest"
        LABEL cloud.diegonmarcos.registry="ghcr.io/diegonmarcos"
    container_name: etherpad_app
    network_mode: host
    restart: no
    stop_grace_period: 30s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    dns:
      - 10.0.0.1
      - 1.1.1.1
    environment:
      - TITLE=Etherpad
      - DEFAULT_PAD_TEXT=Welcome to Etherpad!
      - ADMIN_PASSWORD=${ETHERPAD_ADMIN_PASSWORD:-changeme}
      - DB_TYPE=postgres
      - DB_HOST=localhost
      - DB_PORT=5436
      - DB_NAME=etherpad
      - DB_USER=etherpad
      - DB_PASS=etherpad
      - TRUST_PROXY=true
      - LOGLEVEL=INFO
      - PORT=3012
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - etherpad_data:/opt/etherpad-lite/var
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3012/']
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
          pids: 256
        reservations:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true

  postgres:
    image: ghcr.io/diegonmarcos/etherpad-db:latest
    build:
      context: .
      dockerfile_inline: |
        FROM postgres:16-alpine
        COPY docker-compose.yml /opt/cloud-docs/docker-compose.yml
        LABEL org.opencontainers.image.source="https://github.com/diegonmarcos/cloud"
        LABEL org.opencontainers.image.description="etherpad-db"
        LABEL org.opencontainers.image.title="etherpad-db"
        LABEL cloud.diegonmarcos.from-image="postgres:16-alpine"
        LABEL cloud.diegonmarcos.registry="ghcr.io/diegonmarcos"
    container_name: etherpad_postgres
    network_mode: host
    entrypoint: ["sh", "-c", "chown -R postgres:postgres /var/lib/postgresql/data 2>/dev/null; exec docker-entrypoint.sh postgres"]
    restart: no
    stop_grace_period: 30s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    dns:
      - 10.0.0.1
      - 1.1.1.1
    environment:
      - POSTGRES_USER=etherpad
      - POSTGRES_PASSWORD=etherpad
      - POSTGRES_DB=etherpad
      - PGDATA=/var/lib/postgresql/data/pgdata
      - PGPORT=5436
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U etherpad -p 5436']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
          pids: 256
        reservations:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
networks:
  etherpad_net:
volumes:
  etherpad_data:
  postgres_data:
