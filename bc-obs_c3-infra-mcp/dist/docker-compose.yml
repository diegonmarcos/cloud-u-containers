services:
  c3-infra-mcp:
    image: ghcr.io/diegonmarcos/c3-infra-mcp:latest
    container_name: c3-infra-mcp
    network_mode: host
    restart: no
    stop_grace_period: 30s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    dns:
      - 10.0.0.1
      - 1.1.1.1
    env_file:
      - .secrets
    environment:
      - NODE_ENV=production
      - GIT_BASE=/root/git
      - MM_URL=http://mattermost.app
      - DAGU_API=http://10.0.0.3:8070
      - PATH=/usr/local/nix-bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      - MCP_HTTP_PORT=3100
    volumes:
      - /opt/ssh-keys/c3-infra-mcp:/root/.ssh:ro
      - /nix/store:/nix/store:ro
      - ~/.nix-profile/bin:/usr/local/nix-bin:ro
      - ~/.config/gcloud:/root/.config/gcloud
      - c3_git_repos:/root/git
    healthcheck:
      test: ["CMD-SHELL", "curl -so /dev/null -w '%{http_code}' http://localhost:3100/mcp | grep -qE '^[2-4]' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
          pids: 256
        reservations:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
volumes:
  c3_git_repos:
    external: true
    name: c3-mcp-api_c3-repos
