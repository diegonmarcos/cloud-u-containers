services:
  hedgedoc:
    image: ghcr.io/diegonmarcos/hedgedoc:latest
    build:
      context: .
      dockerfile_inline: |
        FROM quay.io/hedgedoc/hedgedoc:latest
        COPY docker-compose.yml /opt/cloud-docs/docker-compose.yml
        LABEL org.opencontainers.image.source="https://github.com/diegonmarcos/cloud"
        LABEL org.opencontainers.image.description="hedgedoc"
        LABEL org.opencontainers.image.title="hedgedoc"
        LABEL cloud.diegonmarcos.from-image="quay.io/hedgedoc/hedgedoc:latest"
        LABEL cloud.diegonmarcos.registry="ghcr.io/diegonmarcos"
    container_name: hedgedoc_app
    network_mode: host
    restart: no
    stop_grace_period: 30s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    dns:
      - 10.0.0.1
      - 1.1.1.1
    environment:
      - CMD_DOMAIN=doc.diegonmarcos.com
      - CMD_URL_ADDPORT=false
      - CMD_PROTOCOL_USESSL=true
      - CMD_DB_URL=postgres://hedgedoc:hedgedoc@localhost:5439/hedgedoc
      - CMD_ALLOW_EMAIL_REGISTER=true
      - CMD_EMAIL=true
      - CMD_ALLOW_FREEURL=true
      - CMD_ALLOW_ANONYMOUS=true
      - CMD_ALLOW_ANONYMOUS_EDITS=true
      - CMD_DEFAULT_PERMISSION=freely
      - CMD_SESSION_SECRET=${CMD_SESSION_SECRET:-hedgedoc-secret-change-me}
      - CMD_TRUST_PROXY=true
      - CMD_LOGLEVEL=info
      - CMD_PORT=3018
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - hedgedoc_uploads:/hedgedoc/public/uploads
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
          pids: 256
        reservations:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true

  postgres:
    image: ghcr.io/diegonmarcos/hedgedoc-db:latest
    build:
      context: .
      dockerfile_inline: |
        FROM postgres:16-alpine
        COPY docker-compose.yml /opt/cloud-docs/docker-compose.yml
        LABEL org.opencontainers.image.source="https://github.com/diegonmarcos/cloud"
        LABEL org.opencontainers.image.description="hedgedoc-db"
        LABEL org.opencontainers.image.title="hedgedoc-db"
        LABEL cloud.diegonmarcos.from-image="postgres:16-alpine"
        LABEL cloud.diegonmarcos.registry="ghcr.io/diegonmarcos"
    container_name: hedgedoc_postgres
    network_mode: host
    restart: no
    stop_grace_period: 30s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    dns:
      - 10.0.0.1
      - 1.1.1.1
    environment:
      - POSTGRES_USER=hedgedoc
      - POSTGRES_PASSWORD=hedgedoc
      - POSTGRES_DB=hedgedoc
      - PGDATA=/var/lib/postgresql/data/pgdata
      - PGPORT=5439
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hedgedoc -p 5439']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
          pids: 256
        reservations:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
volumes:
  hedgedoc_uploads:
  postgres_data:
