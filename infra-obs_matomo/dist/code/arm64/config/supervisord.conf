[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; ═══════════════════════════════════════════════════════════════════════════════
; ALWAYS ON - Lightweight receiver (~30-50MB)
; ═══════════════════════════════════════════════════════════════════════════════

[program:receiver-nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/receiver-nginx.log
stderr_logfile=/var/log/supervisor/receiver-nginx-error.log
priority=10

[program:receiver-php-fpm]
command=php-fpm8.2 --nodaemonize --fpm-config /etc/php/8.2/fpm/receiver-fpm.conf
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/receiver-fpm.log
stderr_logfile=/var/log/supervisor/receiver-fpm-error.log
priority=10

; ═══════════════════════════════════════════════════════════════════════════════
; ALWAYS ON - Full Matomo stack
; ═══════════════════════════════════════════════════════════════════════════════

[program:mariadb]
command=mariadbd --user=mysql
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/mariadb.log
stderr_logfile=/var/log/supervisor/mariadb-error.log
priority=20
stopwaitsecs=30

[program:matomo-php-fpm]
command=php-fpm8.2 --nodaemonize --fpm-config /etc/php/8.2/fpm/matomo-fpm.conf
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/matomo-fpm.log
stderr_logfile=/var/log/supervisor/matomo-fpm-error.log
priority=30

[program:matomo-nginx]
command=nginx -c /etc/nginx/matomo-nginx.conf -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/matomo-nginx.log
stderr_logfile=/var/log/supervisor/matomo-nginx-error.log
priority=30

[program:matomo-archiver]
command=/scripts/matomo-archiver.sh
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/matomo-archiver.log
stderr_logfile=/var/log/supervisor/matomo-archiver-error.log
priority=40
stopwaitsecs=10
