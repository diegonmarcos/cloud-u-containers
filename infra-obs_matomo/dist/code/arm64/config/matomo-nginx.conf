# Matomo Nginx - On-demand (port 18081, internal only)
#
# NOT 8081. The container runs with network_mode: host, so even a 127.0.0.1
# listener sits on the HOST's port table. c3-infra-api binds 10.0.0.6:8081, and
# the ship engine's socket eviction (cloud-ship-container-step-deploy-compose.sh,
# EVICT_SOCKET) matches by port only, ignoring the address: on 2026-10-10 the
# c3-infra-api deploy saw matomo-hybrid holding :8081 and `docker rm -f`-ed it.
# Matomo then sat ABSENT for three days because every later Ship skipped it as
# "unchanged". src/test-matomo-ports.sh keeps every port matomo binds off the
# ports any other service declares.
# Standard Matomo FPM nginx configuration
# Started/stopped via supervisor wake/sleep scripts

user www-data;
worker_processes 1;
pid /run/matomo-nginx.pid;
error_log /var/log/matomo-nginx/error.log warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/matomo-nginx/access.log;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    server {
        listen 127.0.0.1:18081;
        server_name _;

        root /var/www/html;
        index index.php index.html;

        # Matomo static files
        location / {
            try_files $uri $uri/ =404;
        }

        # PHP processing via Matomo FPM pool
        location ~ \.php$ {
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            try_files $fastcgi_script_name =404;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_param HTTP_PROXY "";
            fastcgi_pass unix:/run/php/matomo-fpm.sock;
            fastcgi_read_timeout 300;
        }

        # Deny access to sensitive files
        location ~ /\.ht {
            deny all;
        }

        location ~ /config/ {
            deny all;
        }

        location ~ /tmp/ {
            deny all;
        }

        location ~ /lang/ {
            deny all;
        }
    }
}
