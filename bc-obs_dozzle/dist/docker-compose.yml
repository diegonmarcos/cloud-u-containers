services:
  dozzle:
    image: ghcr.io/diegonmarcos/dozzle:latest
    build:
      context: .
      dockerfile_inline: |
        FROM amir20/dozzle:latest
        COPY docker-compose.yml /opt/cloud-docs/docker-compose.yml
        LABEL org.opencontainers.image.source="https://github.com/diegonmarcos/cloud"
        LABEL org.opencontainers.image.description="dozzle"
        LABEL org.opencontainers.image.title="dozzle"
