name: Geo-fence guard (#1102 - Europe and USA only on the public edge)

# Renders the public-edge Caddyfile, builds a Caddy with the image's plugins, loads the full
# rendered config and proves allow/deny/exempt behaviour with the pinned country database.
on:
  push:
    branches: [main]
    paths:
      - '_shared/geo-fence.json'
      - '_shared/test/geo-fence-*'
      - 'infra-sec_caddy-public/src/**'
      - '.github/workflows/geo-fence-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  geo-fence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { repository: diegonmarcos/cloudy-t-infra, path: _ci, sparse-checkout: '1_cloud-configs/dist' }
      - uses: cachix/install-nix-action@v27
      - uses: actions/setup-go@v5
        with: { go-version: '1.23' }
      - name: Geo-fence guard
        run: EDGE_JSON="$PWD/_ci/1_cloud-configs/dist/build-caddy-edge.json" bash _shared/test/geo-fence-ci.sh
