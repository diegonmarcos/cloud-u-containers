name: caddy render 1089 (render dist with the Nix generator, run the guards, publish the patch)

# One-shot (#1089). Applies the embedded src patch to a checkout of main, renders the hub
# Caddyfile with the repo's Nix generator (same render as test-multi-sso.sh), runs the
# fallback-redirect and resource-budget guards on the RENDERED dist, and uploads the full
# patch (src + rendered dist). Nothing is pushed by this job.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { repository: diegonmarcos/cloud-infra, path: _ci, sparse-checkout: '1_cloud-configs/dist' }
      - uses: cachix/install-nix-action@v27
      - name: Render helper
        run: |
          set -euo pipefail
          cat > /tmp/render.sh <<'SH'
          set -euo pipefail
          NIX="nix --extra-experimental-features nix-command --extra-experimental-features flakes"
          J=$(mktemp)
          jq --argjson m "$(jq -c '.caddy_config.edge_auth.multi_sso' infra-sec_caddy/build.json)" '.edge_auth.multi_sso=$m' _ci/1_cloud-configs/dist/build-caddy.json > "$J"
          $NIX eval --impure --raw --expr "let lib=((builtins.getFlake \"github:NixOS/nixpkgs/nixos-24.11\").lib); caddyRoutes=builtins.fromJSON (builtins.readFile $J); in import $PWD/infra-sec_caddy/src/caddyfile.nix { inherit lib caddyRoutes; }" > /tmp/render.txt
          D=infra-sec_caddy/dist/configs/Caddyfile
          n=$(grep -n -m1 -F -x -- "$(head -1 /tmp/render.txt)" "$D" | cut -d: -f1)
          { head -n $((n-1)) "$D"; cat /tmp/render.txt; } > /tmp/dist.new
          SH
      - name: Baseline - render of unpatched main equals the committed dist
        run: |
          bash /tmp/render.sh
          cmp /tmp/dist.new infra-sec_caddy/dist/configs/Caddyfile || { diff -u infra-sec_caddy/dist/configs/Caddyfile /tmp/dist.new | head -200; echo "baseline render differs from committed dist"; exit 1; }
      - name: Apply the src patch and render the dist
        run: |
          set -euo pipefail
          echo '' | base64 -d | gunzip > /tmp/relanding.patch
          git apply /tmp/relanding.patch
          bash /tmp/render.sh
          cp /tmp/dist.new infra-sec_caddy/dist/configs/Caddyfile
          grep -c 'invoke edge_error_pages' infra-sec_caddy/dist/configs/Caddyfile
      - name: Guards on the rendered dist
        run: |
          set -euo pipefail
          bash infra-sec_caddy/src/test/test-hub-resource-budget.sh
          bash infra-sec_caddy/src/test/test-fallback-redirect.sh
          bash _shared/test/fallback-pages-guard.sh
      - name: Publish the patch
        if: always()
        run: git add -N infra-sec_caddy/src/test && git diff > /tmp/final.patch; wc -l /tmp/final.patch
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: relanding-patch, path: /tmp/final.patch }
