name: licence inventory guard — every dependency, image, vendored dir and binary has an inventory entry

# WHY (#827, the #805 method). licenses/inventory.json is this repository's
# licence map: every top-level directory, every directory carrying a foreign
# LICENSE/COPYING/NOTICE (vendored Headroom, Bulwark webmail, ...), every font /
# binary, every Cargo / npm / PyPI / Go dependency, every flake input and every
# container image a Dockerfile, compose file or build.json names - each with its
# licence. A map nobody keeps whole is worse than none, because it reads as
# complete. This guard fails the push that adds a subject with no entry, naming
# it, so the entry lands in the same commit (licenses/curated.json, then
# `python3 .github/scripts/licence-inventory.py refresh .`).
#
# WHY NO PATH FILTER. The subjects it must catch are a new service directory, a
# new image or a new LICENSE anywhere in the tree; a filter would have to list
# "everything". The check reads build files and three JSON files, takes a couple
# of seconds and never touches the network: licence lookup happens only in
# `refresh`, run by hand.
#
# Not legal advice: green means the inventory is complete, not that the licences
# are compatible. LICENSING.md lists the known conflicts.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  licence-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The tester first: 17 must-fail and 5 must-pass cases on a fixture repo,
      # then 6 mutants of the guard that must each turn the suite red.
      - name: The check still fails when the inventory is incomplete
        run: bash .github/scripts/test-licence-inventory-guard.sh

      - name: Every dependency, image, vendored directory and binary has a licence entry
        run: python3 .github/scripts/licence-inventory.py check .
