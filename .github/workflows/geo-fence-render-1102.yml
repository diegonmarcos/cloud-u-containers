name: geo-fence render 1102 (apply the src patch, render the edge dist, run the guards, publish the patch)

# One-shot (#1102). Applies the embedded patch to main, renders the public-edge Caddyfile and
# Dockerfile dist with the repo's Nix generator, runs the geo-fence guard (full render,
# real-module validate, behaviour and mutation proofs) and the hub resource-budget/fallback
# guards, and uploads the full patch (src + rendered dist). Nothing is pushed by this job.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { repository: diegonmarcos/cloud-infra, path: _ci, sparse-checkout: '1_cloud-configs/dist' }
      - uses: cachix/install-nix-action@v27
      - uses: actions/setup-go@v5
        with: { go-version: '1.23' }
      - name: Render helper
        run: |
          set -euo pipefail
          cat > /tmp/render.sh <<'SH'
          set -euo pipefail
          NIX="nix --extra-experimental-features nix-command --extra-experimental-features flakes"
          E=$PWD/_ci/1_cloud-configs/dist/build-caddy-edge.json
          $NIX eval --impure --raw --expr "let lib=((builtins.getFlake \"github:NixOS/nixpkgs/nixos-24.11\").lib); caddyPublic=builtins.fromJSON (builtins.readFile $E); in import $PWD/infra-sec_caddy-public/src/caddyfile-public.nix { inherit lib caddyPublic; }" > /tmp/render.txt
          D=infra-sec_caddy-public/dist/configs/Caddyfile
          n=$(grep -n -m1 -F -x -- "$(head -1 /tmp/render.txt)" "$D" | cut -d: -f1)
          { head -n $((n-1)) "$D"; cat /tmp/render.txt; } > /tmp/dist.Caddyfile
          { head -n 10 infra-sec_caddy-public/dist/code/amd64/Dockerfile; cat infra-sec_caddy-public/src/code/Dockerfile; echo; } > /tmp/dist.Dockerfile
          SH
      - name: Baseline - render of unpatched main equals the committed dist
        run: |
          bash /tmp/render.sh
          cmp /tmp/dist.Caddyfile infra-sec_caddy-public/dist/configs/Caddyfile || { diff -u infra-sec_caddy-public/dist/configs/Caddyfile /tmp/dist.Caddyfile | head -150; echo "baseline Caddyfile render differs from committed dist"; exit 1; }
          cmp /tmp/dist.Dockerfile infra-sec_caddy-public/dist/code/amd64/Dockerfile || { diff -u infra-sec_caddy-public/dist/code/amd64/Dockerfile /tmp/dist.Dockerfile | head -50; echo "baseline Dockerfile differs"; exit 1; }
      - name: Apply the patch and render the dist
        run: |
          set -euo pipefail
          echo '' | base64 -d | gunzip > /tmp/geo.patch
          git apply /tmp/geo.patch
          bash /tmp/render.sh
          cp /tmp/dist.Caddyfile infra-sec_caddy-public/dist/configs/Caddyfile
          cp /tmp/dist.Dockerfile infra-sec_caddy-public/dist/code/amd64/Dockerfile
          grep -c 'import geo_fence' infra-sec_caddy-public/dist/configs/Caddyfile
      - name: Geo-fence guard
        run: EDGE_JSON="$PWD/_ci/1_cloud-configs/dist/build-caddy-edge.json" bash _shared/test/geo-fence-ci.sh
      - name: Hub resource-budget and fallback guards
        run: bash _shared/test/fallback-pages-guard.sh
      - name: Publish the patch
        if: always()
        run: git add -N _shared infra-sec_caddy-public; git add -N .github/workflows/geo-fence-guard.yml .github/workflows/geo-fence-refresh.yml 2>/dev/null || true; git diff > /tmp/final.patch; wc -l /tmp/final.patch
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: geo-fence-patch, path: /tmp/final.patch }
