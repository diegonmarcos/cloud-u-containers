services:
  siem-api:
    image: ghcr.io/diegonmarcos/sauron-api:latest
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.11-slim
        COPY api/app.py /app/app.py
        COPY docker-compose.yml /opt/cloud-docs/docker-compose.yml
        LABEL org.opencontainers.image.source="https://github.com/diegonmarcos/cloud"
        LABEL org.opencontainers.image.description="sauron-api"
        LABEL org.opencontainers.image.title="sauron-api"
        LABEL cloud.diegonmarcos.from-image="python:3.11-slim"
        LABEL cloud.diegonmarcos.registry="ghcr.io/diegonmarcos"
    container_name: siem-api
    network_mode: host
    command: ["python", "/app/app.py"]
    restart: no
    stop_grace_period: 30s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    dns:
      - 10.0.0.1
      - 1.1.1.1
    environment:
      - DB_PATH=/var/log/siem/alerts.db
    volumes:
      - siem-data:/var/log/siem:ro
    pids_limit: 256
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true

  syslog-central:
    image: ghcr.io/diegonmarcos/sauron-syslog:latest
    build:
      context: .
      dockerfile_inline: |
        FROM balabit/syslog-ng:4.4.0
        COPY syslog-ng-central.conf /etc/syslog-ng/syslog-ng.conf
        COPY docker-compose.yml /opt/cloud-docs/docker-compose.yml
        LABEL org.opencontainers.image.source="https://github.com/diegonmarcos/cloud"
        LABEL org.opencontainers.image.description="sauron-syslog"
        LABEL org.opencontainers.image.title="sauron-syslog"
        LABEL cloud.diegonmarcos.from-image="balabit/syslog-ng:4.4.0"
        LABEL cloud.diegonmarcos.registry="ghcr.io/diegonmarcos"
    container_name: syslog-central
    network_mode: host
    restart: no
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    dns:
      - 10.0.0.1
      - 1.1.1.1
    volumes:
      - siem-data:/var/log/siem
    pids_limit: 256
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
volumes:
  siem-data:
