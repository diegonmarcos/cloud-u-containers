services:
  borg:
    image: ghcr.io/diegonmarcos/backup-borg:latest
    build:
      context: .
      dockerfile_inline: |
        FROM alpine:3.19
        COPY authorized_keys /root/.ssh/authorized_keys
        COPY docker-compose.yml /opt/cloud-docs/docker-compose.yml
        LABEL org.opencontainers.image.source="https://github.com/diegonmarcos/cloud"
        LABEL org.opencontainers.image.description="backup-borg"
        LABEL org.opencontainers.image.title="backup-borg"
        LABEL cloud.diegonmarcos.from-image="alpine:3.19"
        LABEL cloud.diegonmarcos.registry="ghcr.io/diegonmarcos"
    container_name: borg-server
    network_mode: host
    command: sh -c "apk add --no-cache borgbackup openssh-server && mkdir -p /backup/media /root/.ssh && chmod 700 /root/.ssh && ssh-keygen -A && echo 'PermitRootLogin prohibit-password' >> /etc/ssh/sshd_config && /usr/sbin/sshd -D -p 2224"
    restart: no
    stop_grace_period: 30s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    dns:
      - 10.0.0.1
      - 1.1.1.1
    volumes:
      - borg_data:/backup/media
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
          pids: 256
        reservations:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  borg_data:
    driver: local
    driver_opts:
      device: /backup/media
      o: bind
      type: none
