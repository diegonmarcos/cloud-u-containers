services:
  photos-db:
    image: postgres:16-alpine
    container_name: photos-db
    network_mode: host
    environment:
      POSTGRES_DB: photos
      POSTGRES_USER: photos_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-SECURE_PASSWORD_HERE}
    volumes:
      - photos_db_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    restart: "no"  # container-init handles startup
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U photos_user -d photos"]
      interval: 10s
      timeout: 5s
      retries: 5

  photos-webhook:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: photos-webhook
    network_mode: host
    environment:
      DB_HOST: localhost
      DB_NAME: photos
      DB_USER: photos_user
      DB_PASSWORD: ${DB_PASSWORD:-SECURE_PASSWORD_HERE}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_REGION: eu-marseille-1
      S3_BUCKET: photos
      WEBHOOK_PORT: 5002
    depends_on:
      photos-db:
        condition: service_healthy
    volumes:
      - ./webhook.py:/app/webhook.py
      - ./requirements.txt:/app/requirements.txt
    restart: "no"  # container-init handles startup
    command: python webhook.py flask
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5002/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  photos_db_data:
    driver: local
