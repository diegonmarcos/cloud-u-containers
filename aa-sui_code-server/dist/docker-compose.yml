services:
  code-server:
    image: linuxserver/code-server:latest
    container_name: code-server
    network_mode: host
    restart: unless-stopped
    stop_grace_period: 30s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    dns:
      - 10.0.0.1
      - 1.1.1.1
    environment:
      DEFAULT_WORKSPACE: /workspace
      PGID: 1000
      PUID: 1000
      TZ: Europe/Madrid
    volumes:
      - ./config:/config
      - /home/ubuntu/workspace:/workspace
    pids_limit: 256
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
