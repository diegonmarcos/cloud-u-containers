services:
  code-server:
    image: ghcr.io/diegonmarcos/code-server:latest
    build:
      context: .
      dockerfile_inline: |
        FROM linuxserver/code-server:latest
        COPY docker-compose.yml /opt/cloud-docs/docker-compose.yml
        LABEL org.opencontainers.image.source="https://github.com/diegonmarcos/cloud"
        LABEL org.opencontainers.image.description="code-server"
        LABEL org.opencontainers.image.title="code-server"
        LABEL cloud.diegonmarcos.from-image="linuxserver/code-server:latest"
        LABEL cloud.diegonmarcos.registry="ghcr.io/diegonmarcos"
    container_name: code-server
    network_mode: host
    restart: no
    stop_grace_period: 30s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    dns:
      - 10.0.0.1
      - 1.1.1.1
    environment:
      DEFAULT_WORKSPACE: /workspace
      PGID: 1000
      PUID: 1000
      TZ: Europe/Madrid
    volumes:
      - code_server_config:/config
      - /home/ubuntu/workspace:/workspace
    pids_limit: 256
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
volumes:
  code_server_config:
