<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Sign in</title>
<!-- multi-SSO chooser (infra-sec_caddy edge_auth.multi_sso). Served on auth. and account. when no Authelia
     session exists. Authelia -> the Authelia portal (/?ui=authelia); Google / GitHub -> the auth broker
     (oauth2-proxy), allowlisted to the owner. The page holds no secret and no client id. -->
<style>
:root{--bg:#f6f7f9;--fg:#15171a;--card:#fff;--line:#d9dde3;--acc:#2b6cb0}
@media (prefers-color-scheme:dark){:root{--bg:#101215;--fg:#e8eaed;--card:#181b20;--line:#2c3139;--acc:#7fb2ee}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,sans-serif}
main{width:min(92vw,360px);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px}
h1{font-size:1.15rem;margin:0 0 4px}
p{margin:0 0 16px;font-size:.85rem;opacity:.75}
a.b{display:block;text-align:center;text-decoration:none;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:12px;margin:8px 0;font-weight:600}
a.b:hover,a.b:focus{border-color:var(--acc);outline:none}
#st{font-size:.8rem;margin-top:12px;min-height:1.2em;opacity:.8}
</style>
</head>
<body>
<main>
<h1>Sign in</h1>
<p id="host"></p>
<a class="b" id="authelia" href="#">Sign in with Authelia</a>
<a class="b" id="google" href="#">Sign in with Google</a>
<a class="b" id="github" href="#">Sign in with GitHub</a>
<div id="st"></div>
</main>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var rd = q.get("rd") || "";
  var enc = encodeURIComponent(rd);
  document.getElementById("host").textContent = location.host;
  // The Authelia portal always lives on auth.; account. hands over to it so both names behave the same.
  var authelia = "https://auth.diegonmarcos.com/?ui=authelia" + (rd ? "&rd=" + enc : "");
  document.getElementById("authelia").href = authelia;
  var back = rd || "/";
  ["google", "github"].forEach(function (p) {
    document.getElementById(p).href = "/oauth2/" + p + "/start?rd=" + encodeURIComponent(back);
  });
  // A live broker session shows up as 200 from the broker's own auth check.
  fetch("/oauth2/google/auth", { credentials: "same-origin" }).then(function (r) {
    if (r.status === 202 || r.status === 200) {
      var s = document.getElementById("st");
      s.textContent = "Signed in via Google/GitHub. ";
      var a = document.createElement("a");
      a.href = rd || "https://suite.diegonmarcos.com/";
      a.textContent = "Continue";
      s.appendChild(a);
    }
  }).catch(function () {});
})();
</script>
</body>
</html>
