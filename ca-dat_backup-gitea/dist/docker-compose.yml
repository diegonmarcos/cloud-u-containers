# Gitea - Self-hosted Git server for code mirrors
# Deploy to: oci-A1-f_1

services:
  gitea:
    image: ghcr.io/diegonmarcos/backup-gitea:latest
    build:
      context: .
      dockerfile_inline: |
        FROM gitea/gitea:latest
        COPY docker-compose.yml /opt/cloud-docs/docker-compose.yml
        LABEL org.opencontainers.image.source="https://github.com/diegonmarcos/cloud"
        LABEL org.opencontainers.image.description="backup-gitea"
        LABEL org.opencontainers.image.title="backup-gitea"
        LABEL cloud.diegonmarcos.from-image="gitea/gitea:latest"
        LABEL cloud.diegonmarcos.registry="ghcr.io/diegonmarcos"
    container_name: gitea
    restart: "no"  # container-init handles startup
    network_mode: host
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__database__DB_TYPE=sqlite3
      - GITEA__database__PATH=/data/gitea/gitea.db
      - GITEA__server__ROOT_URL=http://144.24.196.72:3002
      - GITEA__server__HTTP_PORT=3002
      - GITEA__server__SSH_PORT=2222
      - GITEA__server__SSH_DOMAIN=144.24.196.72
      - GITEA__server__SSH_LISTEN_PORT=2222
      - GITEA__mirror__ENABLED=true
      - GITEA__mirror__DEFAULT_INTERVAL=1h
    volumes:
      - gitea_data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro

volumes:
  gitea_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /backup/code/gitea-data
