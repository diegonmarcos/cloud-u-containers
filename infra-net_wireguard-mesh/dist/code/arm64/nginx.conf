# Minimal nginx config for wireguard-mesh static SPA.
# Listens on 8080 (non-privileged so the container can drop root).
# Caches aggressively for hashed assets, never for HTML.

server {
    listen      8080 default_server;
    server_name _;

    root        /usr/share/nginx/html;
    index       index.html;

    charset                  utf-8;
    sendfile                 on;
    tcp_nopush               on;
    tcp_nodelay              on;
    keepalive_timeout        30;
    server_tokens            off;
    gzip                     on;
    gzip_types               text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length          512;

    # Hash-immutable static assets (1 year)
    location ~* \.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Fonts / images — long cache
    location ~* \.(svg|png|jpg|jpeg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # HTML and JSON — never cache (snapshot freshness must reflect rebuilds)
    location ~* \.(html|json|json\.js)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # SPA fallback — every unknown path serves index.html (hash-router consumes path)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health endpoint — Caddy + docker healthcheck
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Security headers (Caddy at gcp-proxy adds the global ones; these are belt-and-suspenders)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "DENY"    always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
}
