# mautrix-whatsapp configuration (overrides). mautrix fills all omitted keys
# with its built-in defaults + auto-upgrades this file on startup. as_token /
# hs_token are ${PLACEHOLDERS} injected from .secrets by the deploy pre_hook —
# they are NEVER stored in this committed template.
homeserver:
    address: http://10.0.0.6:8008
    domain: diegonmarcos.com
    software: standard
    async_media: false

appservice:
    address: http://10.0.0.6:29318
    hostname: 10.0.0.6
    port: 29318
    id: whatsapp
    bot:
        username: whatsappbot
        displayname: WhatsApp bridge bot
        avatar: mxc://maunium.net/NeXNQarUbrlYBiPCpprYsRqr
    as_token: "${AS_TOKEN}"
    hs_token: "${HS_TOKEN}"

database:
    type: sqlite3-fk-wal
    uri: file:/data/mautrix-whatsapp.db?_txlock=immediate

bridge:
    permissions:
        "diegonmarcos.com": user
        "@diego:diegonmarcos.com": admin

double_puppet:
    secrets: {}

encryption:
    allow: true
    default: true
    require: false

logging:
    min_level: info
    writers:
        - type: stdout
          format: pretty-colored
