services:
  orchestrator:
    image: orchestrator:local
    build: .
    container_name: orchestrator
    network_mode: host
    restart: unless-stopped
    stop_grace_period: 30s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    dns:
      - 10.0.0.1
      - 1.1.1.1
    environment:
      - API_PORT=9100
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./orchestrator.sh:/app/orchestrator.sh:ro
      - ./manifest.json:/app/manifest.json:ro
      - orchestrator_state:/app/state
      - orchestrator_logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9100/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 64M
          pids: 256
        reservations:
          memory: 32M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  orchestrator_logs:
  orchestrator_state:
