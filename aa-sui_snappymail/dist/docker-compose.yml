services:
  snappymail:
    image: ghcr.io/diegonmarcos/snappymail:latest
    build:
      context: .
      dockerfile_inline: |
        FROM djmaze/snappymail:latest
        COPY docker-compose.yml /opt/cloud-docs/docker-compose.yml
        LABEL org.opencontainers.image.source="https://github.com/diegonmarcos/cloud"
        LABEL org.opencontainers.image.description="snappymail"
        LABEL org.opencontainers.image.title="snappymail"
        LABEL cloud.diegonmarcos.from-image="djmaze/snappymail:latest"
        LABEL cloud.diegonmarcos.registry="ghcr.io/diegonmarcos"
    container_name: snappymail
    network_mode: host
    entrypoint: ["/bin/sh", "-c", "cp -f /opt/snappymail-config/application.ini /var/lib/snappymail/_data_/_default_/configs/application.ini 2>/dev/null || true; exec /entrypoint.sh"]
    restart: no
    stop_grace_period: 30s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    dns:
      - 10.0.0.1
      - 1.1.1.1
    volumes:
      - snappymail_data:/var/lib/snappymail
      - ./config/application.ini:/opt/snappymail-config/application.ini:ro
      - ./config/domains:/var/lib/snappymail/_data_/_default_/domains
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:8888/']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "1.0"
          pids: 256
        reservations:
          memory: 16M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
volumes:
  snappymail_data:
