services:
  snappymail:
    image: djmaze/snappymail:latest
    container_name: snappymail
    network_mode: host
    restart: unless-stopped
    stop_grace_period: 30s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - ./data:/var/lib/snappymail
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:8888/']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 64M
          pids: 256
        reservations:
          memory: 16M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
