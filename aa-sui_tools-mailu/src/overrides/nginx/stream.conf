# Host networking stream proxy — front owns external mail ports
# Receives proxy protocol v2 from Caddy L4, forwards to internal services
# Replaces Docker port mapping that previously handled this

# IMAPS — TLS passthrough with proxy protocol to dovecot
server {
    listen 993;
    proxy_pass localhost:10143;
    proxy_protocol on;
}

# SMTPS (implicit TLS) — to postfix submission
server {
    listen 465;
    proxy_pass localhost:10025;
    proxy_protocol on;
}

# SMTP Submission (STARTTLS) — to postfix submission
server {
    listen 587;
    proxy_pass localhost:10587;
    proxy_protocol on;
}
