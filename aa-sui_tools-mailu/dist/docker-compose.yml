version: "3.8"

services:
  resolver:
    image: ghcr.io/mailu/unbound:2024.06
    env_file: mailu.env
    restart: always
    networks:
      default:
        ipv4_address: 192.168.203.254

  front:
    image: ghcr.io/mailu/nginx:2024.06
    env_file: mailu.env
    restart: always
    ports:
      - "10.0.0.3:8444:443"
      - "0.0.0.0:25:25"
      - "0.0.0.0:465:465"
      - "0.0.0.0:587:587"
      - "0.0.0.0:993:993"
    volumes:
      - "./certs:/certs"
      - "./overrides/nginx:/overrides:ro"
    depends_on:
      - resolver
    dns:
      - 192.168.203.254

  admin:
    image: ghcr.io/mailu/admin:2024.06
    env_file: mailu.env
    restart: always
    volumes:
      - "./data:/data"
      - "./dkim:/dkim"
    depends_on:
      - resolver
      - redis
    dns:
      - 192.168.203.254

  imap:
    image: ghcr.io/mailu/dovecot:2024.06
    env_file: mailu.env
    restart: always
    volumes:
      - "./mail:/mail"
      - "./overrides/dovecot:/overrides:ro"
    depends_on:
      - resolver
      - front
    dns:
      - 192.168.203.254

  smtp:
    image: ghcr.io/mailu/postfix:2024.06
    env_file: mailu.env
    restart: always
    volumes:
      - "./mailqueue:/queue"
      - "./overrides/postfix:/overrides:ro"
    depends_on:
      - resolver
      - front
    dns:
      - 192.168.203.254

  antispam:
    image: ghcr.io/mailu/rspamd:2024.06
    env_file: mailu.env
    restart: always
    volumes:
      - "./filter:/var/lib/rspamd"
      - "./overrides/rspamd:/overrides:ro"
    depends_on:
      - resolver
      - front
    dns:
      - 192.168.203.254

  redis:
    image: redis:7-bookworm
    restart: always
    volumes:
      - "./redis:/data"

  webmail:
    image: ghcr.io/mailu/webmail:2024.06
    env_file: mailu.env
    restart: always
    volumes:
      - "./webmail:/data"
      - "./overrides/roundcube:/overrides:ro"
    depends_on:
      - resolver
      - front
      - imap
    dns:
      - 192.168.203.254

networks:
  default:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 192.168.203.0/24
